<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Subathon — ZocaHub</title>

<!--
  ESTA PÁGINA VIROU UM DESVIO.

  Ela era a versão de antes do site ser uma página só. O que ela mostrava
  hoje mora em /subathon, junto do resto — e lá tem mais.

  NÃO FOI APAGADA de propósito: o endereço pode estar nos favoritos de
  alguém ou num link já mandado. Apagar quebraria esses; desviar leva a
  pessoa pro lugar certo sem ela precisar saber que algo mudou.

  E o pior caso não era o link quebrado, era o contrário: a página velha
  FUNCIONAVA. Quem a tivesse salva continuaria vendo uma tela que nunca mais
  receberia nada do que fosse construído — sem parecer quebrada, e sem
  nenhum jeito de desconfiar.
-->

<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #0E1411; color: #93A69B;
    font: 14px/1.6 system-ui, "Segoe UI", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  a { color: #3DD47F; }
</style>
</head>
<body>

<p>Isto agora fica no painel.<br><a id="ir" href="./#/subathon">Continuar</a></p>

<script>
(function () {
  'use strict';

  /* A CHAVE VIAJA JUNTO.

     Ela chega no # de duas formas, porque dois lugares diferentes montavam
     o link: "#chave=XYZ" (as páginas antigas entre si) e "#XYZ" (o
     entrar.php). As duas são aceitas.

     Guardar aqui funciona porque é o mesmo domínio e a mesma gaveta que o
     painel lê — 'zc:chave'. Sem isto, quem chegasse por um favorito com a
     chave no link cairia no painel deslogado. */
  try {
    var cru = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim();
    var k = cru.indexOf('chave=') === 0 ? cru.slice(6) : cru;
    if (k && k[0] !== '/') {
      try { localStorage.setItem('zc:chave', k); } catch (e) {}
      try { sessionStorage.setItem('zc:chave', k); } catch (e) {}
    }
  } catch (e) {}

  /* replace, e não href: senão o botão de voltar traz pra cá de novo e a
     pessoa fica presa num pingue-pongue. */
  try { location.replace('./#/subathon'); } catch (e) { location.href = './#/subathon'; }
})();
</script>
</body>
</html>
