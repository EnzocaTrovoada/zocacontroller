  const gUnid = h('span', { cls: 'd' });
  const gEspera = h('input', { type: 'number', min: '0', value: '10', style: 'flex:0 0 90px' });

  const listaGPassos = h('div');
  let gPassos = [{ acao: 'cena', argumento: '' }];
  let editandoGat = 0;

  function pintaGPassos() {
    listaGPassos.innerHTML = '';
    gPassos.forEach((pp, i) => {
      const sel = h('select', { style: 'flex:0 0 130px' });
      /* Panico e companhia nao aparecem: o servidor recusa, e oferecer o que
         vai ser recusado e armadilha. Evento nao se modera — um gatilho de
         panico no follow seria a live derrubada por quem clicasse em seguir. */
      DE_FABRICA.filter((c) => ['panico', 'voltar', 'ganhou'].indexOf(c[0]) === -1).forEach((c) => {
        const o = h('option', { value: c[0], txt: c[0] });
        if (c[0] === pp.acao) o.selected = true;
        sel.appendChild(o);
      });
      sel.onchange = () => { pp.acao = sel.value; };

      const arg = h('input', { type: 'text', placeholder: 'sem argumento', style: 'flex:1 1 130px' });
      arg.value = pp.argumento || '';
      arg.oninput = () => { pp.argumento = arg.value; };

      const tirar = h('button', { cls: 'bt mini perigo', type: 'button', txt: 'x', title: 'Tirar este passo' });
      tirar.onclick = () => {
        gPassos.splice(i, 1);
        if (!gPassos.length) gPassos = [{ acao: 'cena', argumento: '' }];
        pintaGPassos();
      };

      listaGPassos.appendChild(h('div', { cls: 'campo' }, [
        h('span', { style: 'flex:0 0 20px;font-size:12px;color:var(--apagado)', txt: (i + 1) + '.' }),
        sel, arg, tirar,
      ]));
    });
    const mais = h('button', { cls: 'bt mini', type: 'button', txt: '+ mais uma acao' });
    mais.disabled = gPassos.length >= 8;
    mais.onclick = () => { gPassos.push({ acao: 'fonte', argumento: '' }); pintaGPassos(); };
    listaGPassos.appendChild(h('p', { style: 'margin:4px 0 0' }, [mais]));
  }
  pintaGPassos();

  const pintaUnidade = () => { gUnid.textContent = unidadeDe(gEvento.value); };
  gEvento.onchange = pintaUnidade;
  pintaUnidade();

  const gSalvar = h('button', { cls: 'bt', type: 'button', txt: 'Criar gatilho' });
  const gLimpar = h('button', { cls: 'bt fraco escondido', type: 'button', txt: 'Cancelar' });

  const gLimpaForm = () => {
    editandoGat = 0;
    gEvento.value = 'sub'; gMin.value = '1'; gEspera.value = '10';
    gPassos = [{ acao: 'cena', argumento: '' }];
    pintaGPassos(); pintaUnidade();
    gSalvar.textContent = 'Criar gatilho';
    gLimpar.classList.add('escondido');
  };
  gLimpar.onclick = gLimpaForm;

  gSalvar.onclick = async () => {
    gSalvar.disabled = true;
    try {
      await api('/comandos.php', { method: 'POST', body: JSON.stringify({
        acao: 'gatilho', id: editandoGat, evento: gEvento.value,
        minimo: parseInt(gMin.value, 10) || 1,
        espera: parseInt(gEspera.value, 10) || 0,
        ligado: 1, passos: gPassos,
      }) });
      recado('Gatilho salvo. A ponte pega em ate um minuto.', 'bom');
      gLimpaForm();
      pintaGatilhos();
    } catch (e) { recado(e.message, 'ruim'); }
    gSalvar.disabled = false;
  };

  async function pintaGatilhos() {
    listaGat.innerHTML = '';
    let d;
    try { d = await api('/comandos.php'); } catch (e) { return; }

    const gs = d.gatilhos || [];
    if (!gs.length) {
      listaGat.appendChild(h('p', { cls: 'd', txt: 'Nenhum ainda.' }));
      return;
    }
    gs.forEach((g) => {
      const quando = rotuloDe(g.evento)
        + (g.minimo > 1 ? ' (a partir de ' + g.minimo + ' ' + unidadeDe(g.evento) + ')' : '');
      const oQue = (g.passos || [])
        .map((pp) => pp.acao + (pp.argumento ? ' ' + pp.argumento : '')).join(' -> ');

      const mexer = h('button', { cls: 'bt mini', type: 'button', txt: 'Editar' });
      mexer.onclick = () => {
        editandoGat = g.id;
        gEvento.value = g.evento; gMin.value = g.minimo; gEspera.value = g.espera;
        gPassos = (g.passos || []).map((pp) => ({ acao: pp.acao, argumento: pp.argumento || '' }));
        if (!gPassos.length) gPassos = [{ acao: 'cena', argumento: '' }];
        pintaGPassos(); pintaUnidade();
        gSalvar.textContent = 'Salvar gatilho';
        gLimpar.classList.remove('escondido');
      };

      const apagar = h('button', { cls: 'bt mini perigo', type: 'button', txt: 'Apagar' });
      apagar.onclick = async () => {
        try {
          await api('/comandos.php', { method: 'POST', body: JSON.stringify({ acao: 'gatilho-apagar', id: g.id }) });
          pintaGatilhos();
        } catch (e) { recado(e.message, 'ruim'); }
      };

      listaGat.appendChild(h('div', { cls: 'campo' }, [
        h('span', { cls: 'selo', txt: quando }),
        h('label', { style: 'flex:1 1 200px', txt: oQue }),
        mexer, apagar,
      ]));
    });
  }
  pintaGatilhos();

  gat.appendChild(h('div', { cls: 'campo' }, [h('label', { txt: 'Quando' }), gEvento]));
  gat.appendChild(h('div', { cls: 'campo' }, [h('label', { txt: 'A partir de' }), gMin, gUnid]));
  gat.appendChild(h('p', { cls: 'd', style: 'margin:-4px 0 10px', txt: 'Com o minimo em 1, uma live movimentada dispara o tempo todo. Dez subs de presente valem "10" de uma vez.' }));
  gat.appendChild(h('div', { cls: 'campo' }, [h('label', { txt: 'Faca' })]));
  gat.appendChild(listaGPassos);
  gat.appendChild(h('div', { cls: 'campo' }, [
    h('label', { txt: 'Espera entre disparos' }), gEspera, h('span', { cls: 'd', txt: 'segundos' }),
  ]));
  gat.appendChild(h('p', { cls: 'd', style: 'margin:-4px 0 10px', txt: 'Dez subs seguidos nao podem virar dez trocas de cena.' }));
  gat.appendChild(h('div', { cls: 'acoes', style: 'display:flex;gap:8px' }, [gSalvar, gLimpar]));
  tela.appendChild(gat);
}

/* A prévia devolve o arrasto por mensagem. Só aceito da mesma origem, e só
   as chaves de posição — nada mais entra na config por este caminho. */
const CHAVES_DE_POSICAO = ['nx', 'ny', 'tx', 'ty', 'bx', 'by', 'clarg', 'size'];
const PECA_PRO_CAMPO = { numero: 'size', nome: 'titulo', barra: 'bcor' };

window.addEventListener('message', (e) => {
  if (e.origin !== location.origin || !cfg) return;
  const d = e.data;
  if (!d) return;

  if (d.type === 'zc:moveu' && d.valores) {
    Object.keys(d.valores).forEach((k) => {
      if (CHAVES_DE_POSICAO.includes(k)) cfg[k] = d.valores[k];
    });
    return;
  }

  if (d.type === 'zc:soltou') {
    redesenhar.forEach((f) => f());
    marcaHistorico(true);     /* o arrasto inteiro é UM passo, não um por pixel */
    return;
  }

  if (d.type === 'zc:escolheu') {
    const alvo = camposPorChave[PECA_PRO_CAMPO[d.peca]];
    if (!alvo) return;
    if (alvo.grupo) alvo.grupo.open = true;
    alvo.linha.scrollIntoView({ block: 'center', behavior: 'smooth' });
    try { alvo.controle.focus(); alvo.controle.select && alvo.controle.select(); } catch (err) {}
  }
});


/* SUBATHON: Quanto cada coisa soma no cronometro. */
const REGRAS = [
  { k: 'seg_sub1',   nome: 'Sub',        obs: 'e Prime também',    padrao: 300 },
  { k: 'seg_sub2',   nome: 'Sub tier 2', obs: '',                  padrao: 600 },
  { k: 'seg_sub3',   nome: 'Sub tier 3', obs: '',                  padrao: 1500 },
  { k: 'seg_bits',   nome: 'Bits',       obs: 'a cada 100 bits',   padrao: 30 },
  { k: 'seg_real',   nome: 'Doação',     obs: 'por R$ 1 no LivePix', padrao: 60 },
  { k: 'seg_follow', nome: 'Follow',     obs: 'precisa ligar o aviso abaixo', padrao: 0 },
];

const paraMin = (seg) => Math.round((seg / 60) * 100) / 100;
const paraSeg = (min) => Math.round(parseFloat(String(min).replace(',', '.')) * 60) || 0;

async function telaSubathon() {
  const tela = el('tela');
  tela.innerHTML = '';
  tela.appendChild(h('h1', { txt: 'Subathon' }));
  tela.appendChild(h('p', { cls: 'sub', txt: 'Quanto cada sub, bit ou doação estica a sua live. Sub e bits chegam pelo chat sozinhos; follow e doação precisam de um passo a mais, logo abaixo.' }));

  let d = {};
  try { d = await api('/subathon.php'); } catch (e) { /* ainda não configurado */ }
  const regras = d.regras || {};

  /* ----- qual cronômetro ----- */
  const cronos = perfis.filter((p) => p.tipo === 'subathon');
  const fatiaAlvo = h('div', { cls: 'fatia' }, [
    h('h3', { txt: 'Qual cronômetro' }),
    h('p', { cls: 'd', txt: 'O tempo entra no overlay que você escolher aqui. Antes era preciso copiar um código do outro site — agora é só apontar.' }),
  ]);

  const selAlvo = h('select', { style: 'width:100%' });
  if (!cronos.length) {
    fatiaAlvo.appendChild(h('div', { cls: 'vazio', txt: 'Você ainda não tem um overlay de subathon.' }));
    const criar = h('button', { cls: 'bt principal', type: 'button', txt: '+ Criar cronômetro de subathon' });
    criar.onclick = () => vaiPara('#/novo/subathon');
    fatiaAlvo.appendChild(h('p', { style: 'margin:10px 0 0' }, [criar]));
  } else {
    cronos.forEach((c) => {
      const o = h('option', { value: String(c.id), txt: c.nome || 'Sem nome' });
      if (String(d.perfil_id) === String(c.id)) o.selected = true;
      selAlvo.appendChild(o);
    });
    fatiaAlvo.appendChild(h('div', { cls: 'campo' }, [h('label', { txt: 'Cronômetro' }), selAlvo]));
    if (!d.perfil_id && d.slug) {
      fatiaAlvo.appendChild(h('p', { cls: 'aviso', txt: 'Hoje isto aponta pro cronômetro ' + d.slug + ', lá no site do relógio. Ao salvar, passa a apontar pro overlay escolhido acima.' }));
    }
  }
  tela.appendChild(fatiaAlvo);

  /* ----- as regras ----- */
  const fatiaRegras = h('div', { cls: 'fatia' }, [
    h('h3', { txt: 'Quanto cada coisa soma' }),
    h('p', { cls: 'd', txt: 'Em minutos. Deixe em 0 o que você não quiser contar — some da conta e da legenda do overlay.' }),
  ]);
  const entradas = {};
  REGRAS.concat([{ k: 'teto_evento', nome: 'Teto por evento', obs: 'um cheer gigante não vira dois dias de live', padrao: 7200 }])
    .forEach((r) => {
      const inp = h('input', { type: 'text', inputmode: 'decimal' });
      inp.value = paraMin(regras[r.k] !== undefined ? regras[r.k] : r.padrao);
      entradas[r.k] = inp;
      const estado = h('span', { style: 'flex:0 0 62px;font-size:11.5px;text-align:right' });
      const pinta = () => {
        const off = paraSeg(inp.value) <= 0;
        estado.textContent = off ? 'não soma' : 'valendo';
        estado.style.color = off ? 'var(--apagado)' : 'var(--verde-forte)';
      };
      inp.oninput = pinta; pinta();
      fatiaRegras.appendChild(h('div', { cls: 'campo' }, [
        h('label', { txt: r.nome + (r.obs ? ' — ' + r.obs : '') }), inp,
        h('span', { style: 'flex:0 0 26px;font-size:12px;color:var(--apagado)', txt: 'min' }),
        estado,
      ]));
    });
  tela.appendChild(fatiaRegras);

  /* ----- meta de viewers ----- */
  const vAlvo = h('input', { type: 'number', min: '0' });
  const vSeg = h('input', { type: 'number', min: '0' });
  const vPasso = h('input', { type: 'number', min: '0' });
  vAlvo.value = d.viewers_alvo || 0;
  vSeg.value = Math.round((d.viewers_seg || 0) / 60 * 100) / 100;
  vPasso.value = d.viewers_passo || 0;

  const fatiaViewers = h('div', { cls: 'fatia' }, [
    h('h3', { txt: 'Meta de gente assistindo' }),
    h('p', { cls: 'd', txt: 'Bateu o número de espectadores, soma tempo — e o alvo sobe sozinho pro próximo. Deixe o alvo em 0 pra desligar.' }),
    h('div', { cls: 'campo' }, [h('label', { txt: 'Bater em' }), vAlvo,
      h('span', { style: 'flex:0 0 60px;font-size:12px;color:var(--apagado)', txt: 'pessoas' })]),
    h('div', { cls: 'campo' }, [h('label', { txt: 'Soma' }), vSeg,
      h('span', { style: 'flex:0 0 60px;font-size:12px;color:var(--apagado)', txt: 'min' })]),
    h('div', { cls: 'campo' }, [h('label', { txt: 'E o próximo alvo sobe' }), vPasso,
      h('span', { style: 'flex:0 0 60px;font-size:12px;color:var(--apagado)', txt: 'pessoas' })]),
    h('p', { cls: 'aviso', txt: 'A conta é conferida quando um overlay de meta de viewers está no ar — é ele que pergunta pra Twitch quantos estão assistindo. Sem esse overlay, a meta não dispara.' }),
  ]);
  tela.appendChild(fatiaViewers);

  /* ----- metas de seguidores e de subs ----- Mesma forma da de viewers,
     e por isso saem da mesma função em vez de três blocos quase iguais. */
  function fatiaMeta(chave, titulo, explica, unidade) {
    const alvo = h('input', { type: 'number', min: '0' });
    const seg = h('input', { type: 'number', min: '0' });
    const passo = h('input', { type: 'number', min: '0' });
    alvo.value = d[chave + '_alvo'] || 0;
    seg.value = Math.round((d[chave + '_seg'] || 0) / 60 * 100) / 100;
    passo.value = d[chave + '_passo'] || 0;

    const unid = (txt) => h('span', { style: 'flex:0 0 60px;font-size:12px;color:var(--apagado)', txt });

    tela.appendChild(h('div', { cls: 'fatia' }, [
      h('h3', { txt: titulo }),
      h('p', { cls: 'd', txt: explica }),
      h('div', { cls: 'campo' }, [h('label', { txt: 'Bater em' }), alvo, unid(unidade)]),
      h('div', { cls: 'campo' }, [h('label', { txt: 'Soma' }), seg, unid('min')]),
      h('div', { cls: 'campo' }, [h('label', { txt: 'E o próximo alvo sobe' }), passo, unid(unidade)]),
    ]));
    return { alvo, seg, passo };
  }

  const mSeg = fatiaMeta('seguidores', 'Meta de seguidores',
    'Chegou no número de seguidores, soma tempo — e o alvo sobe sozinho pro próximo. Deixe em 0 pra desligar.', 'seguidores');
  const mSub = fatiaMeta('subs', 'Meta de subs',
    'Chegou no número de assinantes, soma tempo — e o alvo sobe sozinho pro próximo. Deixe em 0 pra desligar.', 'subs');

  /* O LIVEPIX MORAVA SÓ NA TELA ANTIGA.

     Quem usa o hub nunca via onde configurar a doação — e então testava, o
     tempo não subia, e a conclusão era "o subathon não funciona com LivePix".
     Funciona; faltava a tela. O estado aparece junto porque "conectado mas
     nenhum aviso chegou" e "nem conectado" pedem coisas diferentes. */
  const lpEstado = h('p', { cls: 'd', txt: 'vendo…' });
  const lpId = h('input', { type: 'text', placeholder: 'Client ID' });
  const lpSec = h('input', { type: 'password', placeholder: 'Client Secret' });
  const lpBt = h('button', { cls: 'bt', type: 'button', txt: 'Conectar' });
  const lpUrl = h('div', { cls: 'escondido' });

  const lpMostraUrl = (url) => {
    lpUrl.innerHTML = '';
    if (!url) return;
    lpUrl.appendChild(h('p', { cls: 'd', style: 'margin:10px 0 4px',
      txt: 'Cole este endereço no webhook do LivePix (evento de pagamento):' }));
    lpUrl.appendChild(segredo(url));
    lpUrl.classList.remove('escondido');
  };

  async function lpVer() {
    try {
      const d = await api('/livepix.php');
      if (!d.configurado) {
        lpEstado.textContent = 'Não conectado. Sem isso, doação não soma tempo.';
        lpEstado.style.color = '';
        return;
      }
      lpId.value = d.client_id || '';
      lpBt.textContent = 'Trocar credenciais';
      lpMostraUrl(d.url);

      if (!d.ligado) {
        lpEstado.textContent = 'Desligado.';
        lpEstado.style.color = 'var(--perigo)';
      } else if (!d.ultimo_ok) {
        /* Este é o caso que o seu amigo viveu: as credenciais estão certas e
           mesmo assim nada chega, porque o webhook não foi criado lá. */
        lpEstado.textContent = 'Conectado, mas nenhuma doação chegou ainda. Se você já testou e não somou, o webhook não foi criado no LivePix — é o endereço aqui embaixo.';
        lpEstado.style.color = 'var(--perigo)';
      } else {
        lpEstado.textContent = 'Conectado, e a última doação chegou em '
          + new Date(String(d.ultimo_ok).replace(' ', 'T')).toLocaleString('pt-BR') + '.';
        lpEstado.style.color = 'var(--verde-forte)';
      }
    } catch (e) {
      lpEstado.textContent = 'Não consegui perguntar: ' + e.message;
    }
  }

  lpBt.onclick = async () => {
    const cid = lpId.value.trim(), sec = lpSec.value.trim();
    if (!cid || !sec) return recado('Cole o Client ID e o Client Secret.', 'ruim');
    lpBt.disabled = true;
    try {
      const d = await api('/livepix.php', { method: 'POST', body: JSON.stringify({ client_id: cid, client_secret: sec }) });
      lpSec.value = '';
      lpMostraUrl(d.url);
      recado('LivePix conectado. Agora crie o webhook lá com o endereço que apareceu.', 'bom');
    } catch (e) { recado(e.message, 'ruim'); }
    lpBt.disabled = false;
    lpVer();
  };

  tela.appendChild(h('div', { cls: 'fatia' }, [
    h('h3', { txt: 'Doação pelo LivePix' }),
    h('p', { cls: 'd', txt: 'São dois passos, e o segundo é o que costuma faltar: conectar a conta aqui, e depois criar o webhook no painel do LivePix com o endereço que vai aparecer. Sem o webhook o LivePix não avisa ninguém, e o tempo não sobe.' }),
    lpEstado,
    h('div', { cls: 'campo' }, [h('label', { txt: 'Client ID' }), lpId]),
    h('div', { cls: 'campo' }, [h('label', { txt: 'Client Secret' }), lpSec]),
    h('div', { cls: 'acoes', style: 'display:flex;gap:8px' }, [lpBt]),
    lpUrl,
  ]));
  lpVer();

  /* O DIAGNÓSTICO DA CONTAGEM: Sem isto, quando a Twitch recusa a leitura
     de seguidores a meta fica parada no número antigo e a pessoa acha que
     o overlay quebrou. */
  const diag = h('p', { cls: 'd' });
  const fatiaDiag = h('div', { cls: 'fatia' }, [
    h('h3', { txt: 'A Twitch está respondendo?' }),
    diag,
  ]);
  tela.appendChild(fatiaDiag);

  (async () => {
    diag.textContent = 'Perguntando…';
    try {
      const r = await api('/contagem.php?fonte=seguidores');
      if (r.ok && r.valor !== null) {
        diag.textContent = 'Sim: o canal tem ' + r.valor.toLocaleString('pt-BR')
          + (r.valor === 1 ? ' seguidor.' : ' seguidores.');
        diag.style.color = 'var(--verde-forte)';
        return;
      }
      diag.textContent = r.explica || 'Não consegui ler os seguidores agora.';
      diag.style.color = 'var(--perigo)';
      /* O código cru embaixo, pequeno. Feio, mas é o que me deixa consertar
         sem ficar adivinhando pelo print de quem reportou. */
      if (r.codigo) {
        fatiaDiag.appendChild(h('p', { cls: 'd', style: 'margin:6px 0 0;opacity:.6;font-size:11px',
                                       txt: 'código: ' + r.codigo }));
      }
      if (r.falta_escopo) {
        const b = h('button', { cls: 'bt mini', type: 'button', txt: 'Entrar de novo na Twitch' });
        b.onclick = () => { location.href = API + '/entrar.php'; };
        fatiaDiag.appendChild(h('p', { style: 'margin:8px 0 0' }, [b]));
      }
    } catch (e) {
      diag.textContent = 'Não consegui perguntar: ' + e.message;
      diag.style.color = 'var(--perigo)';
    }
  })();

  /* ----- follow ----- */
  const fatiaFollow = h('div', { cls: 'fatia' }, [
    h('h3', { txt: 'Aviso de follow' }),
    h('p', { cls: 'd', txt: 'Sub e bits a gente lê do chat. Follow a Twitch só conta se a gente pedir — é um clique, uma vez só.' }),
  ]);
  const estFollow = h('span', { style: 'flex:1;font-size:13px;color:var(--apagado)', txt: 'conferindo…' });
  const btFollow = h('button', { cls: 'bt', type: 'button', txt: 'Ligar o aviso de follow' });
  btFollow.onclick = async () => {
    btFollow.disabled = true;
    try {
      const r = await api('/eventsub.php', { method: 'POST', body: '{}' });
      if (r.erros && r.erros.length) recado(r.erros[0], 'ruim');
      else recado('Pronto. A partir de agora follow também soma.', 'bom');
    } catch (e) { recado(e.message, 'ruim'); }
    veFollow();
  };
  async function veFollow() {
    try {
      const r = await api('/eventsub.php');
      const on = (r.assinaturas || []).some((a) => a.tipo === 'channel.follow' && a.estado !== 'revoked');
      if (r.falta_escopo) {
        estFollow.textContent = 'falta permissão — entre de novo com a Twitch';
        btFollow.disabled = true;
      } else {
        estFollow.textContent = on ? 'ligado' : 'desligado';
        estFollow.style.color = on ? 'var(--verde-forte)' : 'var(--apagado)';
        btFollow.disabled = on;
        if (on) btFollow.textContent = 'Já está ligado';
      }
    } catch (e) { estFollow.textContent = 'não consegui conferir'; }
  }
  fatiaFollow.appendChild(h('div', { cls: 'campo' }, [estFollow, btFollow]));
  tela.appendChild(fatiaFollow);
  veFollow();

  /* ----- salvar ----- */
  const btSalvar = h('button', { cls: 'bt principal', type: 'button', txt: 'Salvar' });
  const btLigar = h('button', { cls: 'bt', type: 'button', txt: (d.ligado === false) ? 'Ligar' : 'Desligar' });
  let ligado = d.ligado !== false;

  async function grava(trocaLigado) {
    if (trocaLigado) ligado = !ligado;
    const corpo = {};
    Object.keys(entradas).forEach((k) => { corpo[k] = paraSeg(entradas[k].value); });
    if (!corpo.teto_evento) corpo.teto_evento = 7200;
    corpo.viewers_alvo = Math.max(0, parseInt(vAlvo.value, 10) || 0);
    corpo.viewers_seg = paraSeg(vSeg.value);
    corpo.viewers_passo = Math.max(0, parseInt(vPasso.value, 10) || 0);
    for (const [nome, campos] of [['seguidores', mSeg], ['subs', mSub]]) {
      corpo[nome + '_alvo'] = Math.max(0, parseInt(campos.alvo.value, 10) || 0);
      corpo[nome + '_seg'] = paraSeg(campos.seg.value);
      corpo[nome + '_passo'] = Math.max(0, parseInt(campos.passo.value, 10) || 0);
    }
    if (cronos.length) corpo.perfil_id = parseInt(selAlvo.value, 10);
    else if (d.slug) { corpo.slug = d.slug; corpo.token = d.token || ''; }
    if (!ligado) corpo.desligar = 1;

    btSalvar.disabled = true;
    try {
      const r = await api('/subathon.php', { method: 'POST', body: JSON.stringify(corpo) });
      btLigar.textContent = ligado ? 'Desligar' : 'Ligar';
      recado(r.aviso || (ligado ? 'Salvo. O subathon já está contando sozinho.' : 'Salvo, e desligado — nada vai somar.'),
             r.aviso ? 'ruim' : 'bom');
    } catch (e) { recado(e.message, 'ruim'); }
    btSalvar.disabled = false;
  }
  btSalvar.onclick = () => grava(false);
  btLigar.onclick = () => grava(true);
  tela.appendChild(h('p', { style: 'display:flex;gap:8px;margin-top:14px' }, [btSalvar, btLigar]));
}

  tela.appendChild(h('p', { cls: 'sub', txt: 'Cada moderador ganha um link só dele. Assim você tira o acesso de uma pessoa sem derrubar o de todo mundo.' }));

    const dias = Math.floor(c.usado_ha / 86400);
    if (dias <= 0) return ['usou hoje', 'var(--verde-forte)'];
    if (dias === 1) return ['usou ontem', 'var(--verde-forte)'];
    if (dias < 14) return ['há ' + dias + ' dias', 'var(--apagado)'];

          catch (e) { recado(e.message, 'ruim'); }
        };
        linha.appendChild(bt);
      }
      cx.appendChild(linha);
    });
  }
  lista();
}

function vaiPara(hash) { if (location.hash === hash) rota(); else location.hash = hash; }

function rota() {
  recado('');
  const p = (location.hash || '#/overlays').replace(/^#\//, '').split('/');
  if (p[0] === 'meu') return telaControlador();
  if (p[0] === 'comandos') return telaComandos();
  if (p[0] === 'tutorial') return telaTutorial();
  if (p[0] === 'admin') return telaAdmin();
  if (p[0] === 'subathon') return telaSubathon();
  if (p[0] === 'mods') return telaMods();
  if (p[0] === 'novo' && TIPOS[p[1]]) return telaEditor(null, p[1]);
  if (p[0] === 'editar') {
    const perfil = perfis.find((x) => String(x.id) === String(p[1]));
    if (perfil) return telaEditor(perfil, null);
    return telaLista(null);
  }
  telaLista(TIPOS[p[1]] ? p[1] : null);
}
window.addEventListener('hashchange', rota);

function pintaQuemSou() {

async function carrega() {
  let ultimoErro = null;

  /* TRÊS TENTATIVAS ANTES DE DESISTIR.

     Quase toda falha aqui é um soluço de rede de um segundo. Desistir na
     primeira transforma isso numa tela de erro no meio da live, por nada. */
  for (let tentativa = 0; tentativa < 3; tentativa++) {
    try {
      const d = await api('/perfil.php');
      perfis = d.perfis || [];
      quemSou = d.login || '';
      souAdmin = !!d.admin;
      listaVelha = false;
      erroCarga = null;
      guardaListaLocal(perfis);
      pintaQuemSou();
      el('semChave').classList.add('escondido');
      return true;
    } catch (e) {
      ultimoErro = e;
      if (e.status === 401 || e.status === 403) break;
      if (tentativa < 2) await new Promise((ok) => setTimeout(ok, 700 * (tentativa + 1)));
    }
  }

  {
    const e = ultimoErro;
    /* CHAVE VELHA NÃO É LISTA VAZIA.

       Entrar de novo na Twitch gera uma chave nova — a antiga é guardada com
       hash e não dá pra devolver. Quem abrisse o site por um link salvo com a
       chave antiga levava 401 aqui, e a tela mostrava "nenhum overlay ainda".
       Ou seja: a pessoa via os overlays dela sumirem sem ter perdido nada.

       Nada foi apagado nesse caso, e a tela precisa dizer isso. */
    if (e.status === 401 || e.status === 403) {
      esqueceChave();
      const cx = el('semChave');
      const p2 = cx.querySelector('p');
      if (p2) p2.textContent = 'Esta chave não vale mais — ela troca quando você entra de novo na Twitch. '
        + 'Nada foi apagado: seus overlays continuam no lugar e os que já estão no OBS continuam funcionando. '
        + 'Entre de novo pra pegar a chave nova.';
      cx.classList.remove('escondido');
      el('tela').innerHTML = '';
      return false;
    }
    /* Falha que NÃO é de chave não pode apagar a tela: um soluço do servidor
        deixaria a pessoa olhando pra nada, sem nem saber o que houve. Avisa e
        segue com a lista vazia, que é recuperável. */
    /* FALHA DE LEITURA NÃO É LISTA VAZIA.

       Este era o buraco. Toda falha que não fosse de chave caía aqui, a
       lista continuava vazia e a tela desenhava "Nenhum overlay ainda" — a
       mesma frase de quem nunca criou nada. Agora a tela sabe que a lista é
       velha, diz isso, e mostra os overlays que dá pra mostrar. */
    erroCarga = e;
    listaVelha = true;
    perfis = leListaLocal();
    recado(e.message, 'ruim');
    return true;
  }
}

  montaBandejas();
  if (!chave) { el('semChave').classList.remove('escondido'); return; }
  if (!await carrega()) return;
  ligaUpgrade();
  rota();
})();
</script>
