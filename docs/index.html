/* Sem acento e sem caixa: quem digita "musica" tem que achar "Música". */
const semAcento = (s) => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

function ligaBusca() {
  const campo = el('buscaCampo');
  if (!campo) return;

  const lista = h('div', { cls: 'busca__lista escondido' });
  el('busca').appendChild(lista);

  let achados = [];
  let marcado = -1;

  const fecha = () => { lista.classList.add('escondido'); marcado = -1; };

  const pinta = () => {
    lista.innerHTML = '';
    achados.forEach((it, i) => {
      const b = h('button', { cls: 'busca__item' + (i === marcado ? ' on' : ''), type: 'button' },
        [document.createTextNode(it.nome), h('small', { txt: it.dica })]);
      b.onclick = () => { campo.value = ''; fecha(); vaiPara(it.hash); };
      lista.appendChild(b);
    });
    lista.classList.toggle('escondido', !achados.length);
  };

  campo.oninput = () => {
    const q = semAcento(campo.value.trim());
    if (!q) { achados = []; return fecha(); }
    achados = itensDaBusca()
      .filter((it) => semAcento(it.nome).includes(q) || semAcento(it.dica).includes(q))
      .slice(0, 8);
    marcado = achados.length ? 0 : -1;
    pinta();
  };

  campo.onkeydown = (e) => {
    if (e.key === 'Escape') { campo.value = ''; return fecha(); }
    if (!achados.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); marcado = (marcado + 1) % achados.length; pinta(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); marcado = (marcado - 1 + achados.length) % achados.length; pinta(); }
    else if (e.key === 'Enter' && achados[marcado]) {
      e.preventDefault();
      const it = achados[marcado];
      campo.value = ''; fecha(); vaiPara(it.hash);
    }
  };

  campo.onblur = () => setTimeout(fecha, 150);
  campo.onfocus = () => { if (achados.length) lista.classList.remove('escondido'); };
}

/* ---------------- textos editáveis ---------------- */

/* O QUE ISTO FAZ, EM UMA FRASE: troca qualquer frase da tela por outra que o
   administrador escreveu, sem que nenhuma dessas frases precise ter sido
   marcada no código.

   Como não existe lista de chaves, a chave é o próprio texto original. O
   servidor guarda { "texto original": "texto novo" }, e aqui a gente
   percorre os nós de texto trocando o que bater.

   O PREÇO, e é proposital: mudar a frase no código faz a edição parar de
   valer, porque a chave era a frase antiga. Uma frase reescrita quase sempre
   mudou de sentido, e manter por cima dela a edição velha seria pior do que
   perdê-la. */

let TEXTOS = {};
let modoEdicao = false;

// CSS que o admin escreveu, aplicado depois da folha do site pra poder vencer.
// ?semcss=1 pula ele: é a saída de emergência pra quando o CSS quebra o
// painel e o painel é justamente onde se conserta.
function carregaEstilo() {
  if (SEM_CSS) return Promise.resolve();
  return fetch(API + '/estilo.php', { cache: 'no-cache' })
    .then((r) => (r.ok ? r.json() : null))
    .then((d) => {
      if (!d || !d.css) return;
      const tag = document.createElement('style');
      tag.id = 'cssExtra';
      tag.textContent = d.css;
      document.head.appendChild(tag);
    })
    .catch(() => {});
}

/* Onde NÃO mexer. Campo de formulário tem valor, não texto; script e style
   não são conteúdo; e a própria caixa de edição não pode se auto-traduzir
   enquanto está sendo usada. */
const EDIT_FORA = { SCRIPT: 1, STYLE: 1, TEXTAREA: 1, INPUT: 1, SELECT: 1, OPTION: 1, IFRAME: 1 };

function textoNos(raiz) {
  const saida = [];
  const it = document.createNodeIterator(raiz, NodeFilter.SHOW_TEXT, {
    acceptNode(no) {
      if (!no.nodeValue || !no.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      const pai = no.parentElement;
      if (!pai || EDIT_FORA[pai.tagName]) return NodeFilter.FILTER_REJECT;
      if (pai.closest('.edicao')) return NodeFilter.FILTER_REJECT;
      /* A BARRA DE CIMA FICA DE FORA.

         Ela é o que te tira do modo de edição e o que leva pra outra tela.
         Editável, o botão "Sair da edição" abriria a caixa de reescrever em
         vez de sair — e sem as abas não dava pra ir editar as outras telas.
         O preço é não poder renomear as abas por aqui, e é um preço barato:
         são cinco palavras, contra ficar preso na tela em que ligou. */
      if (pai.closest('.barra')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    },
  });
  let n;
  while ((n = it.nextNode())) saida.push(n);
  return saida;
}

function aplicaTextos(raiz) {
  if (!TEXTOS || !Object.keys(TEXTOS).length) return;
  textoNos(raiz || document.body).forEach((no) => {
    const cru = no.nodeValue.trim();
    const novo = TEXTOS[cru];
    /* Compara com o que já está escrito pra não reescrever o mesmo nó a cada
       passada — o observador abaixo dispara muito, e trocar nodeValue sem
       necessidade faria o navegador repintar à toa. */
    if (novo && novo !== cru) no.nodeValue = no.nodeValue.replace(cru, novo);
  });
}

/* A tela é montada por JavaScript o tempo todo, então não dá pra aplicar uma
   vez só na carga: o observador pega tudo que nasce depois. */
function observaTextos() {
  const obs = new MutationObserver((muts) => {
    muts.forEach((m) => m.addedNodes.forEach((n) => {
      if (n.nodeType === 1) aplicaTextos(n);
      else if (n.nodeType === 3 && n.parentElement) aplicaTextos(n.parentElement);
    }));
    if (modoEdicao) marcaEditaveis();
  });
  obs.observe(document.body, { childList: true, subtree: true });
}

function carregaTextos() {
  return fetch(API + '/textos.php', { cache: 'no-cache' })
    .then((r) => (r.ok ? r.json() : null))
    .then((d) => { TEXTOS = (d && d.textos) || {}; aplicaTextos(document.body); })
    .catch(() => { /* sem substituição: valem os textos do código */ });
}

/* ---------------- a edição em si ---------------- */

/* Marca o ELEMENTO que contém o texto, e não o nó: nó de texto não recebe
   contorno nem clique. */
function marcaEditaveis() {
  textoNos(document.body).forEach((no) => {
    const pai = no.parentElement;
    if (!pai || pai.hasAttribute('data-edit')) return;
    pai.setAttribute('data-edit', '1');
    if (TEXTOS[no.nodeValue.trim()]) pai.setAttribute('data-edit-mudado', '1');
  });
}

function limpaEditaveis() {
  document.querySelectorAll('[data-edit]').forEach((e) => {
    e.removeAttribute('data-edit');
    e.removeAttribute('data-edit-mudado');
  });
}

let caixaEdicao = null;

function fechaEdicao() {
  if (caixaEdicao) { caixaEdicao.remove(); caixaEdicao = null; }
}

function abreEdicao(no) {
  fechaEdicao();

  const atual = no.nodeValue.trim();
  /* O original é o que está no CÓDIGO, e não o que está na tela: se já houve
     substituição, editar de novo precisa continuar apontando pra mesma
     chave, senão cada edição criaria uma linha nova. */
  let original = atual;
  Object.keys(TEXTOS).forEach((k) => { if (TEXTOS[k] === atual) original = k; });

  const area = h('textarea');
  area.value = atual;

  const salvar = h('button', { cls: 'bt principal mini', type: 'button', txt: 'Salvar' });
  const voltar = h('button', { cls: 'bt mini', type: 'button', txt: 'Voltar ao original' });
  const fechar = h('button', { cls: 'bt fraco mini', type: 'button', txt: 'Fechar' });
  const diz = h('span', { cls: 'd', style: 'font-size:12px' });

  voltar.disabled = !TEXTOS[original];

  salvar.onclick = async () => {
    salvar.disabled = true;
    diz.textContent = 'salvando…';
    try {
      await api('/textos.php', { method: 'POST',
        body: JSON.stringify({ acao: 'salvar', original, valor: area.value }) });
      if (area.value.trim() === original) delete TEXTOS[original];
      else TEXTOS[original] = area.value.trim();
      no.nodeValue = no.nodeValue.replace(atual, area.value.trim());
      fechaEdicao();
      recado('Texto salvo.', 'bom');
    } catch (e) {
      diz.textContent = e.message;
      salvar.disabled = false;
    }
  };

  voltar.onclick = async () => {
    voltar.disabled = true;
    try {
      await api('/textos.php', { method: 'POST',
        body: JSON.stringify({ acao: 'apagar', original }) });
      delete TEXTOS[original];
      no.nodeValue = no.nodeValue.replace(atual, original);
      fechaEdicao();
      recado('Voltou ao texto original.', 'bom');
    } catch (e) { diz.textContent = e.message; voltar.disabled = false; }
  };

  fechar.onclick = fechaEdicao;

  caixaEdicao = h('div', { cls: 'edicao' }, [
    h('div', { cls: 'w2' }, [
      h('div', { cls: 'antes', txt: 'Original: ' + original }),
      area,
      h('div', { cls: 'botoes' }, [salvar, voltar, fechar, diz]),
    ]),
  ]);
  document.body.appendChild(caixaEdicao);
  area.focus();
}

function ligaModoEdicao(liga) {
  modoEdicao = liga;
  document.body.classList.toggle('editando', liga);
  el('abaTextos').classList.toggle('editando', liga);
  el('abaTextos').textContent = liga ? 'Sair da edição' : 'Editar textos';
  if (liga) marcaEditaveis(); else { limpaEditaveis(); fechaEdicao(); }
}

document.addEventListener('click', (e) => {
  if (!modoEdicao) return;
  /* A barra continua clicável: é por ela que se sai do modo e se troca de
     tela. Sem esta linha, ligar a edição prendia a pessoa onde estava. */
  if (e.target.closest('.barra')) return;

  const alvo = e.target.closest('[data-edit]');
  if (!alvo || alvo.closest('.edicao')) return;

  /* Pega o nó de texto de verdade dentro do elemento clicado. */
  const no = [...alvo.childNodes].find((n) => n.nodeType === 3 && n.nodeValue.trim());
  if (!no) return;

  /* Em modo de edição o clique é pra editar, nunca pra acionar o botão. */
  e.preventDefault();
  e.stopPropagation();
  abreEdicao(no);
}, true);

el('abaTextos').onclick = () => { fechaBandejas(null); ligaModoEdicao(!modoEdicao); };

  const dizCupom = (txt, bom) => {
    cupomDiz.textContent = txt;
    cupomDiz.style.color = bom ? 'var(--verde-forte)' : 'var(--perigo)';
    cupomDiz.classList.remove('escondido');
  };

  btCupom.onclick = async () => {
    const cod = campoCupom.value.trim();
    if (!cod) return;
    btCupom.disabled = true;
    cupomDiz.classList.add('escondido');

    try {
      /* Pergunta por plano, e não uma vez só: um cupom percentual vale
         valores diferentes no mensal e no vitalício, e mostrar um número
         que não é o que vai ser cobrado é pior do que não mostrar. */
      const lista2 = estado.planos || [];
      const contas = await Promise.all(lista2.map((pl) =>
        api('/checkout.php?cupom_teste=' + encodeURIComponent(cod) + '&plano=' + encodeURIComponent(pl.slug))
          .catch(() => null)));

      const bom = contas.find((c) => c && c.ok);
      if (!bom) {
        const ruim = contas.find((c) => c && c.erro);
        cupomAtivo = '';
        lista2.forEach((_, i) => pintaPreco(i, null));
        return dizCupom(ruim ? ruim.erro : 'Esse código não vale.', false);
      }

      cupomAtivo = bom.codigo;
      contas.forEach((c, i) => pintaPreco(i, c && c.ok ? c : null));
      dizCupom(bom.rotulo + (bom.descricao ? ' — ' + bom.descricao : '') + '. Aplicado.', true);
    } catch (e) {
      dizCupom(e.message, false);
    }
    btCupom.disabled = false;
  };

  /* ----- os planos ----- */
  const planos = h('div', { cls: 'planos3' });
  const precos = [];
  let escolhido = null;

  /* A COMPARAÇÃO É O QUE VENDE, NÃO O PREÇO.

     Sozinho, "R$ 150,00" parece mais caro que "R$ 13,99". Só olhando lado a
     lado é que o anual aparece como o barato — e o vitalício, como o que
     para de custar. Tudo calculado a partir dos preços que vieram do
     servidor: mexer na tabela não obriga a mexer aqui. */
  function comparacao(pl, mensal) {
    if (!mensal) return '';
    const mes = mensal.preco_centavos;

    if (pl.periodo === 'anual') {
      const ano = mes * 12;
      const economia = ano - pl.preco_centavos;
      if (economia <= 0) return '';
      return 'Sai ' + reaisDe(Math.round(pl.preco_centavos / 12)) + '/mês — economiza '
           + reaisDe(economia) + ' por ano';
    }

    if (pl.periodo === 'vitalicio') {
      /* Arredonda o total de meses ANTES de dividir: 23,6 meses vira 24, e
         não "1 ano e 12 meses". */
      const m = Math.round(pl.preco_centavos / mes);
      const anos = Math.floor(m / 12), resto = m % 12;
      const quando = anos && resto ? anos + (anos > 1 ? ' anos e ' : ' ano e ') + resto + (resto > 1 ? ' meses' : ' mês')
                   : anos ? anos + (anos > 1 ? ' anos' : ' ano')
                   : m + ' meses';
      return 'Se paga em ' + quando + '. Depois, nunca mais.';
    }

    return reaisDe(mes * 12) + ' em um ano';
  }

  const mensal = (estado.planos || []).find((x) => x.periodo === 'mensal');

  const PERIODO = { mensal: 'por mês', anual: 'por ano', vitalicio: 'uma vez só' };
  const ETIQUETA = { anual: 'mais escolhido', vitalicio: 'melhor a longo prazo' };

  (estado.planos || []).forEach((pl, i) => {
    const reais = reaisDe(pl.preco_centavos);

    const preco = h('span', { cls: 'pcard__preco' });
    preco.appendChild(document.createTextNode(reais));

    const b = h('button', { cls: 'pcard' + (pl.periodo === 'vitalicio' ? ' vital' : ''), type: 'button' });
    if (ETIQUETA[pl.periodo]) b.appendChild(h('span', { cls: 'pcard__tag', txt: ETIQUETA[pl.periodo] }));
    b.appendChild(h('span', { cls: 'pcard__nome', txt: pl.nome }));
    b.appendChild(preco);
    b.appendChild(h('span', { cls: 'pcard__periodo', txt: PERIODO[pl.periodo] || '' }));

    const comp = comparacao(pl, mensal);
    if (comp) b.appendChild(h('span', { cls: 'pcard__comp', txt: comp }));

    precos.push({ el: preco, cheio: reais, plano: pl, botao: b });

    b.onclick = () => marca(i);
    planos.appendChild(b);
  });

  /* Os preços vêm ANTES da lista de benefícios: quem abriu a tela quer
     saber quanto custa, e a lista é a mesma nos três planos. */
  corpo.insertBefore(planos, corpo.firstChild);
  planos.insertAdjacentElement('afterend',
    h('p', { cls: 'd', style: 'margin:0 0 12px', txt: 'Os três dão exatamente o mesmo:' }));

  function marca(i) {
    escolhido = precos[i] ? precos[i].plano : null;
    precos.forEach((x, k) => x.botao.classList.toggle('on', k === i));
    pagar.disabled = !escolhido;
    pagar.textContent = escolhido ? 'Seja Pro — ' + reaisDe(escolhido.preco_centavos) : 'Seja Pro';
  }

  /* Mostra "de R$ 13,99 por R$ 11,19" no plano i, ou volta ao preço cheio. */
  function pintaPreco(i, conta) {
    const linha = precos[i];
    if (!linha) return;
    linha.el.innerHTML = '';
    if (conta) {
      linha.el.appendChild(h('span', { cls: 'antes', txt: linha.cheio }));
      linha.el.appendChild(document.createTextNode(reaisDe(conta.por)));
    } else {
      linha.el.appendChild(document.createTextNode(linha.cheio));
    }
    if (escolhido === linha.plano) {
      pagar.textContent = 'Seja Pro — ' + (conta ? reaisDe(conta.por) : linha.cheio);
    }
  }

  /* ----- o botão que paga ----- */
  const pagar = h('button', { cls: 'bt principal', type: 'button',
    txt: 'Seja Pro', style: 'width:100%' });

  pagar.onclick = async () => {
    if (!escolhido) return;
    pagar.disabled = true;
    const antes = pagar.textContent;
    pagar.textContent = 'abrindo…';
    try {
      const r = await api('/checkout.php?plano=' + encodeURIComponent(escolhido.slug)
        + (cupomAtivo ? '&cupom=' + encodeURIComponent(cupomAtivo) : ''));

      /* Aba nova, e não redirecionamento: quem sai do painel pro Mercado
         Pago e volta numa página deles perde o caminho de volta. */
      window.open(r.url, '_blank', 'noopener');
      fechaPop();
      recado('Abri o pagamento numa aba nova. Depois de pagar, volte e recarregue.', 'bom');
    } catch (e) {
      recado(e.message, 'ruim');
    }
    pagar.disabled = false;
    pagar.textContent = antes;
  };

  /* OS PREÇOS APARECEM DE CARA.

     Antes havia um "Ver planos" DENTRO do popup, depois de já ter clicado
     em "Ver planos" pra abrir o popup: dois cliques pra mesma pergunta, e a
     caixa saltando de tamanho no meio. O botão de fora continua sendo o
     "Ver planos"; aqui já são os planos.

     E o anual já vem marcado: sem nada escolhido, a pessoa decide do zero;
     com o anual marcado, a decisão vira "confirmo ou mudo". */
  const acao = h('div', { cls: 'pop__acao' }, [
    temCupom, listaCupons, linhaCupom, cupomDiz, pagar,
    h('p', { cls: 'd', style: 'margin:12px 0 0;text-align:center',
      txt: 'Pix, cartão ou saldo. O pagamento acontece no site do Mercado Pago.' }),
  ]);
  caixa.appendChild(acao);

  const iAnual = precos.findIndex((x) => x.plano.periodo === 'anual');
  marca(iAnual >= 0 ? iAnual : 0);

  document.body.appendChild(fundo);
}

/* AVISAR ANTES, NUNCA DEPOIS.

   Perder o Pro no meio de uma live, com a marca d'água voltando na tela sem
   explicação, é o pior jeito de descobrir que a assinatura venceu. Uma
   semana de antecedência dá tempo de pagar sem pressa, e a cortesia (os dias
   de tolerância depois do vencimento) aparece com o texto trocado, porque aí
   a situação já é outra: ainda funciona, mas por pouco tempo. */
function avisaVencimento(c) {
  const cx = el('avisoPlano');
  cx.innerHTML = '';
  /* Esconder junto com o esvaziar: sem isto, quem já tinha visto o aviso uma
     vez ficava com a caixa vazia e com borda ocupando espaço na tela. */
  cx.classList.add('escondido');

  /* Testador não recebe cobrança nem lembrete: ele não tem o que renovar. */
  if (c.beta) return;
  if (c.plano === 'gratis' || c.plano === 'vitalicio') return;
  if (!c.cortesia && (c.dias === null || c.dias > 7)) return;

  const bt = h('button', { cls: 'bt mini', type: 'button', txt: 'Renovar' });
  bt.onclick = () => { if (proEstado) abrePro(proEstado); };

  const texto = c.cortesia
    ? 'Sua assinatura venceu. Você está nos dias de tolerância — o Pro continua '
      + 'funcionando por pouco tempo, e depois disso a marca d\'água volta.'
    : c.dias <= 0
      ? 'Sua assinatura vence hoje.'
      : 'Sua assinatura vence em ' + c.dias + (c.dias === 1 ? ' dia.' : ' dias.');

  cx.appendChild(h('span', {}, [h('b', { txt: 'Plano Pro. ' }), document.createTextNode(texto)]));
  cx.appendChild(bt);
  cx.classList.remove('escondido');
}

   dos campos que cada driver declara. Marca nova é um arquivo novo em
   api/luzes/ — nada aqui muda. */

function telaLuzes() {
  const tela = el('tela');
  tela.innerHTML = '';
  tela.appendChild(h('h1', { txt: 'Luzes' }));
  tela.appendChild(h('p', { cls: 'sub', txt: 'O chat muda a cor das suas luzes com !luz. Conecte a marca, escolha quais lâmpadas obedecem e crie as cenas.' }));

  const marcas = h('div', { cls: 'luz-marcas' });
  const cenasCx = h('div');
  tela.appendChild(marcas);
  tela.appendChild(h('h3', { style: 'margin-top:26px', txt: 'Cenas' }));
  tela.appendChild(h('p', { cls: 'd', txt: 'Uma palavra que o chat digita depois do comando: "!luz festa". Sem cena, o chat também pode dizer a cor direto — !luz vermelho, !luz #FF00AA, !luz off.' }));
  tela.appendChild(cenasCx);

  marcas.appendChild(h('p', { cls: 'd', txt: 'vendo…' }));

  const manda = (corpo) => api('/luzes.php', { method: 'POST', body: JSON.stringify(corpo) });

  function pinta(d) {
    const conectadas = {};
    (d.contas || []).forEach((c) => { conectadas[c.driver] = c; });

    marcas.innerHTML = '';
    (d.marcas || []).forEach((m) => {
      const cx = h('div', { cls: 'fatia' }, [h('h3', { txt: m.nome })]);
      const conta = conectadas[m.id];

      if (!conta) {
        cx.appendChild(h('p', { cls: 'd', txt: m.ajuda }));

        const campos = {};
        m.campos.forEach((c) => {
          const i = h('input', { type: c.segredo ? 'password' : 'text', placeholder: c.rotulo,
            autocomplete: 'off', style: 'flex:1 1 200px' });
          campos[c.chave] = i;
          cx.appendChild(h('div', { cls: 'campo' }, [h('label', { txt: c.rotulo }), i]));
        });

        const diz = h('p', { cls: 'd' });
        const bt = h('button', { cls: 'bt principal', type: 'button', txt: 'Conectar' });
        bt.onclick = async () => {
          const corpo = { acao: 'salvar', driver: m.id };
          Object.keys(campos).forEach((k) => { corpo[k] = campos[k].value; });
          bt.disabled = true;
          diz.textContent = 'falando com a ' + m.nome + '…';
          try {
            await manda(corpo);
            carregaLuzes();
          } catch (e) { diz.textContent = e.message; diz.style.color = 'var(--perigo)'; }
          bt.disabled = false;
        };
        cx.appendChild(h('div', { cls: 'campo' }, [bt]));
        cx.appendChild(diz);
        marcas.appendChild(cx);
        return;
      }

      cx.appendChild(h('p', { cls: 'd', txt: (conta.aparelhos.length || 'nenhuma') + ' '
        + (conta.aparelhos.length === 1 ? 'luz obedecendo' : 'luzes obedecendo') }));

      const lista = h('div', { cls: 'luz-aparelhos' });
      cx.appendChild(lista);

      /* A lista de aparelhos vem da marca, não do banco: lâmpada que a
         pessoa tirou da tomada tem que sumir daqui sozinha. */
      const verAparelhos = async () => {
        lista.innerHTML = '';
        lista.appendChild(h('span', { cls: 'd', txt: 'procurando…' }));
        try {
          const r = await manda({ acao: 'reler', driver: m.id });
          lista.innerHTML = '';
          const caixas = [];
          (r.aparelhos || []).forEach((a) => {
            const cb = h('input', { type: 'checkbox' });
            cb.checked = conta.aparelhos.indexOf(a.id) >= 0;
            cb.onchange = () => manda({ acao: 'aparelhos', driver: m.id,
              aparelhos: caixas.filter((x) => x.cb.checked).map((x) => x.id) }).catch((e) => recado(e.message, 'ruim'));
            caixas.push({ cb, id: a.id });
            lista.appendChild(h('label', {}, [cb, document.createTextNode(a.nome)]));
          });
        } catch (e) {
          lista.innerHTML = '';
          lista.appendChild(h('span', { cls: 'd', txt: e.message }));
        }
      };
      verAparelhos();

      const trocar = h('button', { cls: 'bt mini', type: 'button', txt: 'Trocar credencial' });
      trocar.onclick = async () => {
        if (!confirm('Desconectar a ' + m.nome + '? Você vai precisar colar a credencial de novo.')) return;
        try { await manda({ acao: 'remover', driver: m.id }); carregaLuzes(); }
        catch (e) { recado(e.message, 'ruim'); }
      };
      cx.appendChild(h('div', { cls: 'campo' }, [trocar]));
      marcas.appendChild(cx);
    });

    if (!(d.marcas || []).length) {
      marcas.appendChild(h('div', { cls: 'vazio', txt: 'Nenhuma marca instalada no servidor.' }));
    }

    /* ----- testar ----- */
    if ((d.contas || []).length) {
      const bolas = h('div', { cls: 'luz-cores' });
      Object.keys(d.cores || {}).forEach((nome) => {
        const b = h('button', { cls: 'luz-bola', type: 'button', title: nome });
        b.style.background = d.cores[nome];
        b.onclick = async () => {
          try {
            const r = await manda({ acao: 'testar', texto: nome });
            recado(r.ok ? 'Mandei ' + nome + '.' : (r.erro || 'não deu'), r.ok ? 'bom' : 'ruim');
          } catch (e) { recado(e.message, 'ruim'); }
        };
        bolas.appendChild(b);
      });
      const off = h('button', { cls: 'bt mini', type: 'button', txt: 'Apagar' });
      off.onclick = () => manda({ acao: 'testar', texto: 'off' }).catch((e) => recado(e.message, 'ruim'));

      marcas.appendChild(h('div', { cls: 'fatia' }, [
        h('h3', { txt: 'Testar agora' }),
        h('p', { cls: 'd', txt: 'Clique numa cor pra ver se as luzes obedecem.' }),
        bolas, h('div', { cls: 'campo' }, [off]),
      ]));
    }

    /* ----- cenas ----- */
    cenasCx.innerHTML = '';
    (d.cenas || []).forEach((c) => {
      const amostra = h('span', { cls: 'amostra' });
      amostra.style.background = c.cor || 'transparent';

      const apagar = h('button', { cls: 'bt mini perigo', type: 'button', txt: '×' });
      apagar.onclick = async () => {
        try { const r = await manda({ acao: 'cena_apagar', id: c.id }); pinta(Object.assign({}, d, { cenas: r.cenas })); }
        catch (e) { recado(e.message, 'ruim'); }
      };

      cenasCx.appendChild(h('div', { cls: 'luz-cena' }, [
        amostra,
        h('code', { txt: '!luz ' + c.palavra }),
        h('span', { cls: 'd', style: 'flex:1',
          txt: (c.cor || 'só acende') + (c.brilho !== null ? '  ·  ' + c.brilho + '%' : '')
             + (c.ms ? '  ·  volta em ' + (c.ms / 1000) + 's' : '') + '  ·  ' + c.cargo }),
        apagar,
      ]));
    });
    if (!(d.cenas || []).length) cenasCx.appendChild(h('p', { cls: 'd', txt: 'Nenhuma cena ainda.' }));

    const nPalavra = h('input', { type: 'text', maxlength: '32', placeholder: 'palavra', style: 'flex:0 0 130px' });
    const nCor = h('input', { type: 'color', value: '#12A150', style: 'flex:0 0 46px;padding:2px' });
    const nBrilho = h('input', { type: 'number', min: '1', max: '100', placeholder: '%', style: 'flex:0 0 70px' });
    const nMs = h('input', { type: 'number', min: '0', max: '60000', step: '500', placeholder: 'volta em (ms)', style: 'flex:0 0 130px' });
    const nCargo = h('select', { style: 'flex:0 0 120px' });
    [['chat', 'Todo mundo'], ['sub', 'Subs'], ['vip', 'VIPs'], ['mod', 'Mods'],
     ['supermod', 'Supermods'], ['dono', 'Só você']].forEach(([v, r]) =>
      nCargo.appendChild(h('option', { value: v, txt: r })));
    nCargo.value = 'mod';

    const nAdd = h('button', { cls: 'bt mini', type: 'button', txt: '+ Cena' });
    nAdd.onclick = async () => {
      if (!nPalavra.value.trim()) return recado('A cena precisa de uma palavra.', 'ruim');
      try {
        const r = await manda({ acao: 'cena_salvar', palavra: nPalavra.value, cor: nCor.value,
          brilho: nBrilho.value, ms: parseInt(nMs.value, 10) || 0, cargo: nCargo.value });
        nPalavra.value = ''; nBrilho.value = ''; nMs.value = '';
        pinta(Object.assign({}, d, { cenas: r.cenas }));
      } catch (e) { recado(e.message, 'ruim'); }
    };

    cenasCx.appendChild(h('div', { cls: 'campo', style: 'gap:8px;flex-wrap:wrap;margin-top:12px' },
      [nPalavra, nCor, nBrilho, nMs, nCargo, nAdd]));
  }

  function carregaLuzes() {
    api('/luzes.php').then(pinta).catch((e) => {
      marcas.innerHTML = '';
      marcas.appendChild(h('p', { cls: 'd', txt: 'Não deu: ' + e.message }));
    });
  }
  carregaLuzes();
}

/* Quanto tempo faz. Montado peça por peça porque 'YYYY-MM-DD HH:MM:SS' sem
   fuso é lido como UTC por alguns navegadores e como local por outros — a
   diferença de três horas apareceria como "em 3 horas" num post de agora. */
function faz(quando) {
  const p = String(quando || '').split(/[- :]/);
  if (p.length < 6) return '';
  const q = new Date(p[0], p[1] - 1, p[2], p[3], p[4], p[5]);
  const s = Math.max(0, (Date.now() - q.getTime()) / 1000);
  if (s < 60) return 'agora';
  if (s < 3600) return Math.floor(s / 60) + ' min';
  if (s < 86400) return Math.floor(s / 3600) + ' h';
  if (s < 604800) return Math.floor(s / 86400) + ' d';
  return q.toLocaleDateString('pt-BR');
}

      const corpo = h('div', { cls: 'feed__corpo' }, [

          src: API + '/feed.php?a=img&id=' + p.imagem });
