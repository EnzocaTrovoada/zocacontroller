<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<!-- A CHAVE VIAJA NA URL DESTA PÁGINA.
     Sem esta linha, todo pedido a servidor de fora (a fonte do Google, por
     exemplo) leva junto um cabeçalho Referer. Navegador atual só manda a
     origem e corta o resto, mas o CEF embutido no OBS costuma ficar
     versões atrás, e ali o endereço inteiro — com a chave — sairia de casa.
     no-referrer não manda nada, e não custa nada. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ZocaController</title>
<link rel="icon" href="icone.png?v=1" type="image/png">
<link rel="apple-touch-icon" href="icone.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Branco e verde. O tema escuro troca só os tokens — nenhuma cor é
     definida uma vez só lá dentro, senão o claro fica sem ela. */
  :root {
    color-scheme: light;
    --fundo:#FFFFFF; --caixa:#F6F8F6; --caixa2:#EDF2EE; --linha:#DCE4DD;
    --tinta:#101A14; --fraco:#5C6C62; --apagado:#8A9990;
    --verde:#12A150; --verde-fraco:#E4F5EA; --verde-forte:#0B7A3B;
    --perigo:#C4432B;
    /* O dourado e so do vitalicio. Escuro no tema claro por medida, nao por
       gosto: em #B07D14 o contraste sobre o cartao dava 3.2:1, abaixo do
       4.5:1 que texto pequeno precisa — era o "texto apagado" do vitalicio.
       Em #8A6210 da 4.8:1, no mesmo patamar do verde. */
    --dourado:#8A6210;
    --disp:"Archivo",Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
    --sombra:0 1px 2px rgba(16,26,20,.06), 0 8px 24px rgba(16,26,20,.06);
  }
  :root[data-tema="escuro"] {
    color-scheme: dark;
    --fundo:#0E1411; --caixa:#161F1A; --caixa2:#1D2822; --linha:#2A3830;
    --tinta:#E4EDE7; --fraco:#93A69B; --apagado:#71857A;
    --verde:#3DD47F; --verde-fraco:#14301F; --verde-forte:#69E39C;
    --perigo:#E4735A;
    --dourado:#E0A82E;
    --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fundo); color: var(--tinta);
    font: 15px/1.55 var(--mono); -webkit-font-smoothing: antialiased;
  }
  a { color: var(--verde-forte); }

  /* ---------- barra de cima ---------- */
  .barra {
    display: flex; align-items: stretch; gap: 0;
    border-bottom: 1px solid var(--linha); background: var(--fundo);
    position: sticky; top: 0; z-index: 30;
  }
  .marca {
    display: flex; align-items: center; gap: 9px;
    padding: 0 20px; border-right: 1px solid var(--linha);
    font: 700 17px var(--disp); letter-spacing: -.02em; cursor: pointer;
    background: none; color: var(--tinta);
  }
  .marca svg { display: block; }

  .aba {
    position: relative; display: flex; align-items: center; gap: 7px;
    padding: 16px 20px; border: 0; border-right: 1px solid var(--linha);
    background: none; color: var(--tinta); cursor: pointer;
    font: 600 12px var(--disp); letter-spacing: .14em; text-transform: uppercase;
  }
  .aba:hover, .aba[aria-expanded="true"] { background: var(--verde-fraco); color: var(--verde-forte); }
  .aba i {
    width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent;
    border-top: 5px solid currentColor; opacity: .7;
  }
  .espaco { flex: 1; }
/* A conta em que a tela esta. Discreta de proposito: e informacao de
   conferencia, nao de navegacao. */
.quem { color: var(--fraco); font-size: 13px; letter-spacing: .01em; }
@media (max-width: 640px) { .quem { display: none; } }
  .lua {
    padding: 0 20px; border: 0; border-left: 1px solid var(--linha);
    background: none; color: var(--tinta); cursor: pointer; font-size: 17px;
  }
  .lua:hover { background: var(--verde-fraco); color: var(--verde-forte); }

  /* a bandeja nasce colada embaixo da aba que a abriu */
  .bandeja {
    position: absolute; top: 100%; left: -1px; min-width: 210px;
    background: var(--fundo); border: 1px solid var(--linha); border-top: 0;
    box-shadow: var(--sombra); padding: 6px; display: none; z-index: 40;
  }
  .aba[aria-expanded="true"] .bandeja { display: block; }
  /* Um item era <button> e os outros <a>. O link herdava o CAIXA ALTA da
     aba e o botão não, então "Comandos" saía em caixa normal ao lado de
     "SUBATHON". Fixar nos dois acaba com o desalinho. */
  .bandeja button, .bandeja a {
    display: block; width: 100%; text-align: left; text-decoration: none;
    padding: 10px 12px; border: 0; background: none; cursor: pointer;
    color: var(--tinta); font: 500 14px var(--mono); border-radius: 4px;
    text-transform: none; letter-spacing: normal;
  }
  .bandeja small { text-transform: none; letter-spacing: normal; }
  .bandeja button:hover, .bandeja a:hover { background: var(--verde-fraco); color: var(--verde-forte); }
  .bandeja small { display: block; font-size: 11.5px; color: var(--apagado); margin-top: 1px; }
  .bandeja button:hover small, .bandeja a:hover small { color: var(--verde); }
  .bandeja hr { border: 0; border-top: 1px solid var(--linha); margin: 6px 4px; }

  /* ---------- Upgrade ---------- */
  .aba.pro { color: var(--verde-forte); }
  .aba.pro:hover { background: var(--verde-fraco); }

  /* O popup. Fundo próprio e position fixed: ele precisa cobrir a página
     inteira, e herdar rolagem de quem está embaixo faria a caixa fugir. */
  .pop {
    position: fixed; inset: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; background: rgba(6, 12, 8, .68);
  }
  /* TRÊS FAIXAS, E SÓ A DO MEIO ROLA.

     Antes a caixa inteira rolava e o botão de pagar ia parar abaixo da
     dobra — de fora, um botão que existe mas não dá pra clicar. Tentei
     position:sticky primeiro e não resolveu: sticky depende do elemento já
     estar dentro do trecho visível, e com dez benefícios ele nunca estava.

     Com flex, o cabeçalho e a barra de baixo têm altura própria e o miolo
     fica com o que sobra. O botão passa a ser inalcançável só se a janela
     for menor que ele. */
  .pop__caixa {
    display: flex; flex-direction: column;
    background: var(--caixa); border: 1px solid var(--linha);
    width: 100%; max-width: 520px; max-height: 88vh; overflow: hidden;
    padding: 26px 28px 22px; box-shadow: var(--sombra);
  }
  .pop__topo { flex: 0 0 auto; }
  .pop__corpo { flex: 1 1 auto; overflow-y: auto; min-height: 0; margin: 0 -4px; padding: 0 4px; }
  .pop__x {
    float: right; border: 0; background: none; cursor: pointer;
    color: var(--apagado); font-size: 22px; line-height: 1; padding: 0 2px;
  }
  .pop__x:hover { color: var(--tinta); }
  .pop h2 {
    margin: 0 0 4px; font: 700 26px var(--disp);
    letter-spacing: -.02em; color: var(--tinta);
  }
  .pop .sub { margin: 0 0 18px; }

  /* Entram deslizando, um atrás do outro. O atraso é pequeno de propósito:
     a lista inteira termina em meio segundo, então a animação é percebida
     sem ninguém precisar esperar por ela. */
  @keyframes popEntra {
    from { opacity: 0; transform: translateX(-14px); }
    to   { opacity: 1; transform: none; }
  }
  .pop__lista li { animation: popEntra .34s ease-out both; }
  @media (prefers-reduced-motion: reduce) {
    .pop__lista li { animation: none; }
  }

  .pop__lista { list-style: none; margin: 0 0 22px; padding: 0; }
  .pop__lista li {
    display: grid; grid-template-columns: 20px 1fr; gap: 10px;
    align-items: start; padding: 8px 0; border-bottom: 1px solid var(--linha);
  }
  .pop__lista li:last-child { border-bottom: 0; }
  .pop__lista b { font-weight: 600; }
  .pop__lista small { display: block; color: var(--apagado); font-size: 12.5px; margin-top: 1px; }
  /* Cada marcador de uma cor. Não é enfeite: uma coluna de dez símbolos
     iguais some da vista, e a lista de benefícios é a parte que precisa
     ser lida. */
  .pop__ok { font-weight: 700; }
  .pop__estrela { color: var(--dourado); font-weight: 700; }
  .pop__lista li.so-vital b { color: var(--dourado); }
  .pop__tag {
    display: inline-block; margin-left: 8px; font-style: normal;
    font: 600 10px var(--mono); letter-spacing: .08em; text-transform: uppercase;
    color: var(--dourado); border: 1px solid currentColor;
    padding: 1px 5px; vertical-align: 2px;
  }
  /* O roteiro do teste. Numerado porque é sequência de verdade: pular a
     janela anônima faz os outros passos falharem. */
  .pop .passos { margin: 0 0 12px; padding-left: 20px; }
  .pop .passos li { margin-bottom: 7px; color: var(--fraco); font-size: 13.5px; line-height: 1.5; }
  .pop .passos li::marker { color: var(--verde); font-weight: 600; }

  /* ---------- caminho e busca ---------- */
  /* Margem de baixo POSITIVA. Era -6px pra "colar" no título e o resultado
     foi o contrário: a linha entrava por cima dele. */
  .caminho {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    margin: 10px 0 18px; font: 500 12px var(--mono); color: var(--apagado);
  }
  .caminho button {
    border: 0; background: none; padding: 0; cursor: pointer;
    font: inherit; color: var(--fraco);
  }
  .caminho button:hover { color: var(--verde-forte); text-decoration: underline; }
  .caminho b { color: var(--tinta); font-weight: 600; }
  .caminho span { color: var(--linha2); }

  .busca { position: relative; margin-left: 6px; }
  .busca input {
    width: 190px; font: 12.5px var(--mono); color: var(--tinta);
    background: var(--fundo); border: 1px solid var(--linha);
    padding: 7px 10px; border-radius: 4px;
  }
  .busca input:focus { outline: 0; border-color: var(--verde); width: 240px; }
  .busca input { transition: width .15s ease-out; }
  @media (max-width: 820px) { .busca { display: none; } }

  .busca__lista {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 50;
    background: var(--caixa); border: 1px solid var(--linha);
    max-height: 320px; overflow-y: auto; box-shadow: var(--sombra);
  }
  .busca__item {
    display: block; width: 100%; text-align: left; border: 0; background: none;
    padding: 9px 12px; cursor: pointer; color: var(--tinta); font: 13px var(--texto, inherit);
    border-bottom: 1px solid var(--linha);
  }
  .busca__item:last-child { border-bottom: 0; }
  .busca__item:hover, .busca__item.on { background: var(--verde-fraco); }
  .busca__item small { display: block; color: var(--apagado); font: 11px var(--mono); margin-top: 1px; }

  /* ---------- só o administrador vê ----------

     Vermelho e com um marcador na frente. O problema que isto resolve é
     bobo e real: em telas que TODO MUNDO abre, tinha texto que só o admin
     enxergava, e de dentro não dava pra saber qual era qual — dá pra
     escrever a explicação errada pro público sem perceber. */
  .so-adm {
    border-left: 3px solid var(--perigo); background: var(--perigo-fraco);
    padding: 10px 14px; margin: 10px 0; color: var(--perigo);
  }
  .so-adm::before {
    content: 'SÓ VOCÊ VÊ'; display: block; margin-bottom: 4px;
    font: 600 9.5px var(--mono); letter-spacing: .14em;
  }
  .so-adm p, .so-adm li, .so-adm .d { color: var(--perigo); }
  .so-adm .bt { border-color: currentColor; }

  /* Quando é um trecho curto no meio de outra coisa. */
  .adm-tag { color: var(--perigo); font-weight: 600; }

  /* ---------- calculadora de comissão ---------- */
  .calc { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin: 4px 0 12px; }
  .calc label { display: flex; flex-direction: column; gap: 3px; font: 500 11px var(--mono); color: var(--fraco); }
  .calc input, .calc select {
    width: 110px; font: 13px var(--mono); color: var(--tinta);
    background: var(--fundo); border: 1px solid var(--linha); padding: 7px 8px; border-radius: 4px;
  }
  .calc-saida {
    display: grid; grid-template-columns: 1fr auto; gap: 2px 16px;
    max-width: 380px; font: 13px var(--mono);
  }
  .calc-saida .v { text-align: right; font-variant-numeric: tabular-nums; }
  .calc-saida .forte { font-weight: 700; border-top: 1px solid var(--linha); padding-top: 5px; margin-top: 3px; }
  .calc-saida .bom { color: var(--verde-forte); }
  .calc-saida .ruim { color: var(--perigo); }

  /* ---------- modo edição ---------- */
  body.editando [data-edit] {
    outline: 1px dashed var(--verde); outline-offset: 2px;
    cursor: text; border-radius: 2px;
  }
  body.editando [data-edit]:hover { background: var(--verde-fraco); }
  body.editando [data-edit-mudado] { outline-color: var(--dourado); }

  .aba.editando { color: var(--dourado); }

  /* A caixa de edição. Fixa embaixo pra não empurrar o texto que está sendo
     editado pra fora da tela no momento em que se olha pra ele. */
  .edicao {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 70;
    background: var(--caixa); border-top: 2px solid var(--verde);
    padding: 14px 20px; box-shadow: 0 -8px 24px rgba(0,0,0,.2);
  }
  .edicao .w2 { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .edicao .antes {
    font: 12px var(--mono); color: var(--apagado);
    max-height: 44px; overflow: auto;
  }
  .edicao textarea {
    width: 100%; min-height: 70px; resize: vertical;
    font: 13px/1.5 var(--mono); color: var(--tinta);
    background: var(--fundo); border: 1px solid var(--linha);
    padding: 9px 10px; border-radius: 4px;
  }
  .edicao textarea:focus { outline: 0; border-color: var(--verde); }
  .edicao .botoes { display: flex; gap: 8px; align-items: center; }

  /* ---------- vitrine da inicial ---------- */

  /* A VITRINE PRECISA DA TELA INTEIRA.

     O resto do site cabe em 1080px porque é formulário e lista, que ficam
     ruins largos demais. A vitrine é o contrário: três painéis lado a lado
     em 1080px espremem tudo — foi o que deixou a primeira versão feia. */
  body.na-vitrine .w { max-width: 1600px; }

  /* O meio leva 5 de 11 porque agora paga por três coisas, e não uma: os
     dois vizinhos ficaram grandes o bastante pra se entender que são lives,
     e o vídeo do meio não podia encolher pra pagar essa conta.

     O minmax(0,...) é o que impede uma coluna de crescer por causa de
     conteúdo comprido e comer as vizinhas. */
  .hub {
    display: grid; gap: 18px; padding: 14px 0 40px;
    grid-template-columns: minmax(0, 3fr) minmax(0, 5fr) minmax(0, 3fr);
    align-items: start;
  }
  @media (max-width: 1180px) { .hub { grid-template-columns: 1fr; } }

  /* Cada coisa no seu painel, com borda própria — foi o que faltava antes:
     três listas soltas no branco não pareciam três seções, pareciam uma
     bagunça só. */
  .hub__painel {
    border: 1px solid var(--linha); background: var(--caixa);
    padding: 16px 18px; min-width: 0;
  }
  .hub__painel + .hub__painel { margin-top: 16px; }

  .hub h2 {
    margin: 0 0 14px; font: 600 11px var(--mono);
    letter-spacing: .18em; text-transform: uppercase; color: var(--fraco);
  }

  /* ---- esquerda: onde você parou ---- */
  .hub__voltar { display: flex; flex-direction: column; }
  .hub__volta {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; text-align: left; border: 0; background: none; cursor: pointer;
    padding: 9px 0; border-bottom: 1px solid var(--linha);
    color: var(--tinta); font: 13.5px inherit;
  }
  .hub__volta:last-child { border-bottom: 0; }
  .hub__volta:hover .nm { color: var(--verde-forte); }
  .hub__volta .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hub__volta .seta { color: var(--apagado); flex: none; }

  .hub__pro { border-color: var(--verde); }

  /* ---- esquerda: atualizações ---- */
  .hub__rolo { max-height: 460px; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
  .hub__nov { padding: 13px 0; border-bottom: 1px solid var(--linha); }
  .hub__nov:first-child { padding-top: 0; }
  .hub__nov:last-child { border-bottom: 0; padding-bottom: 0; }
  .hub__nov time { display: block; color: var(--apagado); font: 500 11px var(--mono); margin-bottom: 3px; }
  .hub__nov b { display: block; font: 600 14.5px var(--disp); margin-bottom: 3px; }
  .hub__nov span { color: var(--fraco); font-size: 13px; line-height: 1.5; }

  /* ---- meio: o carrossel ---- */

  /* OS VIZINHOS APARECEM INTEIROS, SÓ QUE MENORES.

     Antes eles vinham cortados nas beiradas, imitando a home da Twitch. Sem
     seta e sem nome, aquilo não lia como "a live de outra pessoa": lia como
     um retângulo colorido no canto. Miniatura inteira, nome embaixo, selo de
     ao vivo e uma seta por cima — cada um desses diz uma coisa que faltava. */
  .hub__trilho { display: flex; align-items: center; gap: 12px; }

  .hub__lado {
    flex: 0 0 16%; align-self: center; min-width: 0;
    border: 0; padding: 0; background: none; cursor: pointer; text-align: left;
    opacity: .78; transition: opacity .18s ease, transform .18s ease;
  }
  .hub__lado:hover, .hub__lado:focus-visible { opacity: 1; transform: translateY(-2px); outline: 0; }

  .hub__lado .mini {
    position: relative; display: block; width: 100%; aspect-ratio: 16/9;
    overflow: hidden; background: var(--caixa2); border: 1px solid var(--linha);
    transition: border-color .18s ease;
  }
  .hub__lado:hover .mini, .hub__lado:focus-visible .mini { border-color: var(--verde); }
  .hub__lado img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .hub__lado .nome {
    display: block; margin-top: 7px; font: 500 12px var(--mono); color: var(--fraco);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Do lado CONTRÁRIO ao da seta: a miniatura é pequena, e os dois no mesmo
     canto viram uma mancha só. */
  .hub__lado .vivo {
    position: absolute; top: 6px; padding: 2px 5px; border-radius: 2px;
    font: 700 9px var(--mono); letter-spacing: .1em; color: #fff; background: var(--perigo);
  }
  .hub__lado.esq .vivo { right: 6px; }
  .hub__lado.dir .vivo { left: 6px; }

  /* A SETA É O QUE DIZ QUE DÁ PRA CLICAR. Fica por cima da miniatura, do
     lado de fora, e não some no hover. */
  .hub__lado .seta {
    position: absolute; top: 50%; transform: translateY(-50%);
    display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%;
    background: rgba(8,12,9,.66); color: #fff; font: 600 15px var(--disp); line-height: 1;
    transition: background .18s ease;
  }
  .hub__lado.esq .seta { left: 7px; }
  .hub__lado.dir .seta { right: 7px; }
  .hub__lado:hover .seta { background: var(--verde); }

  .hub__palco { flex: 1 1 auto; min-width: 0; }

  /* O DESLIZE. Curto e pequeno de propósito: o que ele precisa dizer é
     "trocou, e veio daquele lado". Passar disso vira enfeite que atrasa. */
  @keyframes hub-entra-esq { from { opacity: 0; transform: translateX(4%); } to { opacity: 1; transform: none; } }
  @keyframes hub-entra-dir { from { opacity: 0; transform: translateX(-4%); } to { opacity: 1; transform: none; } }
  .vai-esq .hub__palco, .vai-esq .hub__lado, .hub__info.vai-esq { animation: hub-entra-esq .26s ease-out both; }
  .vai-dir .hub__palco, .vai-dir .hub__lado, .hub__info.vai-dir { animation: hub-entra-dir .26s ease-out both; }
  @media (prefers-reduced-motion: reduce) {
    .vai-esq .hub__palco, .vai-esq .hub__lado, .hub__info.vai-esq,
    .vai-dir .hub__palco, .vai-dir .hub__lado, .hub__info.vai-dir { animation: none; }
  }

  .hub__video {
    position: relative; width: 100%; aspect-ratio: 16/9;
    background: #000; overflow: hidden; border: 1px solid var(--linha);
  }
  .hub__video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .hub__video img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .hub__off {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(6,12,8,.6); color: #fff;
    font: 600 12px var(--mono); letter-spacing: .12em; text-transform: uppercase;
  }

  /* Alinhado com o VÍDEO, não com o trilho: o mesmo recuo dos vizinhos
     mais o vão. Começando na beirada do trilho, o nome do canal ficava
     embaixo da miniatura do vizinho, e o bloco inteiro parecia torto. */
  .hub__info {
    padding: 14px calc(16% + 12px) 0; display: flex; flex-direction: column; gap: 4px;
  }
  .hub__info b { font: 600 18px var(--disp); }
  .hub__info .tit { color: var(--fraco); font-size: 14px;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .hub__info .meta { color: var(--apagado); font: 500 12px var(--mono); padding-top: 2px; }
  .hub__info .ao-vivo { color: var(--perigo); font-weight: 700; }

  .hub__selo {
    align-self: flex-start; font: 600 10px var(--mono); letter-spacing: .1em;
    text-transform: uppercase; padding: 2px 7px; border: 1px solid currentColor;
    color: var(--fraco);
  }
  .hub__selo.pro { color: var(--dourado); }
  .hub__selo.usuario { color: var(--verde-forte); }

  /* No celular o vizinho vira só a seta: 16% de uma tela de 380px é uma
     miniatura de 60px, que não mostra nada e ainda rouba o vídeo. */
  @media (max-width: 640px) {
    .hub__lado { flex: 0 0 34px; opacity: 1; }
    .hub__lado .mini { aspect-ratio: auto; height: 34px; background: none; border: 0; }
    .hub__lado img, .hub__lado .nome, .hub__lado .vivo { display: none; }
    .hub__lado .seta { position: static; transform: none; }
    .hub__info { padding-left: 2px; padding-right: 2px; }
  }

  .hub__pontos { display: flex; justify-content: center; gap: 7px; padding: 14px 0 0; }
  .hub__ponto {
    width: 7px; height: 7px; border-radius: 50%; border: 0; padding: 0;
    background: var(--linha2); cursor: pointer;
    transition: background .18s ease, width .22s ease, border-radius .22s ease;
  }
  .hub__ponto:hover { background: var(--fraco); }
  .hub__ponto.on { background: var(--verde); width: 20px; border-radius: 4px; }

  /* ---- meio: o feed ---- */
  .feed { margin-top: 18px; }
  .feed__novo { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
  .feed__novo textarea {
    width: 100%; min-height: 62px; resize: vertical; font: 14px inherit; color: var(--tinta);
    background: var(--fundo); border: 1px solid var(--linha); border-radius: 4px; padding: 10px 11px;
  }
  .feed__novo textarea:focus { outline: 0; border-color: var(--verde); }
  .feed__linha { display: flex; align-items: center; gap: 8px; }
  .feed__linha .conta { margin-left: auto; font: 500 11px var(--mono); color: var(--apagado); }
  .feed__linha .conta.perto { color: var(--perigo); }

  .feed__post { display: flex; gap: 11px; padding: 14px 0; border-bottom: 1px solid var(--linha); }
  .feed__post:last-child { border-bottom: 0; }
  .feed__foto {
    flex: none; width: 38px; height: 38px; border-radius: 50%; overflow: hidden;
    background: var(--verde-fraco); display: grid; place-items: center;
    font: 600 15px var(--disp); color: var(--verde-forte);
  }
  .feed__foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .feed__corpo { flex: 1; min-width: 0; }
  .feed__quem { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 3px; }
  .feed__quem b { font: 600 14px var(--disp); }
  .feed__quem .arroba, .feed__quem .quando { color: var(--apagado); font: 500 11.5px var(--mono); }
  .feed__texto { font-size: 14px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
  .feed__img {
    display: block; margin-top: 9px; max-width: 100%; max-height: 420px;
    border: 1px solid var(--linha); border-radius: 4px; cursor: zoom-in;
  }
  .feed__acao {
    border: 0; background: none; padding: 0; cursor: pointer;
    color: var(--apagado); font: 500 11.5px var(--mono);
  }
  .feed__acao:hover { color: var(--perigo); }

  /* Um selo, um significado. Verde é quem transmite com a gente; roxo é
     quem desenha à mão. Os dois são conferidos por uma pessoa. */
  .feed__selo {
    font: 600 9.5px var(--mono); letter-spacing: .08em; text-transform: uppercase;
    padding: 2px 6px; border-radius: 3px; white-space: nowrap;
  }
  .feed__selo.streamer { color: var(--verde-forte); background: var(--verde-fraco); }
  .feed__selo.artista  { color: #6B3FA0; background: rgba(107,63,160,.13); }
  [data-tema="escuro"] .feed__selo.artista { color: #C6A6F0; background: rgba(198,166,240,.16); }

  /* ---- direita: em alta ---- */

  /* Os controles do site inteiro só ganham estilo dentro de .campo, e aqui
     não existe .campo — sem isto o navegador desenha o select cinza dele,
     que destoa de tudo. */
  .hub__busca { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .hub__busca select, .hub__busca input {
    width: 100%; font: 13px var(--mono); color: var(--tinta);
    background: var(--fundo); border: 1px solid var(--linha);
    padding: 9px 10px; border-radius: 4px;
  }
  .hub__busca select:focus, .hub__busca input:focus {
    outline: 0; border-color: var(--verde);
  }
  .hub__busca select {
    appearance: none; -webkit-appearance: none; cursor: pointer;
    /* A setinha desenhada por nós: a nativa vem com a cor do sistema e fica
       invisível no tema escuro. */
    background-image: linear-gradient(45deg, transparent 50%, var(--fraco) 50%),
                      linear-gradient(135deg, var(--fraco) 50%, transparent 50%);
    background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 30px;
  }

  .hub__topico {
    display: flex; align-items: baseline; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid var(--linha); font-size: 13.5px;
  }
  .hub__topico:last-child { border-bottom: 0; }
  .hub__topico .n { color: var(--apagado); font: 500 11px var(--mono); width: 14px; flex: none; }
  .hub__topico .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hub__topico .v { color: var(--verde-forte); font: 500 11.5px var(--mono); flex: none; }

  .hub__canal {
    display: flex; align-items: baseline; gap: 10px; padding: 8px 0;
    text-decoration: none; color: var(--tinta); font-size: 13.5px;
    border-bottom: 1px solid var(--linha);
  }
  .hub__canal:last-child { border-bottom: 0; }
  .hub__canal:hover .nm { color: var(--verde-forte); }
  .hub__canal .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hub__canal .v { color: var(--apagado); font: 500 11px var(--mono); flex: none; }

  .hub__parceiros { display: flex; flex-wrap: wrap; gap: 10px; }
  .hub__parceiro {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border: 1px solid var(--linha); background: var(--caixa2);
    text-decoration: none; color: var(--tinta); font-size: 14px;
  }
  .hub__parceiro:hover { border-color: var(--verde); }
  .hub__parceiro img { height: 22px; width: auto; display: block; }

  /* O aviso de vencimento. Âmbar e não vermelho: nada quebrou ainda, e
     vermelho pra coisa que ainda vai acontecer gasta o vermelho à toa. */
  #avisoPlano {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin: 16px 0 0; padding: 12px 16px;
    border-left: 3px solid var(--dourado); background: var(--caixa);
    font-size: 14px; color: var(--tinta);
  }
  #avisoPlano b { font-weight: 600; }
  #avisoPlano .bt { margin-left: auto; }

  /* O cupom. Discreto: quem não tem código não pode sentir que está
     perdendo desconto por não ter. */
  /* ---------- os planos, em cartão ----------

     Eram três linhas empilhadas ocupando a largura toda. Linha empilhada é
     desenho de lista de ajustes, não de preço: nada ali dizia "escolha um",
     e o número do anual, sozinho numa linha, parecia caro do lado do
     mensal. Lado a lado a comparação se faz sozinha. */
  .pop__caixa.largo { max-width: 880px; }

  .planos3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; margin: 4px 0 20px; }
  @media (max-width: 760px) { .planos3 { grid-template-columns: 1fr; } }

  .pcard {
    position: relative; display: flex; flex-direction: column; text-align: left;
    border: 1px solid var(--linha); border-radius: 7px; background: var(--caixa);
    padding: 17px 16px 16px; cursor: pointer;
    transition: transform .14s ease-out, border-color .14s, background .14s, box-shadow .14s;
  }
  .pcard:hover { transform: translateY(-3px); border-color: var(--verde); }
  .pcard.on { border-color: var(--verde); background: var(--verde-fraco); box-shadow: inset 0 0 0 1px var(--verde); }
  .pcard.vital:hover, .pcard.vital.on { border-color: var(--dourado); }
  .pcard.vital.on { background: rgba(138,98,16,.07); box-shadow: inset 0 0 0 1px var(--dourado); }
  @media (prefers-reduced-motion: reduce) { .pcard { transition: none; } }

  .pcard__tag {
    position: absolute; top: -9px; left: 14px; padding: 3px 9px; border-radius: 10px;
    font: 600 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase;
    background: var(--verde); color: #fff;
  }
  .pcard.vital .pcard__tag { background: var(--dourado); }

  .pcard__nome {
    font: 600 11px var(--mono); letter-spacing: .14em; text-transform: uppercase;
    color: var(--fraco); margin-bottom: 7px;
  }
  .pcard__preco { font: 700 27px var(--disp); line-height: 1.1; color: var(--tinta); }
  .pcard.vital .pcard__preco { color: var(--dourado); }
  .pcard__preco .antes {
    font: 400 15px var(--disp); text-decoration: line-through; opacity: .45; margin-right: 7px;
  }
  .pcard__periodo { font-size: 12px; color: var(--apagado); margin-top: 2px; }
  .pcard__comp {
    margin-top: 9px; font-size: 12.5px; line-height: 1.45; font-weight: 600; color: var(--verde-forte);
  }
  .pcard.vital .pcard__comp { color: var(--dourado); }

  /* Numa caixa larga a lista de benefícios em coluna única vira uma tira
     comprida que empurra o preço pra fora da tela. */
  .pop__caixa.largo .pop__lista { columns: 2; column-gap: 28px; margin-bottom: 6px; }
  .pop__caixa.largo .pop__lista li { break-inside: avoid; }
  @media (max-width: 760px) { .pop__caixa.largo .pop__lista { columns: 1; } }

  .pop__cupom { display: flex; gap: 8px; margin: 0 0 10px; }
  .pop__cupom input {
    flex: 1 1 auto; min-width: 0; font: 13px var(--mono); color: var(--tinta);
    background: var(--fundo); border: 1px solid var(--linha);
    padding: 9px 10px; border-radius: 4px; text-transform: uppercase;
  }
  .pop__cupom input:focus { outline: 0; border-color: var(--verde); }
  .pop__cupomdiz { margin: -4px 0 10px; font-size: 12.5px; }

  /* A lista de cupons abertos. Existe pra quem NÃO tem código: sem ela, o
     campo de cupom só serve pra quem já sabe de um, e quem não sabe fica
     achando que está pagando mais caro que os outros. */
  .pop__temcupom {
    display: block; width: 100%; text-align: left; border: 0; background: none;
    padding: 0 0 8px; cursor: pointer; color: var(--verde-forte);
    font: 500 12px var(--mono); text-decoration: underline;
  }
  .pop__cupons { display: flex; flex-direction: column; gap: 6px; margin: 0 0 10px; }
  .pop__cupomitem {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; text-align: left; padding: 8px 10px; cursor: pointer;
    border: 1px dashed var(--verde); background: var(--verde-fraco); color: var(--tinta);
  }
  .pop__cupomitem:hover { border-style: solid; }
  .pop__cupomitem b { font: 600 12.5px var(--mono); letter-spacing: .06em; }
  .pop__cupomitem small { display: block; color: var(--fraco); font-size: 11.5px; font-weight: 400; }
  .pop__cupomitem .quanto { color: var(--verde-forte); font: 600 12.5px var(--mono); white-space: nowrap; }

  .pop__acao {
    flex: 0 0 auto;
    background: var(--caixa); padding: 14px 0 0;
    border-top: 1px solid var(--linha);
  }

  /* ---------- conteúdo ---------- */
  .w { max-width: 1080px; margin: 0 auto; padding: 30px 20px 90px; }
  h1 { font: 700 clamp(24px,4vw,34px)/1.05 var(--disp); letter-spacing: -.02em; margin: 0 0 8px; }
  .sub { color: var(--fraco); font-size: 14px; margin: 0 0 26px; max-width: 60ch; }
  h2 { font: 600 10px var(--disp); letter-spacing: .18em; text-transform: uppercase; color: var(--fraco); margin: 26px 0 10px; }

  button.bt {
    font: 600 14px var(--disp); cursor: pointer; border-radius: 4px;
    background: var(--caixa); color: var(--tinta); border: 1px solid var(--linha); padding: 11px 18px;
  }
  button.bt:hover:not(:disabled) { border-color: var(--verde); color: var(--verde-forte); }
  button.bt:disabled { opacity: .4; cursor: default; }
  button.bt.principal, a.bt.principal { background: var(--verde); color: #fff; border-color: var(--verde); }
  a.bt { font: 600 14px var(--disp); border-radius: 4px; border: 1px solid var(--linha); padding: 11px 18px; }
  button.bt.principal:hover:not(:disabled) { background: var(--verde-forte); border-color: var(--verde-forte); color: #fff; }
  button.bt.mini { padding: 7px 11px; font-size: 12px; }
  button.bt.perigo:hover:not(:disabled) { border-color: var(--perigo); color: var(--perigo); }

  /* Overlay que parou de aparecer por falta de plano. Vermelho porque é
     perda: alguma coisa que funcionava parou. */
  .cartao.travado { border-color: var(--perigo); }
  .cartao.travado .previa { opacity: .35; filter: grayscale(1); }
  .travado-selo {
    display: inline-block; margin-bottom: 6px;
    font: 600 10px var(--mono); letter-spacing: .1em; text-transform: uppercase;
    color: var(--perigo); border: 1px solid currentColor; padding: 2px 6px;
  }

  .cartoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .cartao {
    border: 1px solid var(--linha); border-radius: 6px; background: var(--caixa);
    padding: 15px 16px; display: flex; flex-direction: column; gap: 9px;
  }
  .cartao .topo { display: flex; align-items: baseline; gap: 8px; }
  .cartao b { font: 600 16px var(--disp); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .selo {
    font: 600 10px var(--disp); letter-spacing: .1em; text-transform: uppercase;
    color: var(--verde-forte); background: var(--verde-fraco); padding: 3px 7px; border-radius: 3px;
  }
  .cartao code {
    display: block; background: var(--fundo); border: 1px solid var(--linha); border-radius: 4px;
    padding: 8px 9px; font-size: 11px; color: var(--fraco);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: all;
  }
  .cartao .acoes { display: flex; gap: 6px; flex-wrap: wrap; }
  .vazio {
    border: 1px dashed var(--linha); border-radius: 6px; padding: 34px 20px;
    text-align: center; color: var(--apagado); font-size: 14px;
  }

  /* ---------- luzes ---------- */
  .luz-marcas { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .luz-aparelhos { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }
  .luz-aparelhos label {
    display: flex; align-items: center; gap: 6px; font-size: 12.5px;
    border: 1px solid var(--linha); border-radius: 4px; padding: 5px 9px;
  }
  .luz-cores { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
  .luz-bola {
    width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--linha);
    padding: 0; cursor: pointer;
  }
  .luz-bola:hover { transform: scale(1.12); }
  .luz-cena { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--linha); }
  .luz-cena:last-child { border-bottom: 0; }
  .luz-cena .amostra { width: 20px; height: 20px; border-radius: 4px; border: 1px solid var(--linha); flex: none; }
  .luz-cena code { font: 600 12.5px var(--mono); }

  /* ---------- artistas ---------- */
  .arte-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .arte-cartao {
    border: 1px solid var(--linha); border-radius: 6px; background: var(--caixa);
    overflow: hidden; display: flex; flex-direction: column;
  }
  .arte-capa {
    display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover;
    background: var(--fundo); cursor: zoom-in;
  }
  .arte-tiras { display: flex; gap: 4px; padding: 6px 8px 0; flex-wrap: wrap; }
  .arte-tiras button {
    width: 42px; height: 34px; padding: 0; overflow: hidden; cursor: pointer;
    border: 1px solid var(--linha); border-radius: 3px; background: none;
  }
  .arte-tiras button[aria-current="true"] { border-color: var(--verde); }
  .arte-tiras img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .arte-corpo { padding: 12px 14px 15px; display: flex; flex-direction: column; gap: 5px; }
  .arte-corpo .topo { display: flex; align-items: center; gap: 8px; }
  .arte-corpo .nm { font: 600 16px var(--disp); flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .arte-corpo .bio { font-size: 13px; color: var(--fraco); }
  .arte-corpo a { font-size: 12.5px; color: var(--verde-forte); text-decoration: none; }
  .arte-corpo a:hover { text-decoration: underline; }


  /* ---------- editor ---------- */
  .editor { display: grid; grid-template-columns: 1fr 340px; gap: 18px; align-items: start; }

  /* O LADO DA PRÉVIA PRECISA SER ALTO, MESMO VAZIO: O .palco já era
     sticky e mesmo assim sumia ao rolar. */
  .lado { align-self: stretch; }

  .palco {
    /* 47 é a altura medida da barra de cima, que também é grudenta; o resto
       é respiro pra prévia não encostar nela. */
    position: sticky; top: 59px;
    border: 1px solid var(--linha); border-radius: 6px; overflow: hidden;
  }

  .palco iframe { display: block; width: 100%; height: 300px; border: 0; }

  /* ---------- trechos da speedrun ---------- */
  .trechos { display: flex; flex-direction: column; gap: 6px; flex: 1 1 100%; }
  .trecho { display: flex; align-items: center; gap: 6px; }
  .trecho input { flex: 1 1 auto; min-width: 80px; }
  .trecho-n {
    width: 22px; text-align: right; color: var(--apagado);
    font: 500 12px var(--mono); font-variant-numeric: tabular-nums;
  }
  /* O tempo de referência de cada trecho: só leitura, e discreto de
     propósito — ele é medido correndo, não digitado. */
  /* A saída do diagnóstico. Monoespaçada e com quebra preservada: são
     linhas alinhadas, e reflow embaralharia o que está sendo comparado. */
  .diag {
    margin: 10px 0 0; padding: 12px 14px; background: var(--caixa2);
    border: 1px solid var(--linha); border-left: 3px solid var(--verde);
    font: 12.5px/1.6 var(--mono); color: var(--tinta);
    white-space: pre-wrap; overflow-x: auto;
  }

  .trecho-t {
    min-width: 60px; text-align: right; color: var(--fraco);
    font: 500 12px var(--mono); font-variant-numeric: tabular-nums;
  }
  .prontos { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .prontos button { text-align: left; line-height: 1.15; }
  .prontos small { display: block; font: 400 10.5px var(--mono); color: var(--apagado); margin-top: 2px; }
  .prontos button:hover small { color: var(--verde); }
  .controles > details {
    border: 1px solid var(--linha); border-radius: 6px; background: var(--caixa); margin-bottom: 8px;
  }
  .controles summary {
    cursor: pointer; padding: 12px 14px; list-style: none;
    font: 600 11px var(--disp); letter-spacing: .14em; text-transform: uppercase; color: var(--fraco);
  }
  .controles summary::-webkit-details-marker { display: none; }
  .controles details[open] summary { color: var(--verde-forte); border-bottom: 1px solid var(--linha); }
  .corpo { padding: 12px 14px; }
  /* A prévia da fonte ocupa a linha toda: numa linha estreita ao lado do
     rótulo não daria pra ver o desenho da letra. */
  .campoFonte { display: flex; flex-direction: column; gap: 6px; flex: 1 1 100%; min-width: 0; }
  .campoFonte .selFonte { width: 100%; }
  .amostraFonte {
    font-size: 20px; line-height: 1.35; color: var(--tinta);
    background: var(--fundo); border: 1px solid var(--linha); border-radius: 5px;
    padding: 7px 10px;
    /* QUEBRA, NÃO CORTA. */
    white-space: normal; word-break: break-word;
  }
  /* O rótulo tinha flex:1 disputando com um controle de largura fixa e
     era espremido até 47px — "Nome (só pra você achar)" virava cinco
     linhas. */
  .campo { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; flex-wrap: wrap; }
  .campo > label,
  .campo > .rotulo { flex: 1 1 118px; min-width: 118px; font-size: 13px; color: var(--fraco); }
  /* A linha inteira é a área de clique da chave. */
  .campo--chave { cursor: pointer; border-radius: 5px; margin-left: -6px; padding: 3px 6px; }
  .campo--chave:hover { background: var(--verde-fraco); }
  .campo--chave:hover > .rotulo { color: var(--verde-forte); }
  .campo input[type=text], .campo input[type=number], .campo select {
    width: 130px; font: 13px var(--mono); color: var(--tinta);
    background: var(--fundo); border: 1px solid var(--linha); padding: 7px 8px; border-radius: 4px;
  }
  .campo select { width: 150px; }
  .campo input[type=color] {
    width: 40px; height: 32px; padding: 2px; background: var(--fundo);
    border: 1px solid var(--linha); border-radius: 4px; cursor: pointer;
  }
  .campo input[type=range] { width: 130px; accent-color: var(--verde); }

<script>
'use strict';

const API = 'https://api.zocahop.com';
const el = (id) => document.getElementById(id);

/* ---------------- tema ---------------- */
/* Fica no navegador de quem usa. Se o localStorage estiver bloqueado (aba
   anônima, site sem permissão), o site abre no claro e segue funcionando. */
function poeTema(t) {
  document.documentElement.setAttribute('data-tema', t);
  el('btTema').textContent = t === 'escuro' ? '☀️' : '🌙';
  try { localStorage.setItem('zc:tema', t); } catch (e) {}
}
try { poeTema(localStorage.getItem('zc:tema') || 'claro'); } catch (e) { poeTema('claro'); }
el('btTema').onclick = () => {
  poeTema(document.documentElement.getAttribute('data-tema') === 'escuro' ? 'claro' : 'escuro');
};

/* ---------------- chave do painel ---------------- */
/* A CHAVE NUNCA FICA NA BARRA DE ENDEREÇOS: Ela chega de dois jeitos: no
   # (é assim que o entrar.php manda, porque o # não chega ao servidor e
   não entra em log nenhum) ou no ?chave= de um link antigo. */
/* O ENDERECO NAO GUARDA SEGREDO NEM RUIDO: Alem da chave, o "index.html"
   tambem sai: o servidor entrega a mesma pagina em "/", e um endereco
   curto e o que a pessoa consegue repetir de cabeca e mandar pra outra
   sem errar. */
// Lido ANTES do limpaEndereco, que apaga a query da URL no boot.
const SEM_CSS = new URLSearchParams(location.search).has('semcss');

function limpaEndereco(hash) {
  var caminho = location.pathname.replace(/index\.html$/, '');
  try { history.replaceState(null, '', caminho + (hash || location.hash || '')); } catch (e) {}
}

/* A CHAVE PRECISA SOBREVIVER A UMA ABA NOVA.

   Ela morava no sessionStorage, que é POR ABA: abrir o site numa guia nova
   dava lista vazia e pedia login de novo — e como a chave é guardada com
   hash, cada login gera outra, quebrando os links do OBS que carregam a
   antiga. Uma pessoa abrindo uma segunda aba entrava num ciclo de perder os
   links sem ter feito nada errado.

   O localStorage sobrevive a aba e a reinício. O sessionStorage continua
   sendo lido, pra não derrubar quem estiver com o site aberto agora. */
const guardaChave = (v) => {
  try { localStorage.setItem('zc:chave', v); } catch (e) {}
  try { sessionStorage.setItem('zc:chave', v); } catch (e) {}
};
const leChave = () => {
  try { return localStorage.getItem('zc:chave') || sessionStorage.getItem('zc:chave') || ''; }
  catch (e) { return ''; }
};
const esqueceChave = () => {
  try { localStorage.removeItem('zc:chave'); } catch (e) {}
  try { sessionStorage.removeItem('zc:chave'); } catch (e) {}
};

/* A ÚLTIMA LISTA QUE DEU CERTO, GUARDADA AQUI NO NAVEGADOR.

   Não substitui o servidor e nem tenta: é lista velha, aparece marcada como
   velha e some assim que a leitura de verdade funciona. Existe por um motivo
   só — quando a leitura falha, a pergunta da pessoa é "cadê meus overlays?",
   e a resposta útil é mostrar os links do OBS na hora, não uma tela vazia. */
const guardaListaLocal = (l) => { try { localStorage.setItem('zc:perfis', JSON.stringify(l)); } catch (e) {} };
const leListaLocal = () => {
  try { const v = JSON.parse(localStorage.getItem('zc:perfis') || '[]'); return Array.isArray(v) ? v : []; }
  catch (e) { return []; }
};

let chave = '';
try {
  const cru = decodeURIComponent((location.hash || '').slice(1));
  const naBusca = new URLSearchParams(location.search).get('chave');
  const achada = (cru && cru[0] !== '/') ? cru : (naBusca || '');
  if (achada) {
    guardaChave(achada.trim());
    limpaEndereco('#/overlays');
  }
  chave = leChave();
  if (!achada) limpaEndereco();     /* tira o index.html mesmo sem chave */
} catch (e) { chave = new URLSearchParams(location.search).get('chave') || ''; }

function recado(t, tipo) { el('recado').textContent = t || ''; el('recado').className = tipo || ''; }

async function api(caminho, opcoes) {
  const o = Object.assign({ headers: {} }, opcoes || {});
  o.headers = Object.assign({ 'X-Chave': chave, 'Content-Type': 'application/json' }, o.headers);
  const r = await fetch(API + caminho, o);

  /* RESPOSTA ILEGÍVEL NÃO PODE VIRAR OBJETO VAZIO.

     O corpo era lido com .json().catch(() => ({})). Qualquer resposta que
     não fosse JSON — um aviso do PHP impresso antes do conteúdo, uma página
     de erro da hospedagem, uma resposta cortada no meio — chegava aqui como
     200 com um objeto vazio. E 200 com objeto vazio, na lista de overlays,
     desenha exatamente a mesma tela que "você não tem overlay nenhum": sem
     erro, sem aviso, sem pista. A pessoa via os overlays dela sumirem
     enquanto no servidor estava tudo no lugar.

     Agora o corpo é lido como texto: se não der pra entender, vira erro de
     verdade, carregando o começo do que veio — que é o que diz onde
     procurar. */
  const cru = await r.text().catch(() => '');
  let d = {};
  let ilegivel = false;
  if (cru.trim() !== '') {
    try { d = JSON.parse(cru); } catch (e) { ilegivel = true; }
    if (!d || typeof d !== 'object') { d = {}; ilegivel = true; }
  }

  if (!r.ok) {
    const erro = new Error(d.erro || ('falhou (' + r.status + ')'));
    /* O status vai junto: sem ele, "sua chave não vale" e "deu ruim no
       servidor" chegam iguais em quem trata o erro, e a tela acaba dizendo a
       coisa errada na hora mais importante. */
    erro.status = r.status;
    throw erro;
  }

  if (ilegivel) {
    const erro = new Error('o servidor respondeu algo que não é JSON: ' + cru.trim().slice(0, 200));
    erro.status = 0;
    erro.ilegivel = true;
    throw erro;
  }
  return d;
}

/* ---------------- estado ---------------- */
let perfis = [];
let cfg = null;         /* config sendo editada */
let editando = null;    /* perfil sendo editado */
let quadro = null;      /* iframe do preview */
let camposPorChave = {};/* pra dar dois cliques na peça e cair no campo dela */

/* DESFAZER: Guardo a config inteira em texto a cada mudança, e não a
   "ação" que foi feita. */
let historico = [], futuro = [], guardando = null;

function marcaHistorico(agora) {
  clearTimeout(guardando);
  if (agora) return empurra();
  guardando = setTimeout(empurra, 350);
}
function empurra() {
  const s = JSON.stringify(cfg);
  if (historico.length && historico[historico.length - 1] === s) return;
  historico.push(s);
  if (historico.length > 80) historico.shift();
  futuro = [];
}

function aplicaEstado(s) {
  cfg = JSON.parse(s);
  manda();
  Object.keys(camposPorChave).forEach((k) => {
    const c = camposPorChave[k];
    if (c && c.controle && c.controle.__sincroniza) c.controle.__sincroniza();
  });
  redesenhar.forEach((f) => f());
}

function desfazer() {
  clearTimeout(guardando);
  if (historico.length < 2) { recado('Nada pra desfazer.'); return; }
  futuro.push(historico.pop());
  aplicaEstado(historico[historico.length - 1]);
  recado('Desfeito.');
}
function refazer() {
  if (!futuro.length) { recado('Nada pra refazer.'); return; }
  const s = futuro.pop();
  historico.push(s);
  aplicaEstado(s);
  recado('Refeito.');
}

document.addEventListener('keydown', (e) => {
  if (!cfg || !(e.ctrlKey || e.metaKey)) return;
  const alvo = e.target.tagName;
  /* Dentro de um campo de texto o Ctrl+Z é do campo, não meu: roubar ele
     faria a pessoa perder o que estava digitando. */
  if (alvo === 'INPUT' && e.target.type === 'text') return;
  if (alvo === 'TEXTAREA') return;

  const k = e.key.toLowerCase();
  if (k === 'z' && !e.shiftKey) { e.preventDefault(); desfazer(); }
  else if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); refazer(); }
});
let redesenhar = [];    /* controles que somem/aparecem conforme a config */

function h(tag, attrs, filhos) {
  const e = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (k === 'cls') e.className = v;
    else if (k === 'txt') e.textContent = v;
    else e.setAttribute(k, v);
  });
  (filhos || []).forEach((f) => e.appendChild(f));
  return e;
}

/* SEGREDO NA TELA.
   Nasce tapado. Quem está transmitindo não escolhe mostrar a chave: ela
   simplesmente não está lá até alguém clicar no olho. */
function segredo(valor, aoRedefinir) {
  const txt = h('span', { cls: 'txt tapado' });
  const olho = h('button', { cls: 'olho', type: 'button' });
  let aberto = false;

  const pinta = () => {
    txt.textContent = aberto ? valor : '•'.repeat(Math.min(28, Math.max(12, valor.length)));
    txt.className = 'txt ' + (aberto ? 'aberto' : 'tapado');
    olho.textContent = aberto ? '🙈' : '👁';
    olho.title = aberto ? 'Esconder' : 'Mostrar';
  };
  olho.onclick = () => { aberto = !aberto; pinta(); };

  const copiar = h('button', { cls: 'bt mini', type: 'button', txt: 'Copiar' });
  copiar.onclick = async () => {
    try { await navigator.clipboard.writeText(valor); copiar.textContent = 'Copiado'; }
    catch (e) {
      aberto = true; pinta();
      recado('Não consegui copiar. Mostrei o valor: selecione e use Ctrl+C.', 'ruim');
    }
    setTimeout(() => { copiar.textContent = 'Copiar'; }, 2000);
  };

  const filhos = [txt, olho, copiar];
  if (aoRedefinir) {
    const rd = h('button', { cls: 'bt mini perigo', type: 'button', txt: 'Redefinir' });
    rd.onclick = aoRedefinir;
    filhos.push(rd);
  }
  pinta();
  return h('div', { cls: 'segredo' }, filhos);
}

/* A prévia só nasce quando o cartão entra na tela: são vários overlays por
   pessoa, e montar todos de uma vez carregaria o desenhista e as fontes N
   vezes pra mostrar coisa que ninguém rolou até ainda. */
const observador = ('IntersectionObserver' in window) ? new IntersectionObserver((itens, obs) => {
  itens.forEach((i) => {
    if (!i.isIntersecting) return;
    obs.unobserve(i.target);
    const cx = i.target;
    const q = h('iframe', { src: 'overlay.html', title: '', tabindex: '-1', 'aria-hidden': 'true' });
    q.onload = () => {
      try {
        q.contentWindow.postMessage({ type: 'zc:config', config: JSON.parse(cx.dataset.cfg) }, location.origin);
      } catch (e) {}
    };
    cx.appendChild(q);
  });
}, { rootMargin: '150px' }) : null;

let exemploPendente = null;
function manda() {
  if (!quadro || !quadro.contentWindow) return;
  try { quadro.contentWindow.postMessage({ type: 'zc:config', config: cfg }, location.origin); } catch (e) {}
  /* Trocar de tipo remonta o desenhista e esvazia a lista. Repovoo depois de
     um respiro, e so uma vez por rajada de ajustes. */
  if (cfg.tipo === 'chat' || cfg.tipo === 'feed' || cfg.tipo === 'musica') {
    clearTimeout(exemploPendente);
    exemploPendente = setTimeout(() => {
      try { quadro.contentWindow.postMessage({ type: 'zc:exemplo' }, location.origin); } catch (e) {}
    }, 120);
  }
}

function mudou(k, v) {
  cfg[k] = v;
  manda();
  redesenhar.forEach((f) => f());
  marcaHistorico();
}

/* ---------------- fábrica de controles ---------------- */
/* Cada controle guarda como se REDESENHAR a partir da config. Sem isso o
   desfazer teria que remontar a tela inteira, e a pessoa perderia o grupo
   que estava aberto e o lugar onde estava rolando. */
const FABRICA = {
  texto(it) {
    const i = h('input', { type: 'text' });
    i.value = cfg[it.k] || '';
    i.oninput = () => mudou(it.k, i.value);
    i.__sincroniza = () => { i.value = cfg[it.k] || ''; };
    return i;
  },
  num(it) {
    const i = h('input', { type: 'number' });
    i.value = cfg[it.k] || 0;
    i.oninput = () => mudou(it.k, parseInt(i.value, 10) || 0);
    i.__sincroniza = () => { i.value = cfg[it.k] || 0; };
    return i;
  },
  cor(it) {
    const i = h('input', { type: 'color' });
    i.value = cfg[it.k] || '#ffffff';
    i.oninput = () => mudou(it.k, i.value);
    i.__sincroniza = () => { i.value = cfg[it.k] || '#ffffff'; };
    return i;
  },
  chave(it) {
    const i = h('input', { type: 'checkbox' });
    i.checked = !!cfg[it.k];
    i.onchange = () => mudou(it.k, i.checked ? 1 : 0);
    const cx = h('span', { cls: 'chave' }, [i, h('span')]);
    cx.__sincroniza = () => { i.checked = !!cfg[it.k]; };
    cx.__marcavel = true;   /* a linha inteira vira área de clique */
    return cx;
  },
  lista(it) {
    const s = h('select');
    (it.ops || []).forEach(([v, t]) => {
      const o = h('option', { value: v, txt: t });
      if (String(cfg[it.k]) === String(v)) o.selected = true;
      s.appendChild(o);
    });
    s.onchange = () => mudou(it.k, s.value);
    s.__sincroniza = () => { s.value = String(cfg[it.k]); };
    return s;
  },
  /* A BANDEJA MOSTRA A LETRA, NÃO SÓ O NOME: "Michroma", "Teko", "Doto"
     não dizem nada pra quem não é de design — e o usuário tinha que
     escolher no escuro, aplicar, olhar a prévia e voltar. */
  fontes(it) {
    Relogio.carregaTodasAsFontes(document);

    const s = h('select', { cls: 'selFonte' });
    const grupos = {};
    (Relogio.FONTS || []).forEach((f) => {
      const nome = typeof f === 'string' ? f : (f.n || f.nome || f.f);
      const g = (typeof f === 'object' && f.g) ? f.g : 'Outras';
      if (!grupos[g]) {
        grupos[g] = h('optgroup');
        grupos[g].label = g;
        s.appendChild(grupos[g]);
      }
      const o = h('option', { value: nome, txt: nome });
      /* Cada opção escrita na própria fonte. O Chrome no Windows respeita
         font-family em <option>; onde não respeitar, a amostra de baixo
         continua mostrando a letra — por isso as duas coisas existem. */
      o.style.fontFamily = Relogio.familiaDe(nome);
      o.style.fontSize = '15px';
      if (cfg[it.k] === nome) o.selected = true;
      grupos[g].appendChild(o);
    });

    const amostra = h('div', { cls: 'amostraFonte' });
    const pinta = () => {
      const nome = String(cfg[it.k] || '');
      amostra.style.fontFamily = Relogio.familiaDe(nome);
      /* Números e letras juntos: num relógio o que importa é o algarismo, e
         tem fonte bonita de letra e horrível de número. */
      amostra.textContent = 'AaBbCc 012 12:34:56';
      amostra.title = nome;
      Relogio.carregaFonte(document, nome);   /* garante os pesos reais */
    };
    pinta();

    s.onchange = () => { mudou(it.k, s.value); pinta(); };
    const cx = h('div', { cls: 'campoFonte' }, [s, amostra]);
    cx.__sincroniza = () => { s.value = String(cfg[it.k]); pinta(); };
    return cx;
  },
  /* O SOM DO ALERTA: Um controle só em vez de dois: a pergunta da pessoa
     é "qual som toca", não "som pronto ou som meu". */
  som(it) {
    const sel = h('select');
    const linha = h('div', { cls: 'campo', style: 'margin:6px 0 0;gap:6px' });
    const aviso = h('p', { cls: 'd', style: 'margin:4px 0 0' });

    const PRONTOS_SOM = [
      ['sino', 'Sino'], ['moeda', 'Moeda'],
      ['fanfarra', 'Fanfarra'], ['sopro', 'Sopro'], ['nenhum', 'Nenhum'],
    ];
    let meus = [];

    const valorAtual = () => (cfg.asom === 'proprio' ? 'meu:' + cfg.asomid : cfg.asom);

    function pinta() {
      const antes = valorAtual();
      sel.innerHTML = '';
      const gP = h('optgroup'); gP.label = 'Prontos';
      PRONTOS_SOM.forEach(([v, r]) => gP.appendChild(h('option', { value: v, txt: r })));
      sel.appendChild(gP);

      if (meus.length) {
        const gM = h('optgroup'); gM.label = 'Seus';
        meus.forEach((s) => gM.appendChild(h('option', { value: 'meu:' + s.id, txt: s.nome })));
        sel.appendChild(gM);
      }
      sel.value = antes;
      /* O som escolhido foi apagado: não finge que ainda está lá. */
      if (!sel.value) { sel.value = 'sino'; aplicaEscolha(); }
      pintaBotoes();
    }

    function aplicaEscolha() {
      const v = sel.value;
      if (v.indexOf('meu:') === 0) {
        cfg.asomid = parseInt(v.slice(4), 10) || 0;
        mudou('asom', 'proprio');
      } else {
        cfg.asomid = 0;
        mudou('asom', v);
      }
      pintaBotoes();
    }
    sel.onchange = aplicaEscolha;

    function pintaBotoes() {
      linha.innerHTML = '';
      const ehMeu = sel.value.indexOf('meu:') === 0;

      const ouvir = h('button', { cls: 'bt mini', type: 'button', txt: 'Ouvir' });
      ouvir.onclick = () => {
        /* Toca na prévia, que é onde a pessoa está olhando. O de fábrica o
           próprio desenhista faz; o seu é um arquivo, e o arquivo só existe
           depois de salvar — por isso o aviso. */
        const q = quadro && quadro.contentWindow;
        if (q) try { q.postMessage({ type: 'zc:ouvir' }, location.origin); } catch (e) {}
      };
      linha.appendChild(ouvir);

      const mandar = h('button', { cls: 'bt mini', type: 'button', txt: 'Mandar um som meu' });
      mandar.onclick = () => arquivo.click();
      linha.appendChild(mandar);

      if (ehMeu) {
        const apagar = h('button', { cls: 'bt mini perigo', type: 'button', txt: 'Apagar este' });
        apagar.onclick = async () => {
          const id = parseInt(sel.value.slice(4), 10);
          try {
            const r = await api('/som.php', { method: 'POST', body: JSON.stringify({ acao: 'apagar', id }) });
            meus = r.sons || [];
            sel.value = 'sino'; aplicaEscolha(); pinta();
            recado('Som apagado.', 'bom');
          } catch (e) { recado(e.message, 'ruim'); }
        };
        linha.appendChild(apagar);
      }

      aviso.textContent = ehMeu
        ? 'O som seu só toca no OBS depois que você salvar o overlay.'
        : 'Os prontos são feitos na hora pelo navegador — não têm arquivo pra falhar.';
    }

    /* O input de arquivo fica escondido: "Escolher arquivo / Nenhum arquivo
       selecionado" em inglês do navegador não combina com o resto da tela. */
    const arquivo = h('input', { type: 'file', accept: 'audio/*', style: 'display:none' });
    arquivo.onchange = async () => {
      const f = arquivo.files && arquivo.files[0];
      arquivo.value = '';
      if (!f) return;
      if (f.size > 1048576) {
        return recado('Esse arquivo tem ' + Math.round(f.size / 1024) + ' KB. O limite é 1 MB — alerta é um toque curto.', 'ruim');
      }
      recado('Mandando…');
      try {
        const fd = new FormData();
        fd.append('som', f);
        fd.append('nome', (f.name || 'som').replace(/\.[^.]+$/, ''));
        /* Sem Content-Type na mão: o navegador precisa pôr o boundary do
           multipart, e escrever o cabeçalho aqui quebraria isso. */
        const r = await fetch(API + '/som.php', { method: 'POST', headers: { 'X-Chave': chave }, body: fd });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.erro || 'não deu');
        meus = d.sons || [];
        const novo = meus[meus.length - 1];
        if (novo) { cfg.asomid = novo.id; mudou('asom', 'proprio'); }
        pinta();
        recado('Som guardado. Salve o overlay pra ele valer na live.', 'bom');
      } catch (e) { recado(e.message, 'ruim'); }
    };

    api('/som.php').then((d) => { meus = d.sons || []; pinta(); }).catch(() => pinta());
    pinta();

    const cx = h('div', { style: 'flex:1 1 100%;min-width:0' }, [sel, linha, aviso, arquivo]);
    cx.__sincroniza = () => pinta();
    return cx;
  },

  /* OS BOTÕES DE TESTE: Não guardam nada na config: são a prévia
     obedecendo, e só. */
  testar() {
    let repetindo = 0;
    let travado = false;

    const manda = (msg) => {
      const q = quadro && quadro.contentWindow;
      if (q) try { q.postMessage(msg, location.origin); } catch (e) {}
    };

    const bRepetir = h('button', { cls: 'bt mini', type: 'button', txt: 'Mostrar de novo' });
    bRepetir.onclick = () => manda({ type: 'zc:repetir' });

    const bLoop = h('button', { cls: 'bt mini', type: 'button', txt: 'Repetir sem parar' });
    const paraLoop = () => {
      clearInterval(repetindo); repetindo = 0;
      bLoop.textContent = 'Repetir sem parar';
      bLoop.classList.remove('perigo');
    };
    bLoop.onclick = () => {
      if (repetindo) return paraLoop();
      if (travado) bTravar.onclick();          /* travado e repetindo se anulam */

      const roda = () => {
        manda({ type: 'zc:repetir' });
        /* O intervalo sai da config a cada volta, e não uma vez só: enquanto
           a pessoa arrasta "demora pra aparecer", o ciclo tem que acompanhar
           — senão ela mexe no controle e o que vê na tela é o ritmo antigo. */
        const ciclo = (cfg.manim === 'surge' ? 900 : (cfg.mabrir || 900) + (cfg.mfechar || 1400))
                    + (cfg.mtempo || 7) * 1000 + 400;
        clearInterval(repetindo);
        repetindo = setInterval(roda, ciclo);
      };
      roda();
      bLoop.textContent = 'Parar de repetir';
      bLoop.classList.add('perigo');
    };

    const bTravar = h('button', { cls: 'bt mini', type: 'button', txt: 'Travar na tela' });
    bTravar.onclick = () => {
      travado = !travado;
      if (travado && repetindo) paraLoop();
      manda({ type: 'zc:travar', on: travado });
      bTravar.textContent = travado ? 'Destravar' : 'Travar na tela';
      bTravar.classList.toggle('perigo', travado);
    };

    const cx = h('div', { style: 'flex:1 1 100%;min-width:0' }, [
      h('div', { cls: 'campo', style: 'margin:0;gap:6px' }, [bRepetir, bLoop, bTravar]),
      h('p', { cls: 'd', style: 'margin:4px 0 0',
               txt: 'Isto vale só aqui na prévia. Nada disso vai pro OBS nem fica salvo.' }),
    ]);
    /* Ao desfazer/refazer a tela se remonta e o loop morre junto; o botão
       precisa voltar a dizer a verdade. */
    cx.__sincroniza = () => { if (!repetindo) paraLoop(); };
    return cx;
  },

  faixa(it) {
    const i = h('input', { type: 'range' });
    i.min = it.min; i.max = it.max; i.step = it.passo || 1;
    i.value = cfg[it.k];
    /* A unidade pode ser função pra concordar com o número: "1 real" e
       "2 reais". Texto errado em português é o tipo de coisa que faz o
       produto parecer amador mesmo quando o resto está certo. */
    const un = (n) => (typeof it.u === 'function' ? it.u(n) : (it.u || ''));
    const v = h('span', { cls: 'valor', txt: cfg[it.k] + un(cfg[it.k]) });
    i.oninput = () => { v.textContent = i.value + un(parseInt(i.value, 10)); mudou(it.k, parseInt(i.value, 10)); };
    const cx = h('span', { cls: 'campo', style: 'margin:0;gap:8px' }, [i, v]);
    cx.__sincroniza = () => { i.value = cfg[it.k]; v.textContent = cfg[it.k] + un(cfg[it.k]); };
    return cx;
  },
  /* Pausado guarda quanto FALTA; correndo guarda QUANDO acaba. São contas
     diferentes, e somar no campo errado faria o tempo sumir. */
  /* PAUSAR TEM QUE CONGELAR O TEMPO, NÃO SÓ O RÓTULO.

     Era uma lista comum: trocar pra "Pausado" mudava só a palavra. O
     cronômetro guarda duas coisas diferentes — correndo guarda QUANDO acaba,
     pausado guarda QUANTO FALTA — e sem converter uma na outra na hora da
     troca, o "quando acaba" seguia no lugar. Na volta, o tempo que passou
     durante a pausa tinha sumido: pra quem transmite, o relógio continuou
     correndo escondido. */
  /* O QUE CADA PLATAFORMA SABE RESPONDER.

     Não é escolha de produto, é o que a API oficial de cada uma expõe hoje.
     O Kick não tem contagem de seguidores em endpoint nenhum, e o YouTube não
     tem "seguidor" nem espectador por aqui. Oferecer o que vai falhar seria
     empurrar o usuário pra um overlay que nunca enche. */
  fontemeta(it) {
    const POR_PLATAFORMA = {
      twitch:  [['seguidores', 'Seguidores'], ['subs', 'Subs'], ['viewers', 'Gente assistindo']],
      youtube: [['subs', 'Inscritos']],
      kick:    [['subs', 'Assinantes'], ['viewers', 'Gente assistindo']],
    };
    const s = h('select');

    const pinta = () => {
      const ops = (POR_PLATAFORMA[cfg.plataforma] || POR_PLATAFORMA.twitch).slice();
      ops.push(['manual', 'Eu digito']);
      s.innerHTML = '';
      ops.forEach(([v, r]) => {
        const o = h('option', { value: v, txt: r });
        if (cfg[it.k] === v) o.selected = true;
        s.appendChild(o);
      });
      /* A fonte antiga pode não existir na plataforma nova — cair no
         silêncio deixaria a meta apontando pra um número que ninguém
         responde.

         Escreve no cfg direto em vez de chamar mudou(): esta função roda
         DENTRO do ciclo de redesenho, e mudou() dispara outro ciclo por
         dentro dele. O valor se perdia nessa reentrada. */
      /* Comparar com a LISTA, e não com s.value: um select sem opção
         correspondente não fica vazio — o navegador escolhe a primeira
         sozinho, então s.value nunca denunciava a troca. */
      if (!ops.some(([v2]) => v2 === cfg[it.k])) cfg[it.k] = s.value;
    };
    pinta();

    s.onchange = () => mudou(it.k, s.value);
    s.__sincroniza = pinta;
    /* O __sincroniza sozinho não basta: ele só roda no desfazer. Quem é
       chamado a cada mudança é o redesenhar — e esta lista PRECISA mudar
       quando a plataforma muda, senão ela continua oferecendo seguidores
       num Kick que não conta seguidores. */
    redesenhar.push(pinta);
    return s;
  },

  /* ------------------------------------------------------------------ *
   *  Os trechos da run
   * ------------------------------------------------------------------ */

  /* Um trecho é { n: nome, p: tempo do recorde, b: melhor parcial }. Aqui só
     se edita o NOME e a ordem: p e b são medidos correndo, não digitados.
     Deixar a pessoa digitar o próprio recorde seria abrir a porta pra uma
     comparação que não corresponde a corrida nenhuma. */
  trechos(it) {
    const caixa = h('div', { cls: 'trechos' });

    const grava = (lista) => mudou(it.k, lista);

    const pinta = () => {
      const lista = Array.isArray(cfg[it.k]) ? cfg[it.k] : [];
      caixa.innerHTML = '';

      lista.forEach((tr, i) => {
        const nome = h('input', { type: 'text', value: tr.n || '', placeholder: 'Nome do trecho' });
        nome.oninput = () => {
          const l = cfg[it.k].slice();
          l[i] = Object.assign({}, l[i], { n: nome.value.slice(0, 40) });
          /* Escrevo direto e mando salvar: passar por mudou() aqui
             redesenharia o campo embaixo do dedo e perderia o cursor. */
          cfg[it.k] = l;
          manda();
        };

        const sobe = h('button', { cls: 'bt mini', type: 'button', txt: '↑', title: 'Subir' });
        sobe.disabled = i === 0;
        sobe.onclick = () => {
          const l = cfg[it.k].slice();
          const x = l[i - 1]; l[i - 1] = l[i]; l[i] = x;
          grava(l);
        };

        const desce = h('button', { cls: 'bt mini', type: 'button', txt: '↓', title: 'Descer' });
        desce.disabled = i === lista.length - 1;
        desce.onclick = () => {
          const l = cfg[it.k].slice();
          const x = l[i + 1]; l[i + 1] = l[i]; l[i] = x;
          grava(l);
        };

        const fora = h('button', { cls: 'bt mini perigo', type: 'button', txt: '×', title: 'Tirar' });
        fora.onclick = () => {
          if (!confirm('Tirar "' + (tr.n || 'este trecho') + '"? O recorde dele vai junto.')) return;
          const l = cfg[it.k].slice();
          l.splice(i, 1);
          grava(l);
        };

        const marca = h('span', { cls: 'trecho-t', txt:
          tr.p != null ? Speedrun.tempo(tr.p, false) : '—' });

        caixa.appendChild(h('div', { cls: 'trecho' }, [
          h('span', { cls: 'trecho-n', txt: String(i + 1) }),
          nome, marca, sobe, desce, fora,
        ]));
      });

      const mais = h('button', { cls: 'bt mini', type: 'button', txt: '+ Adicionar trecho' });
      mais.onclick = () => {
        const l = (Array.isArray(cfg[it.k]) ? cfg[it.k] : []).slice();
        if (l.length >= 40) return recado('Quarenta trechos já é bastante.', 'ruim');
        l.push({ n: '', p: null, b: null });
        grava(l);
      };
      caixa.appendChild(mais);
    };

    redesenhar.push(pinta);
    pinta();
    return caixa;
  },

  /* ------------------------------------------------------------------ *
   *  Os botões da corrida
   * ------------------------------------------------------------------ */

  /* NÃO EXISTE TECLA GLOBAL AQUI, E ISSO PRECISA FICAR CLARO.

     O LiveSplit é um programa do Windows e consegue ouvir a tecla com o jogo
     em primeiro plano. Uma página não consegue: só recebe tecla quando ELA
     está em foco. Por isso os atalhos abaixo valem com esta aba na frente, e
     quem joga em tela cheia usa o !split pelo chat. */
  corrida(it) {
    const visor = h('b', { cls: 'valor', style: 'width:auto;font:600 18px var(--mono);color:var(--tinta)' });
    const passo = h('p', { cls: 'd', style: 'margin:2px 0 8px;flex:1 1 100%' });
    const linha = h('div', { cls: 'tempoBotoes' });

    const agora = () => Math.round(Relogio.agoraServidor());
    const cor = () => cfg[it.k] || { e: 'parado', i: 0, pa: 0, s: [] };
    const trechos = () => (Array.isArray(cfg.sptre) ? cfg.sptre : []);

    const grava = (novo) => mudou(it.k, novo);

    /* Fecha a corrida: guarda os melhores parciais sempre, e o recorde só se
       o tempo final tiver sido melhor. São duas coisas diferentes — um trecho
       recorde dentro de uma run ruim continua sendo um trecho recorde. */
    const fecha = (c) => {
      const tre = trechos().slice();
      let melhorou = false;

      for (let i = 0; i < tre.length && i < c.s.length; i++) {
        const seg = c.s[i] - (i > 0 ? c.s[i - 1] : 0);
        if (tre[i].b == null || seg < tre[i].b) {
          tre[i] = Object.assign({}, tre[i], { b: seg });
        }
      }

      const finalAgora = c.s[c.s.length - 1];
      const finalAntes = tre.length ? tre[tre.length - 1].p : null;
      if (c.s.length === tre.length && (finalAntes == null || finalAgora < finalAntes)) {
        for (let i = 0; i < tre.length; i++) tre[i] = Object.assign({}, tre[i], { p: c.s[i] });
        melhorou = true;
      }

      cfg.sptre = tre;
      return melhorou;
    };

    const acoes = {
      iniciar: () => grava({ e: 'correndo', i: agora(), pa: 0, s: [] }),

      split: () => {
        const c = cor();
        if (c.e !== 'correndo') return;
        const s = (c.s || []).slice();
        s.push(agora() - c.i);

        if (s.length >= trechos().length && trechos().length > 0) {
          const fim = { e: 'fim', i: 0, pa: s[s.length - 1], s: s };
          const melhorou = fecha(fim);
          grava(fim);
          recado(melhorou ? 'Recorde novo! ' + Speedrun.tempo(fim.pa, true) : 'Run fechada em ' + Speedrun.tempo(fim.pa, true), melhorou ? 'bom' : '');
          return;
        }
        grava({ e: 'correndo', i: c.i, pa: 0, s: s });
      },

      desfazer: () => {
        const c = cor();
        if (!c.s || !c.s.length) return;
        const s = c.s.slice();
        s.pop();
        /* Desfazer depois do fim volta a correr: o relógio precisa continuar
           de onde estava, e não do zero. */
        if (c.e === 'fim') grava({ e: 'correndo', i: agora() - c.pa, pa: 0, s: s });
        else grava({ e: c.e, i: c.i, pa: c.pa, s: s });
      },

      pausar: () => {
        const c = cor();
        if (c.e === 'correndo') grava({ e: 'pausado', i: 0, pa: agora() - c.i, s: c.s || [] });
        else if (c.e === 'pausado') grava({ e: 'correndo', i: agora() - (c.pa || 0), pa: 0, s: c.s || [] });
      },

      zerar: () => {
        if (!confirm('Zerar a corrida? Os recordes ficam; só o tempo de agora volta a zero.')) return;
        grava({ e: 'parado', i: 0, pa: 0, s: [] });
      },
    };

    [['Iniciar', 'iniciar'], ['Split', 'split'], ['Desfazer', 'desfazer'],
     ['Pausar', 'pausar'], ['Zerar', 'zerar']].forEach(([txt, acao]) => {
      const b = h('button', { cls: 'bt mini', type: 'button', txt });
      b.dataset.acao = acao;
      b.onclick = () => acoes[acao]();
      linha.appendChild(b);
    });

    const pinta = () => {
      const c = cor();
      const ms = c.e === 'correndo' ? agora() - c.i : (c.pa || 0);
      visor.textContent = Speedrun.tempo(ms, true);

      const n = trechos().length;
      const feitos = (c.s || []).length;
      const nomes = { parado: 'parada', correndo: 'correndo', pausado: 'pausada', fim: 'terminada' };
      passo.textContent = n === 0
        ? 'Adicione os trechos aí embaixo antes de começar.'
        : 'Corrida ' + (nomes[c.e] || c.e) + ' — trecho ' + Math.min(feitos + 1, n) + ' de ' + n + '.';

      linha.querySelector('[data-acao="pausar"]').textContent = c.e === 'pausado' ? 'Continuar' : 'Pausar';
      linha.querySelector('[data-acao="iniciar"]').disabled = c.e === 'correndo' || c.e === 'pausado' || n === 0;
      linha.querySelector('[data-acao="split"]').disabled = c.e !== 'correndo';
      linha.querySelector('[data-acao="desfazer"]').disabled = !(c.s || []).length;
      linha.querySelector('[data-acao="pausar"]').disabled = c.e === 'parado' || c.e === 'fim';
    };

    /* O visor anda sozinho enquanto a corrida corre. Meio segundo é o
       bastante aqui: este número é conferência, o que a live vê é a overlay. */
    const tique = setInterval(() => { if (cor().e === 'correndo') pinta(); }, 500);
    window.addEventListener('hashchange', () => clearInterval(tique), { once: true });

    /* Atalhos, só com esta aba em foco e fora de campo de texto. */
    const tecla = (e) => {
      if (!document.body.contains(linha)) return;
      const alvo = e.target && e.target.tagName;
      if (alvo === 'INPUT' || alvo === 'TEXTAREA' || alvo === 'SELECT') return;
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); cor().e === 'correndo' ? acoes.split() : acoes.iniciar(); }
      else if (e.key === 'Backspace') { e.preventDefault(); acoes.desfazer(); }
      else if (e.key.toLowerCase() === 'p') acoes.pausar();
    };
    document.addEventListener('keydown', tecla);

    redesenhar.push(pinta);
    pinta();
    return h('div', {}, [visor, passo, linha,
      h('p', { cls: 'd', style: 'margin:6px 0 0;flex:1 1 100%', txt:
        'Com esta aba na frente: espaço ou Enter inicia e dá split, Backspace desfaz, P pausa. '
        + 'Jogando em tela cheia a página não recebe tecla nenhuma — aí é !split pelo chat.' })]);
  },

  pausa(it) {
    const s = h('select');
    [['pausado', 'Pausado'], ['rodando', 'Correndo']].forEach(([v2, r]) => {
      const o = h('option', { value: v2, txt: r });
      if (cfg[it.k] === v2) o.selected = true;
      s.appendChild(o);
    });

    const agora = () => Math.round(Relogio.agoraServidor() / 1000);

    s.onchange = () => {
      if (s.value === 'pausado') {
        cfg.restante = Math.max(0, (cfg.fim || 0) - agora());
      } else {
        cfg.fim = agora() + Math.max(0, cfg.restante || 0);
      }
      mudou(it.k, s.value);
    };
    s.__sincroniza = () => { s.value = String(cfg[it.k]); };
    return s;
  },

  tempo() {
    const visor = h('b', { cls: 'valor', style: 'width:auto;font:600 15px var(--disp);color:var(--tinta)' });
    const linha = h('div', { cls: 'tempoBotoes' });

    const agora = () => Math.round(Relogio.agoraServidor() / 1000);
    const falta = () => (cfg.modo === 'rodando' ? Math.max(0, cfg.fim - agora()) : cfg.restante);
    const pinta = () => { visor.textContent = Relogio.tempoHMS(falta(), true); };

    const poe = (seg) => {
      seg = Math.max(0, Math.min(2592000, Math.round(seg)));
      if (cfg.modo === 'rodando') mudou('fim', agora() + seg);
      else mudou('restante', seg);
      pinta();
    };
    [['-10 min', -600], ['-1 min', -60], ['+1 min', 60], ['+10 min', 600], ['+1 h', 3600], ['Zerar', null]]
      .forEach(([txt, d]) => {
        const b = h('button', { cls: 'bt mini', type: 'button', txt });
        b.onclick = () => {
          if (d === null) { if (confirm('Zerar o tempo?')) poe(0); }
          else poe(falta() + d);
        };
        linha.appendChild(b);
      });
    pinta();
    redesenhar.push(pinta);
    return h('div', {}, [visor, linha]);
  },
};

const TELAS = [

  ['#/meu',       'Meu Controller', 'chave, conta e plano'],
  ['#/comandos',  'Comandos',      'o que o chat pode fazer'],

function nomeDaTela(hash) {
  const p2 = (hash || '#/overlays').replace(/^#\//, '').split('/');

  if (p2[0] === 'inicio') return null;                       /* a raiz */
  if (p2[0] === 'novo' && TIPOS[p2[1]]) return ['#/overlays', 'Meus overlays', 'Criar ' + TIPOS[p2[1]].nome.toLowerCase()];
  if (p2[0] === 'editar') {
    const perfil = perfis.find((x) => String(x.id) === String(p2[1]));
    return ['#/overlays', 'Meus overlays', 'Editando ' + (perfil ? (perfil.nome || 'overlay') : 'overlay')];
  }
  if (p2[0] === 'admin') return [null, 'Administração', null];
  if (p2[1] && TIPOS[p2[1]]) return ['#/overlays', 'Meus overlays', TIPOS[p2[1]].nome];

  const achou = TELAS.find((x) => x[0] === '#/' + p2[0]);
  return achou ? [null, achou[1], null] : [null, 'Meus overlays', null];
}

    hash: '#/editar/' + p2.id,
