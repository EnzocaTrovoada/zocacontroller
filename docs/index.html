function telaComandos() {
  const tela = el('tela');
  tela.innerHTML = '';
  tela.appendChild(h('h1', { txt: 'Comandos' }));
  tela.appendChild(h('p', { cls: 'sub', txt: 'O que o seu chat pode mandar pro OBS. Os de fábrica já funcionam; os seus são apelidos com o argumento pronto — "!brb" vira "cena Cenário BRB".' }));

  /* ----- os de fábrica ----- */
  const fab = h('div', { cls: 'fatia' }, [
    h('h3', { txt: 'Já funcionam' }),
    h('p', { cls: 'd', txt: 'Quem pode usar é decidido pela etiqueta que a Twitch manda junto da mensagem — não dá pra fingir ser mod. A ordem é: chat, sub, VIP, mod, moderador-chefe, você.' }),
  ]);
  DE_FABRICA.forEach((c) => {
    fab.appendChild(h('div', { cls: 'campo' }, [
      h('code', { txt: '!' + c[0], style: 'flex:0 0 96px;background:var(--fundo);border:1px solid var(--linha);border-radius:4px;padding:5px 8px;font-size:12px;color:var(--verde-forte)' }),
      h('span', { cls: 'selo', txt: c[1] }),
      h('label', { style: 'flex:1 1 200px', txt: c[2] }),
    ]));
  });
  tela.appendChild(fab);

  /* ----- os seus ----- */
  const meus = h('div', { cls: 'fatia' }, [
    h('h3', { txt: 'Os seus' }),
    h('p', { cls: 'd', txt: 'Um comando seu não é código novo: é um nome novo pra uma ação que já existe, com o argumento já preenchido. Assim o mod digita "!brb" em vez de lembrar o nome exato da cena.' }),
  ]);
  const listaMeus = h('div');
  meus.appendChild(listaMeus);

  const cNome = h('input', { type: 'text', placeholder: 'brb' });

  /* OS PASSOS: Um comando não é mais um apelido pra uma ação: é uma
     sequência. */
  const listaPassos = h('div');
  let passos = [{ acao: 'cena', argumento: '' }];

  function pintaPassos() {
    listaPassos.innerHTML = '';
    passos.forEach((p, i) => {
      const sel = h('select', { style: 'flex:0 0 130px' });
      DE_FABRICA.forEach((c) => {
        const o = h('option', { value: c[0], txt: c[0] });
        if (c[0] === p.acao) o.selected = true;
        sel.appendChild(o);
      });
      sel.onchange = () => { p.acao = sel.value; };

      const arg = h('input', { type: 'text', placeholder: 'sem argumento', style: 'flex:1 1 130px' });
      arg.value = p.argumento || '';
      arg.oninput = () => { p.argumento = arg.value; };

      const tirar = h('button', { cls: 'bt mini perigo', type: 'button', txt: '×', title: 'Tirar este passo' });
      tirar.onclick = () => { passos.splice(i, 1); if (!passos.length) passos = [{ acao: 'cena', argumento: '' }]; pintaPassos(); };

      listaPassos.appendChild(h('div', { cls: 'campo' }, [
        h('span', { style: 'flex:0 0 20px;font-size:12px;color:var(--apagado)', txt: (i + 1) + '.' }),
        sel, arg, tirar,
      ]));
    });

    const mais = h('button', { cls: 'bt mini', type: 'button', txt: '+ mais uma ação' });
    mais.disabled = passos.length >= 8;
    mais.onclick = () => { passos.push({ acao: 'mute', argumento: '' }); pintaPassos(); };
    listaPassos.appendChild(h('p', { style: 'margin:4px 0 0' }, [mais]));
  }
  pintaPassos();
  const cQuem = h('select');
  /* Quem esta em cima pode tudo que os de baixo podem: liberar pra "subs"
     tambem libera pra VIP e mod. */
  [
    ['chat', 'Qualquer um do chat'],
    ['sub', 'Subs pra cima'],
    ['vip', 'VIPs pra cima'],
    ['mod', 'Mods pra cima'],
    ['supermod', 'Só moderadores-chefe'],
    ['dono', 'Só eu'],
  ].forEach((q) => cQuem.appendChild(h('option', { value: q[0], txt: q[1] })));
  cQuem.value = 'mod';
  const cEspera = h('input', { type: 'number', min: '1', max: '600', value: '5' });
  let editandoCmd = null;

  const salvar = h('button', { cls: 'bt principal', type: 'button', txt: 'Criar comando' });
  salvar.onclick = async () => {
    salvar.disabled = true;
    try {
      await api('/comandos.php', { method: 'POST', body: JSON.stringify({
        acao: 'salvar', id: editandoCmd, nome: cNome.value, passos: passos,
        quem: cQuem.value, espera: parseInt(cEspera.value, 10) || 5,
      }) });
      cNome.value = ''; passos = [{ acao: 'cena', argumento: '' }]; pintaPassos();
      editandoCmd = null;
      salvar.textContent = 'Criar comando';
      recado('Pronto. A fonte do OBS pega em até 5 minutos, ou na hora se você recarregar ela.', 'bom');
      pintaMeus();
    } catch (e) { recado(e.message, 'ruim'); }
    salvar.disabled = false;
  };

  meus.append(
    h('div', { cls: 'campo' }, [h('label', { txt: 'Nome (sem o !)' }), cNome]),
    h('p', { style: 'margin:14px 0 4px;font-size:13px;color:var(--fraco)', txt: 'Faz o quê, nesta ordem' }),
    listaPassos,
    h('p', { style: 'margin:6px 0 12px;font-size:11.5px;color:var(--apagado)',
             txt: 'o argumento é o nome de uma cena, de uma fonte, ou o texto de uma enquete — deixe vazio no que não precisa' }),
    h('div', { cls: 'campo' }, [h('label', { txt: 'Quem pode usar' }), cQuem]),
    h('div', { cls: 'campo' }, [h('label', { txt: 'Espera entre usos (s)' }), cEspera]),
    h('p', { style: 'margin:6px 0 12px' }, [salvar]),
  );
  tela.appendChild(meus);

  async function pintaMeus() {
    listaMeus.innerHTML = '';
    let d;
    try { d = await api('/comandos.php'); } catch (e) { recado(e.message, 'ruim'); return; }
    const lista = d.comandos || [];
    if (!lista.length) {
      listaMeus.appendChild(h('div', { cls: 'vazio', txt: 'Nenhum comando seu ainda.' }));
      return;
    }
    lista.forEach((c) => {
      const ed = h('button', { cls: 'bt mini', type: 'button', txt: 'Editar' });
      ed.onclick = () => {
        editandoCmd = c.id;
        cNome.value = c.nome;
        /* O servidor entrega sempre uma lista, mesmo pros de um passo só. */
        passos = (c.passos && c.passos.length ? c.passos : [{ acao: c.acao, argumento: c.argumento }])
          .map((p) => ({ acao: p.acao, argumento: p.argumento || '' }));
        pintaPassos();
        cQuem.value = c.quem; cEspera.value = c.espera;
        salvar.textContent = 'Salvar alterações';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      const ap = h('button', { cls: 'bt mini perigo', type: 'button', txt: 'Apagar' });
      ap.onclick = async () => {
        if (!confirm('Apagar o !' + c.nome + '?')) return;
        try { await api('/comandos.php', { method: 'POST', body: JSON.stringify({ acao: 'apagar', id: c.id }) }); pintaMeus(); }
        catch (e) { recado(e.message, 'ruim'); }
      };
      listaMeus.appendChild(h('div', { cls: 'campo' }, [
        h('code', { txt: '!' + c.nome, style: 'flex:0 0 96px;background:var(--fundo);border:1px solid var(--linha);border-radius:4px;padding:5px 8px;font-size:12px;color:var(--verde-forte)' }),
        h('label', { txt: (c.passos || [{ acao: c.acao, argumento: c.argumento }])
            .map((p) => p.acao + (p.argumento ? ' ' + p.argumento : '')).join('  →  ')
            + '  ·  ' + c.quem + '  ·  ' + c.espera + 's' }),
        ed, ap,
      ]));
    });
  }
  pintaMeus();

  /* ================= GATILHOS: quando acontecer X, faca Y
     ================= A mesma sequencia de passos dos comandos, so que
     quem "digita" e o evento. */

  const EVENTOS = [
    ['sub',      'Alguem assinou',              'assinaturas'],
    ['presente', 'Alguem deu subs de presente', 'subs de uma vez'],
    ['bits',     'Alguem mandou bits',          'bits'],
    ['follow',   'Alguem comecou a seguir',     'seguidores'],
    ['real',     'Alguem doou',                 'reais'],
    ['raid',     'Chegou um raid',              'pessoas'],
  ];
  const unidadeDe = (e) => {
    const achou = EVENTOS.find((x) => x[0] === e);
    return achou ? achou[2] : '';
  };
  const rotuloDe = (e) => {
    const achou = EVENTOS.find((x) => x[0] === e);
    return achou ? achou[1] : e;
  };

  const gat = h('div', { cls: 'fatia' }, [
    h('h3', { txt: 'Sozinho, quando acontecer' }),
    h('p', { cls: 'd', txt: 'E o mesmo comando de cima, so que ninguem precisa digitar: o evento dispara. Serve pra trocar de cena quando alguem da dez subs, ou mostrar uma fonte quando chega um raid. No argumento, {quem} vira o nome da pessoa e {quanto} vira o numero.' }),
  ]);
  const listaGat = h('div');
  gat.appendChild(listaGat);

  const gEvento = h('select');
  EVENTOS.forEach((e) => gEvento.appendChild(h('option', { value: e[0], txt: e[1] })));

  const gMin = h('input', { type: 'number', min: '1', value: '1', style: 'flex:0 0 90px' });
  const gUnid = h('span', { cls: 'd' });
  const gEspera = h('input', { type: 'number', min: '0', value: '10', style: 'flex:0 0 90px' });

  const listaGPassos = h('div');
  let gPassos = [{ acao: 'cena', argumento: '' }];
  let editandoGat = 0;

  function pintaGPassos() {
    listaGPassos.innerHTML = '';
    gPassos.forEach((pp, i) => {
      const sel = h('select', { style: 'flex:0 0 130px' });
      /* Panico e companhia nao aparecem: o servidor recusa, e oferecer o que
         vai ser recusado e armadilha. Evento nao se modera — um gatilho de
         panico no follow seria a live derrubada por quem clicasse em seguir. */
      DE_FABRICA.filter((c) => ['panico', 'voltar', 'ganhou'].indexOf(c[0]) === -1).forEach((c) => {
        const o = h('option', { value: c[0], txt: c[0] });
        if (c[0] === pp.acao) o.selected = true;
        sel.appendChild(o);
      });
      sel.onchange = () => { pp.acao = sel.value; };

      const arg = h('input', { type: 'text', placeholder: 'sem argumento', style: 'flex:1 1 130px' });
      arg.value = pp.argumento || '';
      arg.oninput = () => { pp.argumento = arg.value; };

      const tirar = h('button', { cls: 'bt mini perigo', type: 'button', txt: 'x', title: 'Tirar este passo' });
      tirar.onclick = () => {
        gPassos.splice(i, 1);
        if (!gPassos.length) gPassos = [{ acao: 'cena', argumento: '' }];
        pintaGPassos();
      };

      listaGPassos.appendChild(h('div', { cls: 'campo' }, [
        h('span', { style: 'flex:0 0 20px;font-size:12px;color:var(--apagado)', txt: (i + 1) + '.' }),
        sel, arg, tirar,
      ]));
    });
    const mais = h('button', { cls: 'bt mini', type: 'button', txt: '+ mais uma acao' });
    mais.disabled = gPassos.length >= 8;
    mais.onclick = () => { gPassos.push({ acao: 'fonte', argumento: '' }); pintaGPassos(); };
    listaGPassos.appendChild(h('p', { style: 'margin:4px 0 0' }, [mais]));
  }
  pintaGPassos();

  const pintaUnidade = () => { gUnid.textContent = unidadeDe(gEvento.value); };
  gEvento.onchange = pintaUnidade;
  pintaUnidade();

  const gSalvar = h('button', { cls: 'bt', type: 'button', txt: 'Criar gatilho' });
  const gLimpar = h('button', { cls: 'bt fraco escondido', type: 'button', txt: 'Cancelar' });

  const gLimpaForm = () => {
    editandoGat = 0;
    gEvento.value = 'sub'; gMin.value = '1'; gEspera.value = '10';
    gPassos = [{ acao: 'cena', argumento: '' }];
    pintaGPassos(); pintaUnidade();
    gSalvar.textContent = 'Criar gatilho';
    gLimpar.classList.add('escondido');
  };
  gLimpar.onclick = gLimpaForm;

  gSalvar.onclick = async () => {
    gSalvar.disabled = true;
    try {
      await api('/comandos.php', { method: 'POST', body: JSON.stringify({
        acao: 'gatilho', id: editandoGat, evento: gEvento.value,
        minimo: parseInt(gMin.value, 10) || 1,
        espera: parseInt(gEspera.value, 10) || 0,
        ligado: 1, passos: gPassos,
      }) });
      recado('Gatilho salvo. A ponte pega em ate um minuto.', 'bom');
      gLimpaForm();
      pintaGatilhos();
    } catch (e) { recado(e.message, 'ruim'); }
    gSalvar.disabled = false;
  };

  async function pintaGatilhos() {
    listaGat.innerHTML = '';
    let d;
    try { d = await api('/comandos.php'); } catch (e) { return; }

    const gs = d.gatilhos || [];
    if (!gs.length) {
      listaGat.appendChild(h('p', { cls: 'd', txt: 'Nenhum ainda.' }));
      return;
    }
    gs.forEach((g) => {
      const quando = rotuloDe(g.evento)
        + (g.minimo > 1 ? ' (a partir de ' + g.minimo + ' ' + unidadeDe(g.evento) + ')' : '');
      const oQue = (g.passos || [])
        .map((pp) => pp.acao + (pp.argumento ? ' ' + pp.argumento : '')).join(' -> ');

      const mexer = h('button', { cls: 'bt mini', type: 'button', txt: 'Editar' });
      mexer.onclick = () => {
        editandoGat = g.id;
        gEvento.value = g.evento; gMin.value = g.minimo; gEspera.value = g.espera;
        gPassos = (g.passos || []).map((pp) => ({ acao: pp.acao, argumento: pp.argumento || '' }));
        if (!gPassos.length) gPassos = [{ acao: 'cena', argumento: '' }];
        pintaGPassos(); pintaUnidade();
        gSalvar.textContent = 'Salvar gatilho';
        gLimpar.classList.remove('escondido');
      };

      const apagar = h('button', { cls: 'bt mini perigo', type: 'button', txt: 'Apagar' });
      apagar.onclick = async () => {
        try {
          await api('/comandos.php', { method: 'POST', body: JSON.stringify({ acao: 'gatilho-apagar', id: g.id }) });
          pintaGatilhos();
        } catch (e) { recado(e.message, 'ruim'); }
      };

      listaGat.appendChild(h('div', { cls: 'campo' }, [
        h('span', { cls: 'selo', txt: quando }),
        h('label', { style: 'flex:1 1 200px', txt: oQue }),
        mexer, apagar,
      ]));
    });
  }
  pintaGatilhos();

  gat.appendChild(h('div', { cls: 'campo' }, [h('label', { txt: 'Quando' }), gEvento]));
  gat.appendChild(h('div', { cls: 'campo' }, [h('label', { txt: 'A partir de' }), gMin, gUnid]));
  gat.appendChild(h('p', { cls: 'd', style: 'margin:-4px 0 10px', txt: 'Com o minimo em 1, uma live movimentada dispara o tempo todo. Dez subs de presente valem "10" de uma vez.' }));
  gat.appendChild(h('div', { cls: 'campo' }, [h('label', { txt: 'Faca' })]));
  gat.appendChild(listaGPassos);
  gat.appendChild(h('div', { cls: 'campo' }, [
    h('label', { txt: 'Espera entre disparos' }), gEspera, h('span', { cls: 'd', txt: 'segundos' }),
  ]));
  gat.appendChild(h('p', { cls: 'd', style: 'margin:-4px 0 10px', txt: 'Dez subs seguidos nao podem virar dez trocas de cena.' }));
  gat.appendChild(h('div', { cls: 'acoes', style: 'display:flex;gap:8px' }, [gSalvar, gLimpar]));
  tela.appendChild(gat);
}

/* A prévia devolve o arrasto por mensagem. Só aceito da mesma origem, e só
   as chaves de posição — nada mais entra na config por este caminho. */
const CHAVES_DE_POSICAO = ['nx', 'ny', 'tx', 'ty', 'bx', 'by', 'clarg', 'size'];
const PECA_PRO_CAMPO = { numero: 'size', nome: 'titulo', barra: 'bcor' };

window.addEventListener('message', (e) => {
  if (e.origin !== location.origin || !cfg) return;
  const d = e.data;
  if (!d) return;

  if (d.type === 'zc:moveu' && d.valores) {
    Object.keys(d.valores).forEach((k) => {
      if (CHAVES_DE_POSICAO.includes(k)) cfg[k] = d.valores[k];
    });
    return;
  }

  if (d.type === 'zc:soltou') {
    redesenhar.forEach((f) => f());
    marcaHistorico(true);     /* o arrasto inteiro é UM passo, não um por pixel */
    return;
  }

  if (d.type === 'zc:escolheu') {
    const alvo = camposPorChave[PECA_PRO_CAMPO[d.peca]];
    if (!alvo) return;
    if (alvo.grupo) alvo.grupo.open = true;
    alvo.linha.scrollIntoView({ block: 'center', behavior: 'smooth' });
    try { alvo.controle.focus(); alvo.controle.select && alvo.controle.select(); } catch (err) {}
  }
});


/* SUBATHON: Quanto cada coisa soma no cronometro. */
const REGRAS = [
  { k: 'seg_sub1',   nome: 'Sub',        obs: 'e Prime também',    padrao: 300 },
  { k: 'seg_sub2',   nome: 'Sub tier 2', obs: '',                  padrao: 600 },
  { k: 'seg_sub3',   nome: 'Sub tier 3', obs: '',                  padrao: 1500 },
  { k: 'seg_bits',   nome: 'Bits',       obs: 'a cada 100 bits',   padrao: 30 },
  { k: 'seg_real',   nome: 'Doação',     obs: 'por R$ 1 no LivePix', padrao: 60 },
  { k: 'seg_follow', nome: 'Follow',     obs: 'precisa ligar o aviso abaixo', padrao: 0 },
];

const paraMin = (seg) => Math.round((seg / 60) * 100) / 100;
const paraSeg = (min) => Math.round(parseFloat(String(min).replace(',', '.')) * 60) || 0;

async function telaSubathon() {
  const tela = el('tela');
  tela.innerHTML = '';
  tela.appendChild(h('h1', { txt: 'Subathon' }));
  tela.appendChild(h('p', { cls: 'sub', txt: 'Quanto cada sub, bit ou doação estica a sua live. Sub e bits chegam pelo chat sozinhos; follow e doação precisam de um passo a mais, logo abaixo.' }));

  let d = {};
  try { d = await api('/subathon.php'); } catch (e) { /* ainda não configurado */ }
  const regras = d.regras || {};

  /* ----- qual cronômetro ----- */
  const cronos = perfis.filter((p) => p.tipo === 'subathon');
  const fatiaAlvo = h('div', { cls: 'fatia' }, [
    h('h3', { txt: 'Qual cronômetro' }),
    h('p', { cls: 'd', txt: 'O tempo entra no overlay que você escolher aqui. Antes era preciso copiar um código do outro site — agora é só apontar.' }),
  ]);

  const selAlvo = h('select', { style: 'width:100%' });
  if (!cronos.length) {
    fatiaAlvo.appendChild(h('div', { cls: 'vazio', txt: 'Você ainda não tem um overlay de subathon.' }));
    const criar = h('button', { cls: 'bt principal', type: 'button', txt: '+ Criar cronômetro de subathon' });
    criar.onclick = () => vaiPara('#/novo/subathon');
    fatiaAlvo.appendChild(h('p', { style: 'margin:10px 0 0' }, [criar]));
  } else {
    cronos.forEach((c) => {
      const o = h('option', { value: String(c.id), txt: c.nome || 'Sem nome' });
      if (String(d.perfil_id) === String(c.id)) o.selected = true;
      selAlvo.appendChild(o);
    });
    fatiaAlvo.appendChild(h('div', { cls: 'campo' }, [h('label', { txt: 'Cronômetro' }), selAlvo]));
    if (!d.perfil_id && d.slug) {
      fatiaAlvo.appendChild(h('p', { cls: 'aviso', txt: 'Hoje isto aponta pro cronômetro ' + d.slug + ', lá no site do relógio. Ao salvar, passa a apontar pro overlay escolhido acima.' }));
    }
  }
  tela.appendChild(fatiaAlvo);

  /* ----- as regras ----- */
  const fatiaRegras = h('div', { cls: 'fatia' }, [
    h('h3', { txt: 'Quanto cada coisa soma' }),
    h('p', { cls: 'd', txt: 'Em minutos. Deixe em 0 o que você não quiser contar — some da conta e da legenda do overlay.' }),
  ]);
  const entradas = {};
  REGRAS.concat([{ k: 'teto_evento', nome: 'Teto por evento', obs: 'um cheer gigante não vira dois dias de live', padrao: 7200 }])
    .forEach((r) => {
      const inp = h('input', { type: 'text', inputmode: 'decimal' });
      inp.value = paraMin(regras[r.k] !== undefined ? regras[r.k] : r.padrao);
      entradas[r.k] = inp;
      const estado = h('span', { style: 'flex:0 0 62px;font-size:11.5px;text-align:right' });
      const pinta = () => {
        const off = paraSeg(inp.value) <= 0;
        estado.textContent = off ? 'não soma' : 'valendo';
        estado.style.color = off ? 'var(--apagado)' : 'var(--verde-forte)';
      };
      inp.oninput = pinta; pinta();
      fatiaRegras.appendChild(h('div', { cls: 'campo' }, [
        h('label', { txt: r.nome + (r.obs ? ' — ' + r.obs : '') }), inp,
        h('span', { style: 'flex:0 0 26px;font-size:12px;color:var(--apagado)', txt: 'min' }),
        estado,
      ]));
    });
  tela.appendChild(fatiaRegras);

  /* ----- meta de viewers ----- */
  const vAlvo = h('input', { type: 'number', min: '0' });
  const vSeg = h('input', { type: 'number', min: '0' });
  const vPasso = h('input', { type: 'number', min: '0' });
  vAlvo.value = d.viewers_alvo || 0;
  vSeg.value = Math.round((d.viewers_seg || 0) / 60 * 100) / 100;
  vPasso.value = d.viewers_passo || 0;

  const fatiaViewers = h('div', { cls: 'fatia' }, [
    h('h3', { txt: 'Meta de gente assistindo' }),
    h('p', { cls: 'd', txt: 'Bateu o número de espectadores, soma tempo — e o alvo sobe sozinho pro próximo. Deixe o alvo em 0 pra desligar.' }),
    h('div', { cls: 'campo' }, [h('label', { txt: 'Bater em' }), vAlvo,
      h('span', { style: 'flex:0 0 60px;font-size:12px;color:var(--apagado)', txt: 'pessoas' })]),
    h('div', { cls: 'campo' }, [h('label', { txt: 'Soma' }), vSeg,
      h('span', { style: 'flex:0 0 60px;font-size:12px;color:var(--apagado)', txt: 'min' })]),
    h('div', { cls: 'campo' }, [h('label', { txt: 'E o próximo alvo sobe' }), vPasso,
      h('span', { style: 'flex:0 0 60px;font-size:12px;color:var(--apagado)', txt: 'pessoas' })]),
    h('p', { cls: 'aviso', txt: 'A conta é conferida quando um overlay de meta de viewers está no ar — é ele que pergunta pra Twitch quantos estão assistindo. Sem esse overlay, a meta não dispara.' }),
  ]);
  tela.appendChild(fatiaViewers);

  /* ----- metas de seguidores e de subs ----- Mesma forma da de viewers,
     e por isso saem da mesma função em vez de três blocos quase iguais. */
  function fatiaMeta(chave, titulo, explica, unidade) {
    const alvo = h('input', { type: 'number', min: '0' });
    const seg = h('input', { type: 'number', min: '0' });
    const passo = h('input', { type: 'number', min: '0' });
    alvo.value = d[chave + '_alvo'] || 0;
    seg.value = Math.round((d[chave + '_seg'] || 0) / 60 * 100) / 100;
    passo.value = d[chave + '_passo'] || 0;

    const unid = (txt) => h('span', { style: 'flex:0 0 60px;font-size:12px;color:var(--apagado)', txt });

    tela.appendChild(h('div', { cls: 'fatia' }, [
      h('h3', { txt: titulo }),
      h('p', { cls: 'd', txt: explica }),
      h('div', { cls: 'campo' }, [h('label', { txt: 'Bater em' }), alvo, unid(unidade)]),
      h('div', { cls: 'campo' }, [h('label', { txt: 'Soma' }), seg, unid('min')]),
      h('div', { cls: 'campo' }, [h('label', { txt: 'E o próximo alvo sobe' }), passo, unid(unidade)]),
    ]));
    return { alvo, seg, passo };
  }

  const mSeg = fatiaMeta('seguidores', 'Meta de seguidores',
    'Chegou no número de seguidores, soma tempo — e o alvo sobe sozinho pro próximo. Deixe em 0 pra desligar.', 'seguidores');
  const mSub = fatiaMeta('subs', 'Meta de subs',
    'Chegou no número de assinantes, soma tempo — e o alvo sobe sozinho pro próximo. Deixe em 0 pra desligar.', 'subs');

  /* O LIVEPIX MORAVA SÓ NA TELA ANTIGA.

     Quem usa o hub nunca via onde configurar a doação — e então testava, o
     tempo não subia, e a conclusão era "o subathon não funciona com LivePix".
     Funciona; faltava a tela. O estado aparece junto porque "conectado mas
     nenhum aviso chegou" e "nem conectado" pedem coisas diferentes. */
  const lpEstado = h('p', { cls: 'd', txt: 'vendo…' });
  const lpId = h('input', { type: 'text', placeholder: 'Client ID' });
  const lpSec = h('input', { type: 'password', placeholder: 'Client Secret' });
  const lpBt = h('button', { cls: 'bt', type: 'button', txt: 'Conectar' });
  const lpUrl = h('div', { cls: 'escondido' });

  const lpMostraUrl = (url) => {
    lpUrl.innerHTML = '';
    if (!url) return;
    lpUrl.appendChild(h('p', { cls: 'd', style: 'margin:10px 0 4px',
      txt: 'Cole este endereço no webhook do LivePix (evento de pagamento):' }));
    lpUrl.appendChild(segredo(url));
    lpUrl.classList.remove('escondido');
  };

  async function lpVer() {
    try {
      const d = await api('/livepix.php');
      if (!d.configurado) {
        lpEstado.textContent = 'Não conectado. Sem isso, doação não soma tempo.';
        lpEstado.style.color = '';
        return;
      }
      lpId.value = d.client_id || '';
      lpBt.textContent = 'Trocar credenciais';
      lpMostraUrl(d.url);

      if (!d.ligado) {
        lpEstado.textContent = 'Desligado.';
        lpEstado.style.color = 'var(--perigo)';
      } else if (!d.ultimo_ok) {
        /* Este é o caso que o seu amigo viveu: as credenciais estão certas e
           mesmo assim nada chega, porque o webhook não foi criado lá. */
        lpEstado.textContent = 'Conectado, mas nenhuma doação chegou ainda. Se você já testou e não somou, o webhook não foi criado no LivePix — é o endereço aqui embaixo.';
        lpEstado.style.color = 'var(--perigo)';
      } else {
        lpEstado.textContent = 'Conectado, e a última doação chegou em '
          + new Date(String(d.ultimo_ok).replace(' ', 'T')).toLocaleString('pt-BR') + '.';
        lpEstado.style.color = 'var(--verde-forte)';
      }
    } catch (e) {
      lpEstado.textContent = 'Não consegui perguntar: ' + e.message;
    }
  }

  lpBt.onclick = async () => {
    const cid = lpId.value.trim(), sec = lpSec.value.trim();
    if (!cid || !sec) return recado('Cole o Client ID e o Client Secret.', 'ruim');
    lpBt.disabled = true;
    try {
      const d = await api('/livepix.php', { method: 'POST', body: JSON.stringify({ client_id: cid, client_secret: sec }) });
      lpSec.value = '';
      lpMostraUrl(d.url);
      recado('LivePix conectado. Agora crie o webhook lá com o endereço que apareceu.', 'bom');
    } catch (e) { recado(e.message, 'ruim'); }
    lpBt.disabled = false;
    lpVer();
  };

  tela.appendChild(h('div', { cls: 'fatia' }, [
    h('h3', { txt: 'Doação pelo LivePix' }),
    h('p', { cls: 'd', txt: 'São dois passos, e o segundo é o que costuma faltar: conectar a conta aqui, e depois criar o webhook no painel do LivePix com o endereço que vai aparecer. Sem o webhook o LivePix não avisa ninguém, e o tempo não sobe.' }),
    lpEstado,
    h('div', { cls: 'campo' }, [h('label', { txt: 'Client ID' }), lpId]),
    h('div', { cls: 'campo' }, [h('label', { txt: 'Client Secret' }), lpSec]),
    h('div', { cls: 'acoes', style: 'display:flex;gap:8px' }, [lpBt]),
    lpUrl,
  ]));
  lpVer();

  /* O DIAGNÓSTICO DA CONTAGEM: Sem isto, quando a Twitch recusa a leitura
     de seguidores a meta fica parada no número antigo e a pessoa acha que
     o overlay quebrou. */
  const diag = h('p', { cls: 'd' });
  const fatiaDiag = h('div', { cls: 'fatia' }, [
    h('h3', { txt: 'A Twitch está respondendo?' }),
    diag,
  ]);
  tela.appendChild(fatiaDiag);

  (async () => {
    diag.textContent = 'Perguntando…';
    try {
      const r = await api('/contagem.php?fonte=seguidores');
      if (r.ok && r.valor !== null) {
        diag.textContent = 'Sim: o canal tem ' + r.valor.toLocaleString('pt-BR')
          + (r.valor === 1 ? ' seguidor.' : ' seguidores.');
        diag.style.color = 'var(--verde-forte)';
        return;
      }
      diag.textContent = r.explica || 'Não consegui ler os seguidores agora.';
      diag.style.color = 'var(--perigo)';
      /* O código cru embaixo, pequeno. Feio, mas é o que me deixa consertar
         sem ficar adivinhando pelo print de quem reportou. */
      if (r.codigo) {
        fatiaDiag.appendChild(h('p', { cls: 'd', style: 'margin:6px 0 0;opacity:.6;font-size:11px',
                                       txt: 'código: ' + r.codigo }));
      }
      if (r.falta_escopo) {
        const b = h('button', { cls: 'bt mini', type: 'button', txt: 'Entrar de novo na Twitch' });
        b.onclick = () => { location.href = API + '/entrar.php'; };

  /* ----- follow ----- */
  const fatiaFollow = h('div', { cls: 'fatia' }, [
    h('h3', { txt: 'Aviso de follow' }),
    h('p', { cls: 'd', txt: 'Sub e bits a gente lê do chat. Follow a Twitch só conta se a gente pedir — é um clique, uma vez só.' }),
  ]);
  const estFollow = h('span', { style: 'flex:1;font-size:13px;color:var(--apagado)', txt: 'conferindo…' });
  const btFollow = h('button', { cls: 'bt', type: 'button', txt: 'Ligar o aviso de follow' });
  btFollow.onclick = async () => {
    btFollow.disabled = true;
    try {
      const r = await api('/eventsub.php', { method: 'POST', body: '{}' });
      if (r.erros && r.erros.length) recado(r.erros[0], 'ruim');
      else recado('Pronto. A partir de agora follow também soma.', 'bom');
    } catch (e) { recado(e.message, 'ruim'); }
    veFollow();
  };
  async function veFollow() {
    try {
      const r = await api('/eventsub.php');
      const on = (r.assinaturas || []).some((a) => a.tipo === 'channel.follow' && a.estado !== 'revoked');
      if (r.falta_escopo) {
        estFollow.textContent = 'falta permissão — entre de novo com a Twitch';
        btFollow.disabled = true;
      } else {
        estFollow.textContent = on ? 'ligado' : 'desligado';
        estFollow.style.color = on ? 'var(--verde-forte)' : 'var(--apagado)';
        btFollow.disabled = on;
        if (on) btFollow.textContent = 'Já está ligado';
      }
    } catch (e) { estFollow.textContent = 'não consegui conferir'; }
  }
  fatiaFollow.appendChild(h('div', { cls: 'campo' }, [estFollow, btFollow]));
  tela.appendChild(fatiaFollow);
  veFollow();

  /* ----- salvar ----- */
  const btSalvar = h('button', { cls: 'bt principal', type: 'button', txt: 'Salvar' });
  const btLigar = h('button', { cls: 'bt', type: 'button', txt: (d.ligado === false) ? 'Ligar' : 'Desligar' });
  let ligado = d.ligado !== false;

  async function grava(trocaLigado) {
    if (trocaLigado) ligado = !ligado;
    const corpo = {};
    Object.keys(entradas).forEach((k) => { corpo[k] = paraSeg(entradas[k].value); });
    if (!corpo.teto_evento) corpo.teto_evento = 7200;
    corpo.viewers_alvo = Math.max(0, parseInt(vAlvo.value, 10) || 0);
    corpo.viewers_seg = paraSeg(vSeg.value);
    corpo.viewers_passo = Math.max(0, parseInt(vPasso.value, 10) || 0);
    for (const [nome, campos] of [['seguidores', mSeg], ['subs', mSub]]) {
      corpo[nome + '_alvo'] = Math.max(0, parseInt(campos.alvo.value, 10) || 0);
      corpo[nome + '_seg'] = paraSeg(campos.seg.value);
      corpo[nome + '_passo'] = Math.max(0, parseInt(campos.passo.value, 10) || 0);
    }
    if (cronos.length) corpo.perfil_id = parseInt(selAlvo.value, 10);
    else if (d.slug) { corpo.slug = d.slug; corpo.token = d.token || ''; }
    if (!ligado) corpo.desligar = 1;

    btSalvar.disabled = true;
    try {
      const r = await api('/subathon.php', { method: 'POST', body: JSON.stringify(corpo) });
      btLigar.textContent = ligado ? 'Desligar' : 'Ligar';
      recado(r.aviso || (ligado ? 'Salvo. O subathon já está contando sozinho.' : 'Salvo, e desligado — nada vai somar.'),
             r.aviso ? 'ruim' : 'bom');
    } catch (e) { recado(e.message, 'ruim'); }
    btSalvar.disabled = false;
  }
  btSalvar.onclick = () => grava(false);
  btLigar.onclick = () => grava(true);
  tela.appendChild(h('p', { style: 'display:flex;gap:8px;margin-top:14px' }, [btSalvar, btLigar]));
}

     que você mandou o link e a pessoa perdeu. */
  function comoEsta(c) {
    if (c.revogado) return ['revogado', 'var(--apagado)'];
    if (c.usado_ha === null || c.usado_ha === undefined) return ['nunca abriu', 'var(--perigo)'];
    const dias = Math.floor(c.usado_ha / 86400);
    if (dias <= 0) return ['usou hoje', 'var(--verde-forte)'];
    if (dias === 1) return ['usou ontem', 'var(--verde-forte)'];
    if (dias < 14) return ['há ' + dias + ' dias', 'var(--apagado)'];
    return ['parado há ' + dias + ' dias', 'var(--perigo)'];

        h('span', { style: 'flex:0 0 auto;font-size:12px;color:' + cor, txt }),
      ]);
      if (!c.revogado) {
        const bt = h('button', { cls: 'bt mini perigo', type: 'button', txt: 'Revogar' });
        bt.onclick = async () => {
          if (!confirm('Tirar o acesso de ' + c.nome + '?\n\nO link dele para de funcionar na hora, e isso não tem volta: pra devolver o acesso você cria um link novo.')) return;
          try { await api('/convite.php', { method: 'POST', body: JSON.stringify({ revogar: c.id }) }); recado('Acesso de ' + c.nome + ' removido.', 'bom'); lista(); }
          catch (e) { recado(e.message, 'ruim'); }
        };
        linha.appendChild(bt);
      }
      cx.appendChild(linha);
    });
  }
  lista();
}

/* ---------------- a vitrine, no admin ---------------- */

const VITRINE_FATIAS = [
  ['usuario', 'Quem usa o site', 'sorteado entre as contas do ZocaController que estiverem no ar'],
  ['pro',     'Assinante',       'só entre quem paga — é o que faz assinar valer algo além dos recursos'],
  ['twitch',  'Descoberta',      'qualquer canal pequeno em português, usuário do site ou não'],

function blocoVitrine() {
  const cx = h('div', { cls: 'fatia' }, [
    h('h3', { txt: 'Vitrine da página inicial' }),
    h('p', { cls: 'd', txt: 'Três painéis. Sem ninguém no ar, o painel não aparece.' }),
  ]);

  const corpo = h('div');
  cx.appendChild(corpo);

  const carrega = () => {
    corpo.innerHTML = '';
    api('/vitrine.php', { method: 'POST', body: JSON.stringify({ acao: 'estado' }) }).then((d) => {
      const cfg = d.config || {};
      const campos = {};

      VITRINE_FATIAS.forEach(([k, nome, dica]) => {
        const c = cfg[k] || {};

        const liga = h('input', { type: 'checkbox' });
        liga.checked = c.ligado !== false;

        const fixo = h('input', { type: 'text', placeholder: 'sortear', style: 'flex:0 0 150px' });
        fixo.value = c.fixo || '';

        const cat = h('input', { type: 'text', placeholder: 'qualquer categoria', style: 'flex:0 0 170px' });
        cat.value = c.categoria || '';

        const dinovo = h('button', { cls: 'bt mini', type: 'button', txt: 'Sortear de novo' });
        dinovo.onclick = async () => {
          dinovo.disabled = true;
          try {
            await api('/vitrine.php', { method: 'POST', body: JSON.stringify({ acao: 'sortear', fatia: k }) });
            recado('Pronto. O próximo a abrir a página inicial já vê outro canal.', 'bom');
          } catch (e) { recado(e.message, 'ruim'); }
          dinovo.disabled = false;
        };

        campos[k] = { liga, fixo, cat };

        const linha = h('div', { cls: 'campo', style: 'flex-wrap:wrap;gap:10px' }, [
          h('label', { style: 'flex:0 0 130px' }, [liga, document.createTextNode(' ' + nome)]),
          h('span', { cls: 'd', style: 'flex:0 0 90px', txt: 'canal fixo' }), fixo,
        ]);
        /* Categoria só faz sentido onde existe sorteio na Twitch: nas outras
           duas o conjunto já é "quem usa o site", e filtrar por jogo ali só
           encolheria um grupo que já é pequeno. */
        if (k === 'twitch') {
          linha.appendChild(h('span', { cls: 'd', style: 'flex:0 0 70px', txt: 'categoria' }));
          linha.appendChild(cat);
        }
        linha.appendChild(dinovo);

        corpo.appendChild(linha);
        corpo.appendChild(h('p', { cls: 'd', style: 'margin:0 0 12px', txt: dica
          + '. Escrevendo um canal em "canal fixo", ele manda em cima do sorteio.' }));
      });

      const salvar = h('button', { cls: 'bt principal', type: 'button', txt: 'Salvar a vitrine' });
      salvar.onclick = async () => {
        salvar.disabled = true;
        const corpoReq = { acao: 'config' };
        VITRINE_FATIAS.forEach(([k]) => {
          corpoReq[k] = {
            ligado: campos[k].liga.checked,
            fixo: campos[k].fixo.value.trim(),
            categoria: campos[k].cat.value.trim(),
          };
        });
        try {
          await api('/vitrine.php', { method: 'POST', body: JSON.stringify(corpoReq) });
          recado('Vitrine salva. Mudar a regra apaga o sorteio de hoje, então já vale agora.', 'bom');
        } catch (e) { recado(e.message, 'ruim'); }
        salvar.disabled = false;
      };
      corpo.appendChild(salvar);

      /* ----- a lista de banidos ----- */
      corpo.appendChild(h('h3', { style: 'margin-top:22px', txt: 'Quem não pode aparecer' }));
      corpo.appendChild(h('p', { cls: 'd', txt: 'Vale pros três painéis, e tira da tela na hora.' }));

      const nome = h('input', { type: 'text', placeholder: 'canal na Twitch', style: 'flex:0 0 170px' });
      const motivo = h('input', { type: 'text', placeholder: 'motivo (só você vê)', style: 'flex:1 1 200px' });
      const banir = h('button', { cls: 'bt mini perigo', type: 'button', txt: 'Banir' });
      banir.onclick = async () => {
        if (!nome.value.trim()) return recado('Escreva o canal.', 'ruim');
        banir.disabled = true;
        try {
          await api('/vitrine.php', { method: 'POST', body: JSON.stringify({
            acao: 'banir', login: nome.value.trim(), motivo: motivo.value.trim() }) });
          nome.value = ''; motivo.value = '';
          carrega();
        } catch (e) { recado(e.message, 'ruim'); }
        banir.disabled = false;
      };
      corpo.appendChild(h('div', { cls: 'campo', style: 'flex-wrap:wrap;gap:8px' }, [nome, motivo, banir]));

      const bans = d.bloqueados || [];
      if (!bans.length) {
        corpo.appendChild(h('p', { cls: 'd', txt: 'Ninguém banido.' }));
      } else {
        bans.forEach((b) => {
          const tirar = h('button', { cls: 'bt mini', type: 'button', txt: 'Tirar' });
          tirar.onclick = async () => {
            try {
              await api('/vitrine.php', { method: 'POST', body: JSON.stringify({ acao: 'desbanir', login: b.login }) });
              carrega();
            } catch (e) { recado(e.message, 'ruim'); }
          };
          corpo.appendChild(h('div', { cls: 'campo', style: 'gap:10px' }, [
            h('b', { style: 'flex:0 0 170px', txt: b.login }),
            h('span', { cls: 'd', style: 'flex:1', txt: b.motivo || '—' }),
            tirar,
          ]));
        });
      }
    }).catch((e) => {
      corpo.appendChild(h('p', { cls: 'd', txt: 'Não consegui ler a vitrine: ' + e.message }));
    });
  };

  carrega();
  return cx;
}

/* ---------------- cupons e parceiros ---------------- */

const reaisDe = (c) => ((c || 0) / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

/* A CONTA DA COMISSÃO, ANTES DE PROMETER QUALQUER COISA.

   Cupom e comissão são números independentes que saem de bolsos diferentes:
   o cupom sai do preço, a comissão sai do que sobrou pra você. Somar os dois
   de cabeça erra, e errar aqui é fechar parceria no prejuízo.

   As taxas do Mercado Pago são de 2026, recebendo na hora. */
const CALC_TAXAS = { pix: 0.99, credito: 4.98, debito: 1.99 };

function calculadoraComissao() {
  const campo = (rot, el2) => h('label', {}, [document.createTextNode(rot), el2]);

  const preco = h('input', { type: 'text', value: '13,99' });
  const desc = h('input', { type: 'number', value: '20', min: '0', max: '100' });
  const com = h('input', { type: 'number', value: '20', min: '0', max: '100' });
  const meio = h('select');
  [['pix', 'Pix'], ['credito', 'Crédito'], ['debito', 'Débito']]
    .forEach(([v, r]) => meio.appendChild(h('option', { value: v, txt: r })));

  const saida = h('div', { cls: 'calc-saida' });

  const conta = () => {
    const tab = Math.round((parseFloat(String(preco.value).replace(',', '.')) || 0) * 100);
    const d = Math.max(0, Math.min(100, parseFloat(desc.value) || 0));
    const c = Math.max(0, Math.min(100, parseFloat(com.value) || 0));
    const tx = CALC_TAXAS[meio.value];

    const paga = Math.round(tab * (100 - d) / 100);
    const comis = Math.round(paga * c / 100);
    const taxa = Math.round(paga * tx / 100);
    const sobra = paga - comis - taxa;
    const pct = tab > 0 ? Math.round(sobra / tab * 100) : 0;

    const reais = (v) => (v / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

    saida.innerHTML = '';
    const linha = (rot, val, cls) => {
      saida.appendChild(h('span', { cls: cls || '', txt: rot }));
      saida.appendChild(h('span', { cls: 'v ' + (cls || ''), txt: val }));
    };

    linha('Tabela', reais(tab));
    linha('Cliente paga (−' + d + '%)', reais(paga));
    linha('Parceiro leva (' + c + '%)', '− ' + reais(comis));
    /* Vírgula, não ponto: é número em português no meio de reais. */
    linha('Taxa ' + meio.options[meio.selectedIndex].text
          + ' (' + String(tx).replace('.', ',') + '%)', '− ' + reais(taxa));
    linha('Sobra pra você', reais(sobra) + '  (' + pct + '%)', 'forte ' + (pct >= 50 ? 'bom' : 'ruim'));

    if (pct < 50) {
      saida.appendChild(h('span', { cls: 'ruim', style: 'grid-column:1/-1;margin-top:6px;font-size:12px',
        txt: pct <= 0 ? 'Esta combinação dá PREJUÍZO.' : 'Sobra menos da metade da tabela.' }));
    }
  };

  [preco, desc, com].forEach((e) => { e.oninput = conta; });
  meio.onchange = conta;
  conta();

  return h('div', { cls: 'so-adm' }, [
    h('p', { style: 'margin:0 0 8px', txt: 'Calculadora: o desconto sai do preço, a comissão sai do que sobra.' }),
    h('div', { cls: 'calc' }, [
      campo('preço', preco), campo('cupom %', desc),
      campo('comissão %', com), campo('pago com', meio),
    ]),
    saida,
  ]);
}

function blocoEstilo() {
  const area = h('textarea', { style: 'width:100%;min-height:150px;font:12.5px/1.5 var(--mono);'
    + 'color:var(--tinta);background:var(--fundo);border:1px solid var(--linha);padding:10px;border-radius:4px' });
  const salvar = h('button', { cls: 'bt principal', type: 'button', txt: 'Salvar CSS' });
  const prever = h('button', { cls: 'bt mini', type: 'button', txt: 'Testar sem salvar' });
  const limpar = h('button', { cls: 'bt mini perigo', type: 'button', txt: 'Apagar tudo' });
  const diz = h('span', { cls: 'd', style: 'font-size:12px' });

  const aplica = (css) => {
    const antiga = el('cssExtra');
    if (antiga) antiga.remove();
    const tag = document.createElement('style');
    tag.id = 'cssExtra';
    tag.textContent = css;
    document.head.appendChild(tag);
  };

  prever.onclick = () => {
    aplica(area.value);
    diz.textContent = 'testando — recarregue a página pra desfazer';
    diz.style.color = 'var(--dourado)';
  };

  limpar.onclick = async () => {
    if (!confirm('Apagar todo o CSS extra?')) return;
    area.value = '';
    salvar.click();
  };

  api('/estilo.php').then((d) => { area.value = d.css || ''; }).catch(() => {});

  salvar.onclick = async () => {
    salvar.disabled = true;
    diz.textContent = 'salvando…';
    try {
      await api('/estilo.php', { method: 'POST', body: JSON.stringify({ css: area.value }) });
      aplica(area.value);
      diz.textContent = 'salvo e aplicado';
      diz.style.color = 'var(--verde-forte)';
    } catch (e) {
      diz.textContent = e.message;
      diz.style.color = 'var(--perigo)';
    }

  };

  return h('div', { cls: 'fatia' }, [
    h('h3', { txt: 'CSS extra' }),
    h('div', { cls: 'so-adm' }, [
      h('p', { style: 'margin:0 0 8px', txt: 'Entra depois da folha do site e vale pra todo mundo. '
        + 'Se quebrar o painel, abra ?semcss=1 no fim do endereço: o site ignora este CSS e você volta aqui pra apagar.' }),
      area,
      h('div', { style: 'margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap' },
        [salvar, prever, limpar, diz]),
    ]),
  ]);
}

/* ---------------- artistas ----------------

   A verificação é humana e o site diz isso: detector de imagem gerada erra
   dos dois lados, e errar contra um artista humano é pior do que deixar
   passar. */

const ARTE_SELO = 'Quer dizer que a inscrição foi conferida na mão, uma por uma, '
  + 'olhando o arquivo de processo que a pessoa mandou: rascunho, PSD ou gravação de tela. '
  + 'Não é detector automático — eles erram, e errar contra quem desenhou de verdade é pior '
  + 'do que deixar passar.';

const urlObra = (o) => API + '/artistas.php?a=obra&id=' + o.id + (o.t ? '&t=' + encodeURIComponent(o.t) : '');
const linkSeguro = (u) => (typeof u === 'string' && /^https?:\/\//i.test(u)) ? u : '';

function cartaoArtista(a) {
  const obras = (a.obras || []).filter((o) => !o.processo);
  const cx = h('div', { cls: 'arte-cartao' });

  if (obras.length) {
    const capa = h('img', { cls: 'arte-capa', loading: 'lazy', alt: a.nome, src: urlObra(obras[0]) });
    let atual = obras[0];
    capa.onclick = () => window.open(urlObra(atual), '_blank', 'noopener');
    cx.appendChild(capa);

    if (obras.length > 1) {
      const tiras = h('div', { cls: 'arte-tiras' });
      obras.forEach((o, i) => {
        const b = h('button', { type: 'button', title: o.titulo || ('imagem ' + (i + 1)) },
          [h('img', { src: urlObra(o), loading: 'lazy', alt: '' })]);
        b.setAttribute('aria-current', i === 0 ? 'true' : 'false');
        b.onclick = () => {
          atual = o;
          capa.src = urlObra(o);
          tiras.querySelectorAll('button').forEach((x) => x.setAttribute('aria-current', x === b ? 'true' : 'false'));
        };
        tiras.appendChild(b);
      });
      cx.appendChild(tiras);
    }
  }

  const topo = h('div', { cls: 'topo' }, [h('span', { cls: 'nm', txt: a.nome })]);
  if (a.sem_ia) topo.appendChild(h('span', { cls: 'selo', txt: 'Sem IA' }));

  const corpo = h('div', { cls: 'arte-corpo' }, [topo]);
  if (a.bio) corpo.appendChild(h('span', { cls: 'bio', txt: a.bio }));

  const url = linkSeguro(a.link);
  if (url) {
    corpo.appendChild(h('a', { href: url, target: '_blank', rel: 'noopener noreferrer nofollow',
      txt: a.arroba ? '@' + a.arroba : 'Ver o trabalho' }));
  } else if (a.arroba) {
    corpo.appendChild(h('span', { cls: 'd', txt: '@' + a.arroba }));
  }

  cx.appendChild(corpo);
  return cx;
}

function formArtista() {
  const nome    = h('input', { type: 'text', maxlength: '80',  placeholder: 'Seu nome de artista', style: 'flex:1 1 200px' });
  const arroba  = h('input', { type: 'text', maxlength: '64',  placeholder: '@ (opcional)', style: 'flex:0 0 150px' });
  const link    = h('input', { type: 'url',  maxlength: '190', placeholder: 'https://… onde ver o seu trabalho', style: 'flex:1 1 240px' });
  const bio     = h('input', { type: 'text', maxlength: '240', placeholder: 'Uma linha sobre o que você faz', style: 'flex:1 1 100%' });
  const contato = h('input', { type: 'text', maxlength: '160', placeholder: 'Contato pra te responder (e-mail, @, Discord)', style: 'flex:1 1 240px' });

  const semIa = h('input', { type: 'checkbox' });
  const fotos = h('input', { type: 'file', accept: 'image/jpeg,image/png,image/webp,image/gif', multiple: '' });
  const proc  = h('input', { type: 'file' });

  const diz     = h('p', { cls: 'd', style: 'margin:8px 0 0' });
  const mandar  = h('button', { cls: 'bt principal', type: 'button', txt: 'Mandar inscrição' });

  mandar.onclick = async () => {
    const fs = fotos.files ? Array.prototype.slice.call(fotos.files) : [];
    if (!nome.value.trim()) { diz.textContent = 'Falta o seu nome.'; return; }
    if (!fs.length) { diz.textContent = 'Escolha pelo menos uma imagem.'; return; }
    if (fs.length > 5) { diz.textContent = 'No máximo 5 imagens.'; return; }
    if (fs.some((f) => f.size > 4194304)) { diz.textContent = 'Cada imagem pode ter no máximo 4 MB.'; return; }

    const pf = proc.files && proc.files[0];
    if (semIa.checked && !pf) { diz.textContent = 'Pro selo, mande também o arquivo de processo.'; return; }
    if (pf && pf.size > 16777216) { diz.textContent = 'O arquivo de processo pode ter no máximo 16 MB.'; return; }

    const fd = new FormData();
    fd.append('nome', nome.value);
    fd.append('arroba', arroba.value);
    fd.append('link', link.value);
    fd.append('bio', bio.value);
    fd.append('contato', contato.value);
    if (semIa.checked) fd.append('sem_ia', '1');
    fs.forEach((f) => fd.append('obras[]', f));
    if (pf) fd.append('processo', pf);

    mandar.disabled = true;
    diz.textContent = 'Mandando…';
    try {
      /* Sem Content-Type na mão: o boundary do multipart é o navegador que
         escreve. */
      /* Com conta, a chave vai junto: é o que amarra a inscrição ao
         perfil e faz o selo aparecer no feed depois de aprovada. */
      const r = await fetch(API + '/artistas.php', { method: 'POST', body: fd,
        headers: chave ? { 'X-Chave': chave } : {} });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.erro || 'não deu');
      diz.textContent = 'Inscrição recebida. A resposta vai pelo contato que você deixou.';
      diz.style.color = 'var(--verde-forte)';
      [nome, arroba, link, bio, contato].forEach((i) => { i.value = ''; });
      fotos.value = ''; proc.value = ''; semIa.checked = false;
    } catch (e) {
      diz.textContent = e.message;
      diz.style.color = 'var(--perigo)';
    }
    mandar.disabled = false;
  };

  return h('div', { cls: 'fatia' }, [
    h('h3', { txt: 'Quero aparecer aqui' }),
    h('p', { cls: 'd', txt: 'Até 5 imagens. Nada entra no site antes de alguém olhar.' }),
    h('div', { cls: 'campo' }, [nome, arroba]),
    h('div', { cls: 'campo' }, [link, contato]),
    h('div', { cls: 'campo' }, [bio]),
    h('div', { cls: 'campo' }, [h('label', { txt: 'Imagens' }), fotos]),
    h('label', { style: 'display:flex;align-items:flex-start;gap:8px;font-size:13px;margin:10px 0 4px' },
      [semIa, document.createTextNode('Isto é arte minha, feita à mão, sem imagem gerada por IA.')]),
    h('div', { cls: 'campo' }, [
      h('label', { txt: 'Processo' }), proc,
      h('span', { cls: 'd', style: 'font-size:11.5px', txt: 'rascunho, PSD ou gravação de tela — só quem modera vê' }),
    ]),
    h('div', { cls: 'campo' }, [mandar]),
    diz,
  ]);
}

/* ---------------- moderação dos artistas ---------------- */

function blocoArtistas() {
  const cx = h('div', { cls: 'fatia' }, [
    h('h3', { txt: 'Artistas' }),
    h('p', { cls: 'd', txt: 'O selo é a sua palavra: abra o processo, olhe, e só então aprove com selo.' }),
  ]);

  const corpo = h('div');
  cx.appendChild(corpo);

  const carregaAr = () => {
    corpo.innerHTML = '<p class="d">vendo…</p>';

    api('/artistas.php', { method: 'POST', body: JSON.stringify({ acao: 'lista' }) }).then((d) => {
      corpo.innerHTML = '';
      const as = d.artistas || [];
      if (!as.length) return corpo.appendChild(h('p', { cls: 'd', txt: 'Nenhuma inscrição ainda.' }));

      as.forEach((a) => {
        const manda = async (acao, extra) => {
          try {
            await api('/artistas.php', { method: 'POST',
              body: JSON.stringify(Object.assign({ acao, id: a.id }, extra || {})) });
            carregaAr();
          } catch (e) { recado(e.message, 'ruim'); }
        };

        const obras = (a.obras || []).filter((o) => !o.processo);
        const tiras = h('div', { cls: 'arte-tiras', style: 'padding:0 0 8px' });
        obras.forEach((o) => {
          const b = h('button', { type: 'button', style: 'width:64px;height:52px',
            title: o.titulo || 'abrir' }, [h('img', { src: urlObra(o), loading: 'lazy', alt: '' })]);
          b.onclick = () => window.open(urlObra(o), '_blank', 'noopener');
          tiras.appendChild(b);
        });

        const acoes = h('div', { cls: 'campo', style: 'gap:6px;flex-wrap:wrap' });

        const processo = (a.obras || []).filter((o) => o.processo)[0];
        if (processo) {
          const vp = h('button', { cls: 'bt mini', type: 'button', txt: 'Abrir o processo' });
          vp.onclick = () => window.open(urlObra(processo), '_blank', 'noopener');
          acoes.appendChild(vp);
        } else {
          acoes.appendChild(h('span', { cls: 'd', style: 'font-size:11.5px', txt: 'sem processo' }));
        }

        if (a.estado !== 'aprovado' || !a.sem_ia) {
          const ok1 = h('button', { cls: 'bt mini', type: 'button', txt: 'Aprovar com selo' });
          ok1.onclick = () => manda('aprovar', { sem_ia: 1 });
          acoes.appendChild(ok1);
        }
        if (a.estado !== 'aprovado' || a.sem_ia) {
          const ok2 = h('button', { cls: 'bt mini', type: 'button', txt: 'Aprovar sem selo' });
          ok2.onclick = () => manda('aprovar', { sem_ia: 0 });
          acoes.appendChild(ok2);
        }
        if (a.estado !== 'recusado') {
          const nao = h('button', { cls: 'bt mini', type: 'button', txt: 'Recusar' });
          nao.onclick = () => {
            if (confirm('Recusar ' + a.nome + '? As imagens vão pro lixo, o cadastro fica.')) manda('recusar');
          };
          acoes.appendChild(nao);
        }
        const del = h('button', { cls: 'bt mini perigo', type: 'button', txt: '×' });
        del.onclick = () => { if (confirm('Apagar ' + a.nome + ' de vez?')) manda('apagar'); };
        acoes.appendChild(del);

        const url = linkSeguro(a.link);
        const ficha = h('p', { cls: 'd', txt: a.estado
          + (a.sem_ia ? '  ·  com selo' : '')
          + (a.arroba ? '  ·  @' + a.arroba : '')
          + (a.contato ? '  ·  ' + a.contato : '') });

        const dentro = [h('b', { txt: a.nome }), ficha];
        if (a.bio) dentro.push(h('p', { cls: 'd', txt: a.bio }));
        if (url) dentro.push(h('p', {}, [h('a', { href: url, target: '_blank',
          rel: 'noopener noreferrer nofollow', txt: url })]));
        dentro.push(tiras, acoes);

        corpo.appendChild(h('div', { style: 'border-top:1px solid var(--linha);padding-top:12px;margin-top:12px' }, dentro));
      });
    }).catch((e) => {
      corpo.innerHTML = '';
      corpo.appendChild(h('p', { cls: 'd', txt: 'Não deu: ' + e.message }));
    });
  };

  carregaAr();
  return cx;
}

/* ---------------- navegação ---------------- */
function vaiPara(hash) { if (location.hash === hash) rota(); else location.hash = hash; }

function rota() {
  recado('');
  document.body.classList.remove('na-vitrine');
  pintaCaminho();

  const info = nomeDaTela(location.hash);
  if (info) guardaVisita(location.hash, info[2] || info[1]);
  /* Tela nova, textos novos: sem remarcar, o modo de edição continuaria
     ligado mas sem nada pra clicar. */
  if (typeof modoEdicao !== 'undefined' && modoEdicao) setTimeout(marcaEditaveis, 60);
  const btVolta = el('abaMeusOverlays');
  if (btVolta) btVolta.style.display = 'none';
  const p = (location.hash || '#/overlays').replace(/^#\//, '').split('/');
  if (p[0] === 'inicio') return telaInicio();
  if (p[0] === 'meu') return telaControlador();
  if (p[0] === 'comandos') return telaComandos();
  if (p[0] === 'tutorial') return telaTutorial();
  if (p[0] === 'admin') return telaAdmin();
  if (p[0] === 'artistas') return telaArtistas();
  if (p[0] === 'luzes') return telaLuzes();
  if (p[0] === 'subathon') return telaSubathon();
  if (p[0] === 'mods') return telaMods();
  if (p[0] === 'novo' && TIPOS[p[1]]) return telaEditor(null, p[1]);
  if (p[0] === 'editar') {
    const perfil = perfis.find((x) => String(x.id) === String(p[1]));
    if (perfil) return telaEditor(perfil, null);
    return telaLista(null);
  }
  telaLista(TIPOS[p[1]] ? p[1] : null);
}
window.addEventListener('hashchange', rota);
/* A marca leva pra vitrine, não pra lista. Quem clica no nome do site espera
   a porta de entrada — a lista já tem aba própria. */
el('irInicio').onclick = () => vaiPara('#/inicio');
el('abaMeu').onclick = () => { fechaBandejas(null); vaiPara('#/meu'); };
el('abaArtistas').onclick = () => { fechaBandejas(null); vaiPara('#/artistas'); };
el('abaMeusOverlays').onclick = () => { fechaBandejas(null); vaiPara('#/overlays'); };

/* De qual conta é esta tela, e se a lista nela é a de verdade. */
let quemSou = '';
let souAdmin = false;
let listaVelha = false;
let erroCarga = null;

function pintaQuemSou() {
  const c = el('quemSou');
  if (!c) return;
  c.textContent = quemSou ? '@' + quemSou : '';
  c.title = quemSou ? 'Esta tela está no painel da conta @' + quemSou : '';
}

async function carrega() {
  let ultimoErro = null;

  /* TRÊS TENTATIVAS ANTES DE DESISTIR.

     Quase toda falha aqui é um soluço de rede de um segundo. Desistir na
     primeira transforma isso numa tela de erro no meio da live, por nada. */
  for (let tentativa = 0; tentativa < 3; tentativa++) {
    try {
      const d = await api('/perfil.php');
      perfis = d.perfis || [];
      quemSou = d.login || '';
      souAdmin = !!d.admin;
      listaVelha = false;
      erroCarga = null;
      guardaListaLocal(perfis);
      pintaQuemSou();
      el('semChave').classList.add('escondido');
      return true;
    } catch (e) {
      ultimoErro = e;
      if (e.status === 401 || e.status === 403) break;
      if (tentativa < 2) await new Promise((ok) => setTimeout(ok, 700 * (tentativa + 1)));
    }
  }

  {
    const e = ultimoErro;
    /* CHAVE VELHA NÃO É LISTA VAZIA.

       Entrar de novo na Twitch gera uma chave nova — a antiga é guardada com
       hash e não dá pra devolver. Quem abrisse o site por um link salvo com a
       chave antiga levava 401 aqui, e a tela mostrava "nenhum overlay ainda".
       Ou seja: a pessoa via os overlays dela sumirem sem ter perdido nada.

       Nada foi apagado nesse caso, e a tela precisa dizer isso. */
    if (e.status === 401 || e.status === 403) {
      esqueceChave();
      const cx = el('semChave');
      const p2 = cx.querySelector('p');
      if (p2) p2.textContent = 'Esta chave não vale mais — ela troca quando você entra de novo na Twitch. '
        + 'Nada foi apagado: seus overlays continuam no lugar e os que já estão no OBS continuam funcionando. '
        + 'Entre de novo pra pegar a chave nova.';
      cx.classList.remove('escondido');
      el('tela').innerHTML = '';
      return false;
    }
    /* Falha que NÃO é de chave não pode apagar a tela: um soluço do servidor
        deixaria a pessoa olhando pra nada, sem nem saber o que houve. Avisa e
        segue com a lista vazia, que é recuperável. */
    /* FALHA DE LEITURA NÃO É LISTA VAZIA.

       Este era o buraco. Toda falha que não fosse de chave caía aqui, a
       lista continuava vazia e a tela desenhava "Nenhum overlay ainda" — a
       mesma frase de quem nunca criou nada. Agora a tela sabe que a lista é
       velha, diz isso, e mostra os overlays que dá pra mostrar. */
    erroCarga = e;
    listaVelha = true;
    perfis = leListaLocal();
    recado(e.message, 'ruim');
    return true;
  }
}

(async function () {
  montaBandejas();
  observaTextos();
  carregaTextos();
  carregaEstilo();

  /* SEM CHAVE NÃO É ERRO: É VISITANTE.

     Antes, quem chegava pela primeira vez via só "Falta a chave" — uma tela
     que dá a entender que algo quebrou, pra quem nem sabe o que é chave. Um
     visitante merece ver o que o site faz antes de entrar. A caixa de chave
     continua existindo pro outro caso, que é a chave TER existido e não valer
     mais. */
  if (!chave) {
    /* As abas do painel não servem pra quem não entrou: clicar em qualquer
       uma delas só levaria a uma tela que falha. Some com elas e o que resta
       é a vitrine e o botão de entrar. */
    ['abaOverlays', 'abaFerramentas', 'abaMeu', 'busca'].forEach((id) => {
      const a = el(id);
      if (a) a.classList.add('escondido');
    });
    /* A galeria não pede conta: quem chega por um link de artista tem que
       cair nela, e não na vitrine. */
    if (location.hash === '#/artistas') rota(); else telaInicio();
    return;
  }

  if (!await carrega()) return;
  if (souAdmin) el('abaTextos').classList.remove('escondido');
  ligaBusca();
  ligaUpgrade();
  rota();
})();
</script>
