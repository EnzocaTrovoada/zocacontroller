/* ---------------- fábrica de controles ---------------- */
/* Cada controle guarda como se REDESENHAR a partir da config. Sem isso o
   desfazer teria que remontar a tela inteira, e a pessoa perderia o grupo
   que estava aberto e o lugar onde estava rolando. */
const FABRICA = {
  texto(it) {
    const i = h('input', { type: 'text' });
    i.value = cfg[it.k] || '';
    i.oninput = () => mudou(it.k, i.value);
    i.__sincroniza = () => { i.value = cfg[it.k] || ''; };
    return i;
  },
  num(it) {
    const i = h('input', { type: 'number' });
    i.value = cfg[it.k] || 0;
    i.oninput = () => mudou(it.k, parseInt(i.value, 10) || 0);
    i.__sincroniza = () => { i.value = cfg[it.k] || 0; };
    return i;
  },
  cor(it) {
    const i = h('input', { type: 'color' });
    i.value = cfg[it.k] || '#ffffff';
    i.oninput = () => mudou(it.k, i.value);
    i.__sincroniza = () => { i.value = cfg[it.k] || '#ffffff'; };
    return i;
  },
  chave(it) {
    const i = h('input', { type: 'checkbox' });
    i.checked = !!cfg[it.k];
    i.onchange = () => mudou(it.k, i.checked ? 1 : 0);
    const cx = h('span', { cls: 'chave' }, [i, h('span')]);
    cx.__sincroniza = () => { i.checked = !!cfg[it.k]; };
    cx.__marcavel = true;   /* a linha inteira vira área de clique */
    return cx;
  },
  lista(it) {
    const s = h('select');
    (it.ops || []).forEach(([v, t]) => {
      const o = h('option', { value: v, txt: t });
      if (String(cfg[it.k]) === String(v)) o.selected = true;
      s.appendChild(o);
    });
    s.onchange = () => mudou(it.k, s.value);
    s.__sincroniza = () => { s.value = String(cfg[it.k]); };
    return s;
  },
  /* A BANDEJA MOSTRA A LETRA, NÃO SÓ O NOME: "Michroma", "Teko", "Doto"
     não dizem nada pra quem não é de design — e o usuário tinha que
     escolher no escuro, aplicar, olhar a prévia e voltar. */
  fontes(it) {
    Relogio.carregaTodasAsFontes(document);

    const s = h('select', { cls: 'selFonte' });
    const grupos = {};
    (Relogio.FONTS || []).forEach((f) => {
      const nome = typeof f === 'string' ? f : (f.n || f.nome || f.f);
      const g = (typeof f === 'object' && f.g) ? f.g : 'Outras';
      if (!grupos[g]) {
        grupos[g] = h('optgroup');
        grupos[g].label = g;
        s.appendChild(grupos[g]);
      }
      const o = h('option', { value: nome, txt: nome });
      /* Cada opção escrita na própria fonte. O Chrome no Windows respeita
         font-family em <option>; onde não respeitar, a amostra de baixo
         continua mostrando a letra — por isso as duas coisas existem. */
      o.style.fontFamily = Relogio.familiaDe(nome);
      o.style.fontSize = '15px';
      if (cfg[it.k] === nome) o.selected = true;
      grupos[g].appendChild(o);
    });

    const amostra = h('div', { cls: 'amostraFonte' });
    const pinta = () => {
      const nome = String(cfg[it.k] || '');
      amostra.style.fontFamily = Relogio.familiaDe(nome);
      /* Números e letras juntos: num relógio o que importa é o algarismo, e
         tem fonte bonita de letra e horrível de número. */
      amostra.textContent = 'AaBbCc 012 12:34:56';
      amostra.title = nome;
      Relogio.carregaFonte(document, nome);   /* garante os pesos reais */
    };
    pinta();

    s.onchange = () => { mudou(it.k, s.value); pinta(); };
    const cx = h('div', { cls: 'campoFonte' }, [s, amostra]);
    cx.__sincroniza = () => { s.value = String(cfg[it.k]); pinta(); };
    return cx;
  },
  /* O SOM DO ALERTA: Um controle só em vez de dois: a pergunta da pessoa
     é "qual som toca", não "som pronto ou som meu". */
  som(it) {
    const sel = h('select');
    const linha = h('div', { cls: 'campo', style: 'margin:6px 0 0;gap:6px' });
    const aviso = h('p', { cls: 'd', style: 'margin:4px 0 0' });

    const PRONTOS_SOM = [
      ['sino', 'Sino'], ['moeda', 'Moeda'],
      ['fanfarra', 'Fanfarra'], ['sopro', 'Sopro'], ['nenhum', 'Nenhum'],
    ];
    let meus = [];

    const valorAtual = () => (cfg.asom === 'proprio' ? 'meu:' + cfg.asomid : cfg.asom);

    function pinta() {
      const antes = valorAtual();
      sel.innerHTML = '';
      const gP = h('optgroup'); gP.label = 'Prontos';
      PRONTOS_SOM.forEach(([v, r]) => gP.appendChild(h('option', { value: v, txt: r })));
      sel.appendChild(gP);

      if (meus.length) {
        const gM = h('optgroup'); gM.label = 'Seus';
        meus.forEach((s) => gM.appendChild(h('option', { value: 'meu:' + s.id, txt: s.nome })));
        sel.appendChild(gM);
      }
      sel.value = antes;
      /* O som escolhido foi apagado: não finge que ainda está lá. */
      if (!sel.value) { sel.value = 'sino'; aplicaEscolha(); }
      pintaBotoes();
    }

    function aplicaEscolha() {
      const v = sel.value;
      if (v.indexOf('meu:') === 0) {
        cfg.asomid = parseInt(v.slice(4), 10) || 0;
        mudou('asom', 'proprio');
      } else {
        cfg.asomid = 0;
        mudou('asom', v);
      }
      pintaBotoes();
    }
    sel.onchange = aplicaEscolha;

    function pintaBotoes() {
      linha.innerHTML = '';
      const ehMeu = sel.value.indexOf('meu:') === 0;

      const ouvir = h('button', { cls: 'bt mini', type: 'button', txt: 'Ouvir' });
      ouvir.onclick = () => {
        /* Toca na prévia, que é onde a pessoa está olhando. O de fábrica o
           próprio desenhista faz; o seu é um arquivo, e o arquivo só existe
           depois de salvar — por isso o aviso. */
        const q = quadro && quadro.contentWindow;
        if (q) try { q.postMessage({ type: 'zc:ouvir' }, location.origin); } catch (e) {}
      };
      linha.appendChild(ouvir);

      const mandar = h('button', { cls: 'bt mini', type: 'button', txt: 'Mandar um som meu' });
      mandar.onclick = () => arquivo.click();
      linha.appendChild(mandar);

      if (ehMeu) {
        const apagar = h('button', { cls: 'bt mini perigo', type: 'button', txt: 'Apagar este' });
        apagar.onclick = async () => {
          const id = parseInt(sel.value.slice(4), 10);
          try {
            const r = await api('/som.php', { method: 'POST', body: JSON.stringify({ acao: 'apagar', id }) });
            meus = r.sons || [];
            sel.value = 'sino'; aplicaEscolha(); pinta();
            recado('Som apagado.', 'bom');
          } catch (e) { recado(e.message, 'ruim'); }
        };
        linha.appendChild(apagar);
      }

      aviso.textContent = ehMeu
        ? 'O som seu só toca no OBS depois que você salvar o overlay.'
        : 'Os prontos são feitos na hora pelo navegador — não têm arquivo pra falhar.';
    }

    /* O input de arquivo fica escondido: "Escolher arquivo / Nenhum arquivo
       selecionado" em inglês do navegador não combina com o resto da tela. */
    const arquivo = h('input', { type: 'file', accept: 'audio/*', style: 'display:none' });
    arquivo.onchange = async () => {
      const f = arquivo.files && arquivo.files[0];
      arquivo.value = '';
      if (!f) return;
      if (f.size > 1048576) {
        return recado('Esse arquivo tem ' + Math.round(f.size / 1024) + ' KB. O limite é 1 MB — alerta é um toque curto.', 'ruim');
      }
      recado('Mandando…');
      try {
        const fd = new FormData();
        fd.append('som', f);
        fd.append('nome', (f.name || 'som').replace(/\.[^.]+$/, ''));
        /* Sem Content-Type na mão: o navegador precisa pôr o boundary do
           multipart, e escrever o cabeçalho aqui quebraria isso. */
        const r = await fetch(API + '/som.php', { method: 'POST', headers: { 'X-Chave': chave }, body: fd });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.erro || 'não deu');
        meus = d.sons || [];
        const novo = meus[meus.length - 1];
        if (novo) { cfg.asomid = novo.id; mudou('asom', 'proprio'); }
        pinta();
        recado('Som guardado. Salve o overlay pra ele valer na live.', 'bom');
      } catch (e) { recado(e.message, 'ruim'); }
    };

    api('/som.php').then((d) => { meus = d.sons || []; pinta(); }).catch(() => pinta());
    pinta();

    const cx = h('div', { style: 'flex:1 1 100%;min-width:0' }, [sel, linha, aviso, arquivo]);
    cx.__sincroniza = () => pinta();
    return cx;
  },

  /* OS BOTÕES DE TESTE: Não guardam nada na config: são a prévia
     obedecendo, e só. */
  testar() {
    let repetindo = 0;
    let travado = false;

    const manda = (msg) => {
      const q = quadro && quadro.contentWindow;
      if (q) try { q.postMessage(msg, location.origin); } catch (e) {}
    };

    const bRepetir = h('button', { cls: 'bt mini', type: 'button', txt: 'Mostrar de novo' });
    bRepetir.onclick = () => manda({ type: 'zc:repetir' });

    const bLoop = h('button', { cls: 'bt mini', type: 'button', txt: 'Repetir sem parar' });
    const paraLoop = () => {
      clearInterval(repetindo); repetindo = 0;
      bLoop.textContent = 'Repetir sem parar';
      bLoop.classList.remove('perigo');
    };
    bLoop.onclick = () => {
      if (repetindo) return paraLoop();
      if (travado) bTravar.onclick();          /* travado e repetindo se anulam */

      const roda = () => {
        manda({ type: 'zc:repetir' });
        /* O intervalo sai da config a cada volta, e não uma vez só: enquanto
           a pessoa arrasta "demora pra aparecer", o ciclo tem que acompanhar
           — senão ela mexe no controle e o que vê na tela é o ritmo antigo. */
        const ciclo = (cfg.manim === 'surge' ? 900 : (cfg.mabrir || 900) + (cfg.mfechar || 1400))
                    + (cfg.mtempo || 7) * 1000 + 400;
        clearInterval(repetindo);
        repetindo = setInterval(roda, ciclo);
      };
      roda();
      bLoop.textContent = 'Parar de repetir';
      bLoop.classList.add('perigo');
    };

    const bTravar = h('button', { cls: 'bt mini', type: 'button', txt: 'Travar na tela' });
    bTravar.onclick = () => {
      travado = !travado;
      if (travado && repetindo) paraLoop();
      manda({ type: 'zc:travar', on: travado });
      bTravar.textContent = travado ? 'Destravar' : 'Travar na tela';
      bTravar.classList.toggle('perigo', travado);
    };

    const cx = h('div', { style: 'flex:1 1 100%;min-width:0' }, [
      h('div', { cls: 'campo', style: 'margin:0;gap:6px' }, [bRepetir, bLoop, bTravar]),
      h('p', { cls: 'd', style: 'margin:4px 0 0',
               txt: 'Isto vale só aqui na prévia. Nada disso vai pro OBS nem fica salvo.' }),
    ]);
    /* Ao desfazer/refazer a tela se remonta e o loop morre junto; o botão
       precisa voltar a dizer a verdade. */
    cx.__sincroniza = () => { if (!repetindo) paraLoop(); };
    return cx;
  },

  faixa(it) {
    const i = h('input', { type: 'range' });
    i.min = it.min; i.max = it.max; i.step = it.passo || 1;
    i.value = cfg[it.k];
    /* A unidade pode ser função pra concordar com o número: "1 real" e
       "2 reais". Texto errado em português é o tipo de coisa que faz o
       produto parecer amador mesmo quando o resto está certo. */
    const un = (n) => (typeof it.u === 'function' ? it.u(n) : (it.u || ''));
    const v = h('span', { cls: 'valor', txt: cfg[it.k] + un(cfg[it.k]) });
    i.oninput = () => { v.textContent = i.value + un(parseInt(i.value, 10)); mudou(it.k, parseInt(i.value, 10)); };
    const cx = h('span', { cls: 'campo', style: 'margin:0;gap:8px' }, [i, v]);
    cx.__sincroniza = () => { i.value = cfg[it.k]; v.textContent = cfg[it.k] + un(cfg[it.k]); };
    return cx;
  },
  /* Pausado guarda quanto FALTA; correndo guarda QUANDO acaba. São contas
     diferentes, e somar no campo errado faria o tempo sumir. */
  /* PAUSAR TEM QUE CONGELAR O TEMPO, NÃO SÓ O RÓTULO.

     Era uma lista comum: trocar pra "Pausado" mudava só a palavra. O
     cronômetro guarda duas coisas diferentes — correndo guarda QUANDO acaba,
     pausado guarda QUANTO FALTA — e sem converter uma na outra na hora da
     troca, o "quando acaba" seguia no lugar. Na volta, o tempo que passou
     durante a pausa tinha sumido: pra quem transmite, o relógio continuou
     correndo escondido. */
  /* O QUE CADA PLATAFORMA SABE RESPONDER.

     Não é escolha de produto, é o que a API oficial de cada uma expõe hoje.
     O Kick não tem contagem de seguidores em endpoint nenhum, e o YouTube não
     tem "seguidor" nem espectador por aqui. Oferecer o que vai falhar seria
     empurrar o usuário pra um overlay que nunca enche. */
  fontemeta(it) {
    const POR_PLATAFORMA = {
      twitch:  [['seguidores', 'Seguidores'], ['subs', 'Subs'], ['viewers', 'Gente assistindo']],
      youtube: [['subs', 'Inscritos']],
      kick:    [['subs', 'Assinantes'], ['viewers', 'Gente assistindo']],
    };
    const s = h('select');

    const pinta = () => {
      const ops = (POR_PLATAFORMA[cfg.plataforma] || POR_PLATAFORMA.twitch).slice();
      ops.push(['manual', 'Eu digito']);
      s.innerHTML = '';
      ops.forEach(([v, r]) => {
        const o = h('option', { value: v, txt: r });
        if (cfg[it.k] === v) o.selected = true;
        s.appendChild(o);
      });
      /* A fonte antiga pode não existir na plataforma nova — cair no
         silêncio deixaria a meta apontando pra um número que ninguém
         responde.

         Escreve no cfg direto em vez de chamar mudou(): esta função roda
         DENTRO do ciclo de redesenho, e mudou() dispara outro ciclo por
         dentro dele. O valor se perdia nessa reentrada. */
      /* Comparar com a LISTA, e não com s.value: um select sem opção
         correspondente não fica vazio — o navegador escolhe a primeira
         sozinho, então s.value nunca denunciava a troca. */
      if (!ops.some(([v2]) => v2 === cfg[it.k])) cfg[it.k] = s.value;
    };
    pinta();

    s.onchange = () => mudou(it.k, s.value);
    s.__sincroniza = pinta;
    /* O __sincroniza sozinho não basta: ele só roda no desfazer. Quem é
       chamado a cada mudança é o redesenhar — e esta lista PRECISA mudar
       quando a plataforma muda, senão ela continua oferecendo seguidores
       num Kick que não conta seguidores. */
    redesenhar.push(pinta);
    return s;
  },

  /* ------------------------------------------------------------------ *
   *  Os trechos da run
   * ------------------------------------------------------------------ */

  /* Um trecho é { n: nome, p: tempo do recorde, b: melhor parcial }. Aqui só
     se edita o NOME e a ordem: p e b são medidos correndo, não digitados.
     Deixar a pessoa digitar o próprio recorde seria abrir a porta pra uma
     comparação que não corresponde a corrida nenhuma. */
  trechos(it) {
    const caixa = h('div', { cls: 'trechos' });

    const grava = (lista) => mudou(it.k, lista);

    const pinta = () => {
      const lista = Array.isArray(cfg[it.k]) ? cfg[it.k] : [];
      caixa.innerHTML = '';

      lista.forEach((tr, i) => {
        const nome = h('input', { type: 'text', value: tr.n || '', placeholder: 'Nome do trecho' });
        nome.oninput = () => {
          const l = cfg[it.k].slice();
          l[i] = Object.assign({}, l[i], { n: nome.value.slice(0, 40) });
          /* Escrevo direto e mando salvar: passar por mudou() aqui
             redesenharia o campo embaixo do dedo e perderia o cursor. */
          cfg[it.k] = l;
          manda();
        };

        const sobe = h('button', { cls: 'bt mini', type: 'button', txt: '↑', title: 'Subir' });
        sobe.disabled = i === 0;
        sobe.onclick = () => {
          const l = cfg[it.k].slice();
          const x = l[i - 1]; l[i - 1] = l[i]; l[i] = x;
          grava(l);
        };

        const desce = h('button', { cls: 'bt mini', type: 'button', txt: '↓', title: 'Descer' });
        desce.disabled = i === lista.length - 1;
        desce.onclick = () => {
          const l = cfg[it.k].slice();
          const x = l[i + 1]; l[i + 1] = l[i]; l[i] = x;
          grava(l);
        };

        const fora = h('button', { cls: 'bt mini perigo', type: 'button', txt: '×', title: 'Tirar' });
        fora.onclick = () => {
          if (!confirm('Tirar "' + (tr.n || 'este trecho') + '"? O recorde dele vai junto.')) return;
          const l = cfg[it.k].slice();
          l.splice(i, 1);
          grava(l);
        };

        const marca = h('span', { cls: 'trecho-t', txt:
          tr.p != null ? Speedrun.tempo(tr.p, false) : '—' });

        caixa.appendChild(h('div', { cls: 'trecho' }, [
          h('span', { cls: 'trecho-n', txt: String(i + 1) }),
          nome, marca, sobe, desce, fora,
        ]));
      });

      const mais = h('button', { cls: 'bt mini', type: 'button', txt: '+ Adicionar trecho' });
      mais.onclick = () => {
        const l = (Array.isArray(cfg[it.k]) ? cfg[it.k] : []).slice();
        if (l.length >= 40) return recado('Quarenta trechos já é bastante.', 'ruim');
        l.push({ n: '', p: null, b: null });
        grava(l);
      };
      caixa.appendChild(mais);
    };

    redesenhar.push(pinta);
    pinta();
    return caixa;
  },

  /* ------------------------------------------------------------------ *
   *  Os botões da corrida
   * ------------------------------------------------------------------ */

  /* NÃO EXISTE TECLA GLOBAL AQUI, E ISSO PRECISA FICAR CLARO.

     O LiveSplit é um programa do Windows e consegue ouvir a tecla com o jogo
     em primeiro plano. Uma página não consegue: só recebe tecla quando ELA
     está em foco. Por isso os atalhos abaixo valem com esta aba na frente, e
     quem joga em tela cheia usa o !split pelo chat. */
  corrida(it) {
    const visor = h('b', { cls: 'valor', style: 'width:auto;font:600 18px var(--mono);color:var(--tinta)' });
    const passo = h('p', { cls: 'd', style: 'margin:2px 0 8px;flex:1 1 100%' });
    const linha = h('div', { cls: 'tempoBotoes' });

    const agora = () => Math.round(Relogio.agoraServidor());
    const cor = () => cfg[it.k] || { e: 'parado', i: 0, pa: 0, s: [] };
    const trechos = () => (Array.isArray(cfg.sptre) ? cfg.sptre : []);

    const grava = (novo) => mudou(it.k, novo);

    /* Fecha a corrida: guarda os melhores parciais sempre, e o recorde só se
       o tempo final tiver sido melhor. São duas coisas diferentes — um trecho
       recorde dentro de uma run ruim continua sendo um trecho recorde. */
    const fecha = (c) => {
      const tre = trechos().slice();
      let melhorou = false;

      for (let i = 0; i < tre.length && i < c.s.length; i++) {
        const seg = c.s[i] - (i > 0 ? c.s[i - 1] : 0);
        if (tre[i].b == null || seg < tre[i].b) {
          tre[i] = Object.assign({}, tre[i], { b: seg });
        }
      }

      const finalAgora = c.s[c.s.length - 1];
      const finalAntes = tre.length ? tre[tre.length - 1].p : null;
      if (c.s.length === tre.length && (finalAntes == null || finalAgora < finalAntes)) {
        for (let i = 0; i < tre.length; i++) tre[i] = Object.assign({}, tre[i], { p: c.s[i] });
        melhorou = true;
      }

      cfg.sptre = tre;
      return melhorou;
    };

    const acoes = {
      iniciar: () => grava({ e: 'correndo', i: agora(), pa: 0, s: [] }),

      split: () => {
        const c = cor();
        if (c.e !== 'correndo') return;
        const s = (c.s || []).slice();
        s.push(agora() - c.i);

        if (s.length >= trechos().length && trechos().length > 0) {
          const fim = { e: 'fim', i: 0, pa: s[s.length - 1], s: s };
          const melhorou = fecha(fim);
          grava(fim);
          recado(melhorou ? 'Recorde novo! ' + Speedrun.tempo(fim.pa, true) : 'Run fechada em ' + Speedrun.tempo(fim.pa, true), melhorou ? 'bom' : '');
          return;
        }
        grava({ e: 'correndo', i: c.i, pa: 0, s: s });
      },

      desfazer: () => {
        const c = cor();
        if (!c.s || !c.s.length) return;
        const s = c.s.slice();
        s.pop();
        /* Desfazer depois do fim volta a correr: o relógio precisa continuar
           de onde estava, e não do zero. */
        if (c.e === 'fim') grava({ e: 'correndo', i: agora() - c.pa, pa: 0, s: s });
        else grava({ e: c.e, i: c.i, pa: c.pa, s: s });
      },

      pausar: () => {
        const c = cor();
        if (c.e === 'correndo') grava({ e: 'pausado', i: 0, pa: agora() - c.i, s: c.s || [] });
        else if (c.e === 'pausado') grava({ e: 'correndo', i: agora() - (c.pa || 0), pa: 0, s: c.s || [] });
      },

      zerar: () => {
        if (!confirm('Zerar a corrida? Os recordes ficam; só o tempo de agora volta a zero.')) return;
        grava({ e: 'parado', i: 0, pa: 0, s: [] });
      },
    };

    [['Iniciar', 'iniciar'], ['Split', 'split'], ['Desfazer', 'desfazer'],
     ['Pausar', 'pausar'], ['Zerar', 'zerar']].forEach(([txt, acao]) => {
      const b = h('button', { cls: 'bt mini', type: 'button', txt });
      b.dataset.acao = acao;
      b.onclick = () => acoes[acao]();
      linha.appendChild(b);
    });

    const pinta = () => {
      const c = cor();
      const ms = c.e === 'correndo' ? agora() - c.i : (c.pa || 0);
      visor.textContent = Speedrun.tempo(ms, true);

      const n = trechos().length;
      const feitos = (c.s || []).length;
      const nomes = { parado: 'parada', correndo: 'correndo', pausado: 'pausada', fim: 'terminada' };
      passo.textContent = n === 0
        ? 'Adicione os trechos aí embaixo antes de começar.'
        : 'Corrida ' + (nomes[c.e] || c.e) + ' — trecho ' + Math.min(feitos + 1, n) + ' de ' + n + '.';

      linha.querySelector('[data-acao="pausar"]').textContent = c.e === 'pausado' ? 'Continuar' : 'Pausar';
      linha.querySelector('[data-acao="iniciar"]').disabled = c.e === 'correndo' || c.e === 'pausado' || n === 0;
      linha.querySelector('[data-acao="split"]').disabled = c.e !== 'correndo';
      linha.querySelector('[data-acao="desfazer"]').disabled = !(c.s || []).length;
      linha.querySelector('[data-acao="pausar"]').disabled = c.e === 'parado' || c.e === 'fim';
    };

    /* O visor anda sozinho enquanto a corrida corre. Meio segundo é o
       bastante aqui: este número é conferência, o que a live vê é a overlay. */
    const tique = setInterval(() => { if (cor().e === 'correndo') pinta(); }, 500);
    window.addEventListener('hashchange', () => clearInterval(tique), { once: true });

    /* Atalhos, só com esta aba em foco e fora de campo de texto. */
    const tecla = (e) => {
      if (!document.body.contains(linha)) return;
      const alvo = e.target && e.target.tagName;
      if (alvo === 'INPUT' || alvo === 'TEXTAREA' || alvo === 'SELECT') return;
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); cor().e === 'correndo' ? acoes.split() : acoes.iniciar(); }
      else if (e.key === 'Backspace') { e.preventDefault(); acoes.desfazer(); }
      else if (e.key.toLowerCase() === 'p') acoes.pausar();
    };
    document.addEventListener('keydown', tecla);

    redesenhar.push(pinta);
    pinta();
    return h('div', {}, [visor, passo, linha,
      h('p', { cls: 'd', style: 'margin:6px 0 0;flex:1 1 100%', txt:
        'Com esta aba na frente: espaço ou Enter inicia e dá split, Backspace desfaz, P pausa. '
        + 'Jogando em tela cheia a página não recebe tecla nenhuma — aí é !split pelo chat.' })]);
  },

  pausa(it) {
    const s = h('select');
    [['pausado', 'Pausado'], ['rodando', 'Correndo']].forEach(([v2, r]) => {
      const o = h('option', { value: v2, txt: r });
      if (cfg[it.k] === v2) o.selected = true;
      s.appendChild(o);
    });

    const agora = () => Math.round(Relogio.agoraServidor() / 1000);

    s.onchange = () => {
      if (s.value === 'pausado') {
        cfg.restante = Math.max(0, (cfg.fim || 0) - agora());
      } else {
        cfg.fim = agora() + Math.max(0, cfg.restante || 0);
      }
      mudou(it.k, s.value);
    };
    s.__sincroniza = () => { s.value = String(cfg[it.k]); };
    return s;
  },

  tempo() {
    const visor = h('b', { cls: 'valor', style: 'width:auto;font:600 15px var(--disp);color:var(--tinta)' });
    const linha = h('div', { cls: 'tempoBotoes' });

    const agora = () => Math.round(Relogio.agoraServidor() / 1000);
    const falta = () => (cfg.modo === 'rodando' ? Math.max(0, cfg.fim - agora()) : cfg.restante);
    const pinta = () => { visor.textContent = Relogio.tempoHMS(falta(), true); };

    const poe = (seg) => {
      seg = Math.max(0, Math.min(2592000, Math.round(seg)));
      if (cfg.modo === 'rodando') mudou('fim', agora() + seg);
      else mudou('restante', seg);
      pinta();
    };
    [['-10 min', -600], ['-1 min', -60], ['+1 min', 60], ['+10 min', 600], ['+1 h', 3600], ['Zerar', null]]
      .forEach(([txt, d]) => {
        const b = h('button', { cls: 'bt mini', type: 'button', txt });
        b.onclick = () => {
          if (d === null) { if (confirm('Zerar o tempo?')) poe(0); }
          else poe(falta() + d);
        };
        linha.appendChild(b);
      });
    pinta();
    redesenhar.push(pinta);
    return h('div', {}, [visor, linha]);
  },
};

/* ---------------- Upgrade ---------------- */

/* O QUE O PRO DÁ, NA ORDEM EM QUE IMPORTA.

   Isto não é lista de marketing: cada linha corresponde a uma chave de
   recursos_do_plano() no servidor. Se as duas divergirem, a promessa aqui
   vira mentira lá — então mexeu numa, mexe na outra. */
const PRO_BENEFICIOS = [
  ['50 overlays em vez de 8',
   'dá pra montar cena de jogo, cena de conversa e cena de encerramento sem apagar nada'],
  ['Sem a marca do ZocaController na tela',
   'a live fica com a sua cara, não com a nossa'],
  ['Twitch, YouTube e Kick ao mesmo tempo',
   'a mesma meta contando de todas, sem montar overlay separado pra cada uma'],
  ['Todos os temas',
   'no grátis só os básicos'],
  ['Pokébot liberado',
   'o bot de captura funcionando no seu chat'],
];

function fechaPop() {
  const p = el('pop');
  if (p) p.remove();
  document.removeEventListener('keydown', popTecla);
}

function popTecla(e) { if (e.key === 'Escape') fechaPop(); }

function abrePro(estado) {
  fechaPop();

  const caixa = h('div', { cls: 'pop__caixa' });
  const fundo = h('div', { cls: 'pop', id: 'pop' }, [caixa]);

  /* Clicar fora fecha; clicar dentro não. Sem o segundo, arrastar pra
     selecionar um texto da caixa fecharia o popup no meio. */
  fundo.onclick = (e) => { if (e.target === fundo) fechaPop(); };
  document.addEventListener('keydown', popTecla);

  const x = h('button', { cls: 'pop__x', type: 'button', txt: '×', title: 'Fechar' });
  x.onclick = fechaPop;
  caixa.appendChild(x);

  caixa.appendChild(h('h2', { txt: 'ZocaController Pro' }));

  const ate = estado.valido_ate ? new Date(estado.valido_ate.replace(' ', 'T')) : null;
  caixa.appendChild(h('p', { cls: 'sub', txt: estado.plano === 'gratis'
    ? 'Você está no plano grátis. Veja o que muda.'
    : 'Você já é Pro' + (ate ? ', até ' + ate.toLocaleDateString('pt-BR') : '') + '. Pode renovar quando quiser.' }));

  const lista = h('ul', { cls: 'pop__lista' });
  PRO_BENEFICIOS.forEach(([titulo, detalhe]) => {
    lista.appendChild(h('li', {}, [
      h('span', { cls: 'pop__ok', txt: '✓' }),
      h('div', {}, [h('b', { txt: titulo }), h('small', { txt: detalhe })]),
    ]));
  });
  caixa.appendChild(lista);

  if (estado.modo === 'teste') {
    caixa.appendChild(h('p', { cls: 'aviso', txt:
      'MODO DE TESTE. Este checkout não move dinheiro e só aceita os cartões de teste '
      + 'do Mercado Pago. Ninguém além de você está vendo isto.' }));
  }

  /* ----- os planos, só depois do "Seja Pro" ----- */
  const planos = h('div', { cls: 'pop__planos escondido' });

  (estado.planos || []).forEach((pl) => {
    const reais = (pl.preco_centavos / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const porMes = pl.periodo === 'anual'
      ? (pl.preco_centavos / 1200).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) + ' por mês'
      : 'cobrado uma vez, vale 30 dias';

    const b = h('button', { cls: 'pop__plano', type: 'button' }, [
      h('div', {}, [h('b', { txt: pl.nome }), h('small', { txt: porMes })]),
      h('span', { txt: reais }),
    ]);

    b.onclick = async () => {
      b.disabled = true;
      try {
        const r = await api('/checkout.php?plano=' + encodeURIComponent(pl.slug));
        /* Aba nova, e não redirecionamento: quem sai do painel pro Mercado
           Pago e volta numa página deles perde o caminho de volta. */
        window.open(r.url, '_blank', 'noopener');
        fechaPop();
        recado('Abri o pagamento numa aba nova. Depois de pagar, volte aqui e recarregue a página.', 'bom');
      } catch (e) {
        recado(e.message, 'ruim');
      }
      b.disabled = false;
    };
    planos.appendChild(b);
  });

  const seja = h('button', { cls: 'bt principal', type: 'button',
    txt: estado.plano === 'gratis' ? 'Seja Pro' : 'Renovar', style: 'width:100%' });
  seja.onclick = () => {
    seja.classList.add('escondido');
    planos.classList.remove('escondido');
  };

  caixa.appendChild(seja);
  caixa.appendChild(planos);
  caixa.appendChild(h('p', { cls: 'd', style: 'margin:14px 0 0;text-align:center',
    txt: 'Pix, cartão ou saldo do Mercado Pago. O pagamento acontece no site deles — '
       + 'os dados do seu cartão não passam por aqui.' }));

  document.body.appendChild(fundo);
}

/* A aba só existe se houver o que vender. Perguntar uma vez, na abertura do
   painel, e guardar: isto não muda no meio da sessão. */
let proEstado = null;

function ligaUpgrade() {
  api('/checkout.php?estado=1').then((c) => {
    if (!c.ligado) return;
    if (c.modo === 'teste' && !souAdmin) return;
    proEstado = c;
    el('abaUpgrade').classList.remove('escondido');
  }).catch(() => { /* cobrança fora do ar não pode atrapalhar o resto */ });
}

el('abaUpgrade').onclick = () => {
  fechaBandejas(null);
  if (proEstado) abrePro(proEstado);
};

/* ---------------- telas ---------------- */
function telaLista(filtro) {
  const tela = el('tela');
  tela.innerHTML = '';
  const lista = filtro ? perfis.filter((p) => p.tipo === filtro) : perfis;

  tela.appendChild(h('h1', { txt: filtro ? TIPOS[filtro].nome : 'Meus overlays' }));
  tela.appendChild(h('p', { cls: 'sub', txt: filtro
    ? TIPOS[filtro].txt + '. Cada um vira um link fixo que atualiza sozinho no OBS.'
    : 'Cada overlay vira um link fixo. Cola no OBS uma vez e nunca mais mexe: o que você editar aqui aparece na live em até 15 segundos.' }));

  const criar = h('button', { cls: 'bt principal', type: 'button', txt: '+ Criar ' + (filtro ? TIPOS[filtro].nome.toLowerCase() : 'overlay') });
  criar.onclick = () => vaiPara('#/novo/' + (filtro || 'meta'));
  tela.appendChild(criar);

  /* A LISTA VELHA PRECISA SE ANUNCIAR.

     Sem esta caixa, "não consegui falar com o servidor" e "você não tem
     overlay nenhum" desenham a mesma tela — e a segunda é a que assusta. */
  if (listaVelha) {
    const cx = h('div', { cls: 'aviso', style: 'margin:16px 0' });
    cx.appendChild(h('p', { style: 'margin:0 0 10px', txt:
      'Não consegui falar com o servidor agora, então esta é a última lista que eu tinha visto. '
      + 'Nada foi apagado: os overlays que já estão no OBS continuam funcionando, porque eles falam '
      + 'com o servidor por conta própria e não dependem desta tela.' }));

    const bt = h('button', { cls: 'bt mini', type: 'button', txt: 'Tentar de novo' });
    bt.onclick = async () => {
      bt.disabled = true;
      bt.textContent = 'tentando…';
      /* So redesenha se deu certo: quando carrega() descobre que a chave
         morreu, ela mesma limpa a tela e poe a caixa de entrar. Chamar
         rota() aqui desenharia a lista por cima dessa caixa, e a pessoa
         veria as duas coisas ao mesmo tempo. */
      if (await carrega()) rota();
      else { bt.disabled = false; bt.textContent = 'Tentar de novo'; }
    };
    cx.appendChild(bt);

    if (erroCarga) {
      cx.appendChild(h('p', { cls: 'd', style: 'margin:10px 0 0', txt: 'O que deu errado: ' + erroCarga.message }));
    }
    tela.appendChild(cx);
  }

  if (!lista.length) {
    if (!listaVelha) {
      tela.appendChild(h('div', { cls: 'vazio', txt: 'Nenhum overlay ainda. Crie o primeiro aí em cima.', style: 'margin-top:18px' }));
    }
    return;
  }

  const grade = h('div', { cls: 'cartoes', style: 'margin-top:18px' });
  lista.forEach((p) => {
    const link = location.origin + location.pathname.replace(/[^/]*$/, '') + 'overlay.html?k=' + p.chave_publica;
    const c = p.config || {};

    const editar = h('button', { cls: 'bt mini', type: 'button', txt: 'Editar' });
    editar.onclick = () => vaiPara('#/editar/' + p.id);

    const copiar = h('button', { cls: 'bt mini', type: 'button', txt: 'Copiar link' });
    copiar.onclick = async () => {
      try { await navigator.clipboard.writeText(link); copiar.textContent = 'Copiado'; }
      catch (e) { recado('Selecione o link no cartão e use Ctrl+C.', 'ruim'); }
      setTimeout(() => { copiar.textContent = 'Copiar link'; }, 2000);
    };

    const apagar = h('button', { cls: 'bt mini perigo', type: 'button', txt: 'Apagar' });
    apagar.onclick = async () => {
      if (!confirm('Apagar "' + (p.nome || 'este overlay') + '"? Quem estiver com ele no OBS fica sem nada.')) return;
      try { await api('/perfil.php', { method: 'POST', body: JSON.stringify({ acao: 'apagar', id: p.id }) }); await carrega(); }
      catch (e) { recado(e.message, 'ruim'); }
    };

    const extra = p.tipo === 'meta'
      ? (c.fonte === 'manual' ? 'na mão' : (c.fonte === 'subs' ? 'subs' : 'seguidores')) + ' · alvo ' + (c.alvo || '?')
      : (TIPOS[p.tipo] ? TIPOS[p.tipo].txt : p.tipo);

    const previa = h('div', { cls: 'previa xadrez' });
    previa.dataset.cfg = JSON.stringify(Object.assign(padraoDe(p.tipo), c));
    if (observador) observador.observe(previa);

    grade.appendChild(h('div', { cls: 'cartao' }, [
      previa,
      h('div', { cls: 'topo' }, [
        h('b', { txt: p.nome || 'Sem nome' }),
        h('span', { cls: 'selo', txt: (TIPOS[p.tipo] || {}).nome || p.tipo }),
      ]),
      h('span', { style: 'font-size:12.5px;color:var(--apagado)', txt: extra }),
      h('code', { txt: link }),
      h('div', { cls: 'acoes' }, [editar, copiar, apagar]),
    ]));
  });
  tela.appendChild(grade);
}

function telaEditor(perfil, tipoNovo) {
  const tela = el('tela');
  tela.innerHTML = '';
  redesenhar = [];
  camposPorChave = {};
  historico = []; futuro = [];
  editando = perfil;
  cfg = perfil ? Object.assign(padraoDe(perfil.tipo), perfil.config || {}) : padraoDe(tipoNovo);

  const tipo = cfg.tipo;
  empurra();                 /* o estado de partida é o fundo da pilha */
  tela.appendChild(h('h1', { txt: (perfil ? 'Editar ' : 'Novo ') + (TIPOS[tipo] || {}).nome }));
  tela.appendChild(h('p', { cls: 'sub', txt: 'Arraste cada parte pra onde quiser, como no Photoshop. Segure Shift pra travar no eixo, dê dois cliques numa peça pra pular pro campo dela, e use Ctrl+Z pra voltar atrás (Ctrl+Shift+Z refaz). O que você vê aqui é o mesmo desenho que vai pro OBS — não é imitação.' }));

  /* O CRONÔMETRO PARADO E NINGUÉM SABE POR QUÊ.

     Criar o overlay de subathon é metade: o que soma tempo é uma configuração
     que mora em Ferramentas. Quem não sabe disso vê um cronômetro parado e
     conclui que está quebrado. Agora o próprio editor diz em que pé está. */
  if (tipo === 'subathon') {
    const est = h('p', { cls: 'aviso escondido' });
    tela.appendChild(est);

    api('/subathon.php').then((s) => {
      const meu = perfil && s.perfil_id && String(s.perfil_id) === String(perfil.id);
      const ir = h('button', { cls: 'bt mini', type: 'button', txt: 'Abrir configuração do subathon' });
      ir.onclick = () => vaiPara('#/subathon');

      if (!s.configurado) {
        est.textContent = 'O cronômetro ainda não está ligado a nada. Salve este overlay e ele liga sozinho — ou ajuste os valores agora. ';
      } else if (!s.ligado) {
        est.textContent = 'O subathon está DESLIGADO: o cronômetro não vai somar tempo com sub, bits nem doação. ';
      } else if (perfil && !meu) {
        est.textContent = 'Atenção: o tempo está indo pra OUTRO overlay de subathon, não pra este. ';
      } else {
        est.textContent = 'O subathon está ligado e somando tempo neste overlay. ';
        est.classList.remove('aviso');
        est.className = 'd';
        est.style.color = 'var(--verde-forte)';
      }
      est.appendChild(ir);
      est.classList.remove('escondido');
    }).catch(() => {});
  }

  /* CADA PLATAFORMA TEM UM PORÉM, E ELE PRECISA APARECER NA HORA DA ESCOLHA.

     Descobrir depois de montar o overlay que o número do YouTube anda de cem
     em cem, ou que o Kick não conta seguidor, é descobrir tarde. */
  if (tipo === 'meta') {
    const avisoPlat = h('p', { cls: 'aviso escondido' });
    tela.appendChild(avisoPlat);

    const ytHandle = h('input', { type: 'text', placeholder: '@seucanal', style: 'flex:0 0 200px' });
    const ytBt = h('button', { cls: 'bt mini', type: 'button', txt: 'Ligar canal' });
    /* O RESULTADO FICA AQUI, E NÃO NO RECADO DO TOPO.

       O recado aparece no alto da página, e quem está mexendo neste campo
       está lá embaixo — o erro passava despercebido e a impressão era de que
       o botão não fazia nada. */
    const ytEstado = h('p', { cls: 'd', style: 'margin:4px 0 0;flex:1 1 100%' });
    const ytLinha = h('div', { cls: 'campo escondido', style: 'margin-top:6px;flex-wrap:wrap' },
      [h('label', { txt: 'Canal do YouTube' }), ytHandle, ytBt, ytEstado]);
    tela.appendChild(ytLinha);

    const ytDiz = (txt, bom) => {
      ytEstado.textContent = txt;
      ytEstado.style.color = bom ? 'var(--verde-forte)' : 'var(--perigo)';
    };

    const ytVer = () => {
      ytEstado.style.color = '';
      ytEstado.textContent = 'vendo…';
      api('/youtube.php').then((r) => {
        if (r.handle) ytHandle.value = '@' + r.handle;
        if (!r.ligado) return ytDiz('Nenhum canal ligado ainda. Escreva o @ e clique em Ligar canal.', false);
        if (r.erro) return ytDiz(r.erro, false);
        if (r.inscritos === null) return ytDiz('Canal ligado, mas o YouTube está com a contagem de inscritos escondida.', false);
        ytDiz('Canal @' + r.handle + ' ligado: ' + r.inscritos.toLocaleString('pt-BR') + ' inscritos.', true);
        if (cfg.fonte === 'subs') { cfg.atual = r.inscritos; redesenhar.forEach((f) => f()); manda(); }
      }).catch((e) => ytDiz('Não consegui perguntar: ' + e.message, false));
    };

    ytBt.onclick = async () => {
      ytBt.disabled = true;
      ytEstado.style.color = '';
      ytEstado.textContent = 'procurando o canal…';
      try {
        const r = await api('/youtube.php', { method: 'POST', body: JSON.stringify({ handle: ytHandle.value }) });
        if (r.inscritos === null) ytDiz('Canal ligado, mas os inscritos estão escondidos no YouTube.', false);
        else {
          ytDiz('Pronto: ' + r.inscritos.toLocaleString('pt-BR') + ' inscritos.', true);
          cfg.atual = r.inscritos; redesenhar.forEach((f) => f()); manda();
        }
      } catch (e) { ytDiz(e.message, false); }
      ytBt.disabled = false;
    };

    const verPlataforma = () => {
      const p2 = cfg.plataforma || 'twitch';
      ytLinha.classList.toggle('escondido', p2 !== 'youtube');

      if (p2 === 'youtube') {
        avisoPlat.textContent = 'O YouTube arredonda o número de inscritos: acima de mil ele anda de dez em dez, '
          + 'acima de cem mil, de mil em mil. Isso é regra do YouTube e vale até pro dono do canal — '
          + 'a meta vai andar aos saltos, não de um em um.';
        avisoPlat.classList.remove('escondido');
        ytVer();
      } else if (p2 === 'kick') {
        avisoPlat.textContent = 'O Kick não expõe contagem de seguidores em lugar nenhum da API — '
          + 'por isso ela não aparece na lista. Assinantes e gente assistindo funcionam normalmente, '
          + 'e você precisa ter conectado o Kick em Ferramentas.';
        avisoPlat.classList.remove('escondido');
      } else {
        avisoPlat.classList.add('escondido');
      }
    };
    redesenhar.push(verPlataforma);
    verPlataforma();
  }

  /* A PRÉVIA DA META MOSTRAVA ZERO: o número automático é injetado pelo
     servidor quando o OVERLAY pergunta, e o editor nunca perguntava — então
     aqui aparecia "0 / 1000" enquanto no OBS apareceria o número certo. */
  if (tipo === 'meta' && cfg.fonte !== 'manual') {
    api('/contagem.php?fonte=' + encodeURIComponent(cfg.fonte)
        + '&plataforma=' + encodeURIComponent(cfg.plataforma || 'twitch')).then((r) => {
      if (!r || typeof r.valor !== 'number') return;
      cfg.atual = r.valor;
      redesenhar.forEach((f) => f());
      manda();
    }).catch(() => {});
  }

  /* O OVERLAY DE MÚSICA SEM SPOTIFY FICA VAZIO PRA SEMPRE, E EM SILÊNCIO:
     Na prévia aqui ele mostra a música de mentira e parece tudo certo; no
     OBS não aparece nada, e nada em lugar nenhum diz o motivo. */
  if (tipo === 'musica') {
    const avisoSpot = h('p', { cls: 'aviso escondido' });
    tela.appendChild(avisoSpot);

    /* O QUE O SERVIDOR ESTÁ VENDO AGORA.

       "Conectei e não aparece no OBS" tem três causas bem diferentes: não
       conectou, conectou e o Spotify diz que não há nada tocando, ou está
       tudo certo e o problema é a fonte do OBS. Sem separar as três, a
       pessoa fica adivinhando — e eu também. */
    const spEstado = h('p', { cls: 'd', txt: 'vendo o que o servidor enxerga…' });
    tela.appendChild(spEstado);

    /* O LAST.FM PEDE UMA COISA SÓ: o nome de usuário. Não tem login, não tem
       lista de permissão — por isso ele funciona pra qualquer um no primeiro
       dia, que é justamente o que o Spotify não consegue hoje. */
    const lfNome = h('input', { type: 'text', placeholder: 'seu usuário no Last.fm', style: 'flex:0 0 200px' });
    const lfBt = h('button', { cls: 'bt mini', type: 'button', txt: 'Ligar' });
    const lfEstado = h('p', { cls: 'd', style: 'margin:4px 0 0;flex:1 1 100%' });
    const lfLinha = h('div', { cls: 'campo escondido', style: 'flex-wrap:wrap' },
      [h('label', { txt: 'Conta do Last.fm' }), lfNome, lfBt, lfEstado]);
    tela.appendChild(lfLinha);

    const lfDiz = (txt, bom) => {
      lfEstado.textContent = txt;
      lfEstado.style.color = bom ? 'var(--verde-forte)' : 'var(--perigo)';
    };

    const lfVer = () => {
      lfEstado.style.color = '';
      lfEstado.textContent = 'vendo…';
      api('/lastfm.php').then((r) => {
        if (r.usuario) lfNome.value = r.usuario;
        if (!r.ligado) return lfDiz('Escreva o seu usuário do Last.fm e clique em Ligar.', false);
        if (r.erro) return lfDiz(r.erro, false);
        if (!r.tocando) {
          /* "Nada tocando" no Last.fm quase sempre quer dizer que o scrobble
             não está ligado — o Last.fm só sabe da música se o Spotify (ou o
             player) estiver mandando pra ele. */
          return lfDiz('Ligado como ' + r.usuario + ', mas o Last.fm não está recebendo nada agora. '
            + 'Confira em last.fm > Configurações > Aplicativos se o seu Spotify está conectado lá, '
            + 'e dê play numa música.', false);
        }
        lfDiz('Tocando agora: ' + r.tocando.nome + ' — ' + r.tocando.artista + '.', true);
      }).catch((e) => lfDiz('Não consegui perguntar: ' + e.message, false));
    };

    lfBt.onclick = async () => {
      lfBt.disabled = true;
      lfEstado.style.color = '';
      lfEstado.textContent = 'conferindo…';
      try {
        const r = await api('/lastfm.php', { method: 'POST', body: JSON.stringify({ usuario: lfNome.value }) });
        lfNome.value = r.usuario;
        if (r.tocando) lfDiz('Pronto. Tocando agora: ' + r.tocando.nome + ' — ' + r.tocando.artista + '.', true);
        else lfDiz('Conta ligada, mas nada tocando agora. Dê play numa música e recarregue.', false);
      } catch (e) { lfDiz(e.message, false); }
      lfBt.disabled = false;
    };

    /* Cada fonte mostra o seu diagnóstico e esconde o do outro: dois blocos
       de erro na tela ao mesmo tempo é o caminho curto pra pessoa consertar
       o que não está quebrado. */
    const verFonteMusica = () => {
      const ehSpotify = cfg.mfonte === 'spotify';
      lfLinha.classList.toggle('escondido', ehSpotify);
      spEstado.classList.toggle('escondido', !ehSpotify);
      spAcoes.classList.toggle('escondido', !ehSpotify);
      if (ehSpotify) spVer(); else lfVer();
    };

    /* CONECTAR E DESCONECTAR AQUI, E NÃO SÓ NA TELA DE MODERADORES.

       O bloco da conta do Spotify morava em Moderadores — lugar nenhum pra
       quem está mexendo numa overlay de música e leva uma mensagem dizendo
       pra reconectar. Botão que a mensagem manda apertar tem que estar do
       lado da mensagem. */
    const spAcoes = h('div', { cls: 'campo escondido', style: 'gap:8px' });
    tela.appendChild(spAcoes);

    const spBotoes = (ligado, entrar) => {
      spAcoes.innerHTML = '';
      const b = h('button', { cls: 'bt mini', type: 'button',
                              txt: ligado ? 'Desconectar o Spotify' : 'Conectar o Spotify' });
      b.onclick = async () => {
        if (!ligado) { if (entrar) location.href = entrar; return; }
        b.disabled = true;
        try {
          await api('/spotify.php', { method: 'POST', body: JSON.stringify({ acao: 'desligar' }) });
          recado('Spotify desconectado.', 'bom');
          spVer();
        } catch (e) { recado(e.message, 'ruim'); b.disabled = false; }
      };
      spAcoes.appendChild(b);
      spAcoes.classList.remove('escondido');
    };

    const spVer = () => {
      api('/spotify.php').then((r) => {
        spBotoes(!!r.ligado, r.entrar);
        if (!r.ligado) {
          spEstado.textContent = 'O Spotify não está conectado.';
          spEstado.style.color = 'var(--perigo)';
          return;
        }
        if (!r.tocando) {
          /* Conectado e vazio é o caso que mais confunde, e as causas são
             bem diferentes. Pergunta o cru pro Spotify e diz qual é. */
          api('/spotify.php?diag=1').then((g) => {
            if (g.etapa === 'token') {
              spEstado.textContent = 'O acesso ao Spotify venceu: ' + g.erro + ' Conecte de novo em Ferramentas.';
              return;
            }
            if (g.etapa !== 'ok') return;

            if (g.http_tocando === 403 || g.http_player === 403) {
              /* 403 aqui quase nunca é a conta de quem usa: é o app do site
                 estar em modo de desenvolvimento no Spotify, que atende no
                 máximo 5 contas numa lista escrita à mão. Quem não está na
                 lista leva 403 em tudo. Reconectar não resolve, e mandar
                 reconectar só faz a pessoa perder tempo. */
              spEstado.textContent = 'O Spotify recusou (403), e isso não é a sua conta: o aplicativo do site '
                + 'ainda está em modo de desenvolvimento no Spotify, que só atende 5 contas cadastradas à mão. '
                + 'Avise o Enzo pra te adicionar — reconectar aqui não resolve.';
            } else if (g.privado) {
              spEstado.textContent = 'O seu Spotify está em SESSÃO PRIVADA. Nesse modo ele não conta o que está '
                + 'tocando pra ninguém, nem pra gente. Desligue a sessão privada no app do Spotify.';
            } else if (!g.aparelho) {
              spEstado.textContent = 'O Spotify não está reportando nenhum aparelho ativo. Isso acontece quando ele '
                + 'foi aberto e ficou parado: dê play, pule uma música, e ele volta a reportar.';
            } else if (g.tocando && !g.tem_item) {
              spEstado.textContent = 'O Spotify diz que está tocando em "' + g.aparelho + '", mas não devolve a faixa. '
                + 'Costuma ser podcast ou episódio, que a leitura de música não enxerga.';
            } else {
              spEstado.textContent = 'O Spotify respondeu ' + g.http_tocando + ' e não trouxe faixa. Aparelho: '
                + (g.aparelho || 'nenhum') + '. ' + (g.erro_api || '');
            }
            spEstado.style.color = 'var(--perigo)';
          }).catch(() => {});

          /* Este é o caso que mais confunde: conectado e vazio. O Spotify só
             responde "tocando" quando há um aparelho ativo — pausado, ou logo
             depois de abrir o app, ele responde vazio. */
          spEstado.textContent = 'Conectado, mas o Spotify está respondendo que não há nada tocando. '
            + 'Dê play numa música e recarregue esta tela. Se estiver tocando e mesmo assim aparecer isto, '
            + 'o Spotify não está enxergando o aparelho — troque de música uma vez pra ele acordar.';
          spEstado.style.color = 'var(--perigo)';
          return;
        }
        /* Conectado e tocando, e ainda assim "não aparece": quase sempre é
           isto. O padrão é aparecer na TROCA de música e sumir depois, então
           com a mesma faixa tocando o overlay fica invisível a maior parte do
           tempo — e parece quebrado. */
        const escondePorPadrao = cfg.mquando === 'trocou' && cfg.manim !== 'nenhum';
        spEstado.textContent = 'Conectado e tocando agora: ' + r.tocando.nome + ' — ' + r.tocando.artista + '.'
          + (escondePorPadrao
            ? ' ATENÇÃO: este overlay está em "ao trocar de música", então ele aparece por '
              + cfg.mtempo + ' segundos quando a faixa muda e some. No OBS, com a mesma música tocando, '
              + 'ele fica invisível — é o comportamento certo, não um defeito. Pra ficar sempre na tela, '
              + 'mude "Quando mostrar" pra "Fica na tela o tempo todo".'
            : ' Se não aparece no OBS, o problema é a fonte lá, não a conexão.');
        spEstado.style.color = escondePorPadrao ? 'var(--tinta)' : 'var(--verde-forte)';
      }).catch((e) => {
        spEstado.textContent = 'Não consegui perguntar: ' + e.message;
        spEstado.style.color = 'var(--perigo)';
      });
    };

    redesenhar.push(verFonteMusica);
    verFonteMusica();
    api('/spotify.php').then((d) => {
      if (d && d.ligado) return;
      avisoSpot.textContent = 'A sua conta do Spotify ainda não está conectada. Sem isso este overlay fica vazio no OBS, mesmo aparecendo certo aqui na prévia. ';
      const b = h('button', { cls: 'bt mini', type: 'button', txt: 'Conectar agora' });
      b.onclick = () => { if (d && d.entrar) location.href = d.entrar; };
      avisoSpot.appendChild(b);
      avisoSpot.classList.remove('escondido');
    }).catch(() => {});
  }

  /* Fica em cima da prévia, e não numa gaveta: é a primeira decisão que
     faz sentido tomar, e escondida ninguém acharia. */
  const fileira = h('div', { cls: 'prontos' });
  (PRONTOS[tipo] || []).forEach((pr) => {
    const b = h('button', { cls: 'bt mini', type: 'button' }, [
      document.createTextNode(pr[0]), h('small', { txt: pr[2 - 1] }),
    ]);
    b.onclick = () => {
      Object.keys(pr[2]).forEach((k) => { cfg[k] = pr[2][k]; });
      manda();
      Object.keys(camposPorChave).forEach((k) => {
        const c = camposPorChave[k];
        if (c && c.controle && c.controle.__sincroniza) c.controle.__sincroniza();
      });
      redesenhar.forEach((f) => f());
      marcaHistorico(true);
      recado('Estilo "' + pr[0] + '" aplicado. Ctrl+Z volta.');
    };
    fileira.appendChild(b);
  });

  quadro = h('iframe', { src: 'overlay.html', title: 'Prévia' });
  const palco = h('div', { cls: 'palco xadrez' }, [quadro]);
  quadro.onload = () => {
    manda();
    /* Só a prévia entra em modo edição. A fonte que roda no OBS nunca
       recebe esta mensagem, então lá não existe tracejado nem arrasto. */
    try {
      quadro.contentWindow.postMessage({ type: 'zc:editar', on: true }, location.origin);
      /* O chat so tem o que mostrar quando alguem fala. No editor isso
         significaria uma tela vazia, entao peco frases de mentira. */
      if (cfg.tipo === 'chat' || cfg.tipo === 'feed' || cfg.tipo === 'musica' || cfg.tipo === 'alerta') quadro.contentWindow.postMessage({ type: 'zc:exemplo' }, location.origin);
    } catch (e) {}
  };

  const controles = h('div', { cls: 'controles' });
  GRUPOS.forEach((g) => {
    if (g.se && !g.se(cfg)) return;
    const corpo = h('div', { cls: 'corpo' });
    let temAlgo = false;

    /* Uma explicação por SEÇÃO, e não uma dica repetida embaixo de cada campo.
       Quando cinco campos compartilham a mesma regra, repetir a regra cinco
       vezes não ensina mais — só empurra os campos pra baixo. */
    if (g.intro) corpo.appendChild(h('p', { cls: 'd', style: 'margin:0 0 12px', txt: g.intro }));

    g.itens.forEach((it) => {
      const fab = FABRICA[it.c];
      if (!fab) return;
      if (it.se && !it.se(cfg) && !it.se.sempreMontar) {
        /* monta mesmo assim e esconde: assim aparecer/sumir não perde o
           estado do controle nem exige remontar a tela inteira */
      }
      temAlgo = true;
      const controle = fab(it);
      /* A CHAVE VIRA UM <label> DE VERDADE: O botãozinho tem 40 por 22
         pixels, e o texto ao lado não fazia nada quando clicado: eram
         irmãos, não pai e filho. */
      const ehChave = !!controle.__marcavel;
      const linha = h(ehChave ? 'label' : 'div',
        ehChave ? { cls: 'campo campo--chave' } : { cls: 'campo' },
        [h('span', { cls: 'rotulo', txt: it.l }), controle]);
      camposPorChave[it.k] = { controle, grupo: null, linha };
      const caixa = it.dica
        ? h('div', {}, [linha, h('p', { style: 'margin:-4px 0 10px;font-size:11.5px;color:var(--apagado)', txt: it.dica })])
        : linha;
      if (it.se) {
        const ver = () => caixa.classList.toggle('escondido', !it.se(cfg));
        redesenhar.push(ver);
        ver();
      }
      corpo.appendChild(caixa);
    });

    if (!temAlgo) return;
    const det = h('details', g.aberto ? { open: '' } : {}, [h('summary', { txt: g.t }), corpo]);
    g.itens.forEach((it) => { if (camposPorChave[it.k]) camposPorChave[it.k].grupo = det; });
    controles.appendChild(det);
  });

  const nome = h('input', { type: 'text', style: 'width:100%' });
  nome.value = perfil ? (perfil.nome || '') : ((TIPOS[tipo] || {}).nome || '');
  const salvar = h('button', { cls: 'bt principal', type: 'button', txt: perfil ? 'Salvar' : 'Criar overlay' });
  salvar.onclick = async () => {
    salvar.disabled = true;
    const corpo = { nome: nome.value.trim() || (TIPOS[tipo] || {}).nome, config: cfg };
    try {

        await api('/perfil.php', { method: 'POST', body: JSON.stringify(Object.assign({ acao: 'salvar', id: perfil.id }, corpo)) });
        recado('Salvo. O OBS pega em até 15 s, sem mexer em nada.', 'bom');
        await carrega();
      } else {
        const d = await api('/perfil.php', { method: 'POST', body: JSON.stringify(Object.assign({ acao: 'criar', tipo }, corpo)) });
        await carrega();
        recado(d.subathon_ligado
          ? 'Pronto! O subathon já está ligado neste overlay e vai somar tempo sozinho. Copie o link do cartão e cole numa Fonte de Navegador no OBS.'
          : 'Pronto! Copie o link do cartão e cole numa Fonte de Navegador no OBS.', 'bom');
        vaiPara('#/editar/' + d.id);
        return;

    ['nx', 'ny', 'tx', 'ty', 'bx', 'by'].forEach((k) => { cfg[k] = 0; });
    manda();
    recado('Peças de volta ao lugar de origem.');
  };

  const voltar = h('button', { cls: 'bt', type: 'button', txt: 'Voltar' });
  voltar.onclick = () => vaiPara('#/overlays');

  tela.appendChild(h('div', { cls: 'editor' }, [
    h('div', { cls: 'lado' }, [fileira, palco]),
    h('div', {}, [
      h('div', {}, [
        h('div', { cls: 'campo' }, [h('label', { txt: 'Nome' }), nome]),
        h('p', { style: 'margin:-4px 0 12px;font-size:11.5px;color:var(--apagado)',
                 txt: 'só pra você achar na lista; não aparece na live' }),
      ]),
      controles,
      h('div', { cls: 'acoes', style: 'display:flex;gap:8px;margin-top:12px' }, [salvar, centrar, voltar]),

function telaControlador() {
  const tela = el('tela');
  tela.innerHTML = '';
  tela.appendChild(h('h1', { txt: 'Meu Controller' }));
  tela.appendChild(h('p', { cls: 'sub', txt: 'Tudo que é seu num lugar só: a chave, os links que você já tem, e o que cada um faz. Nada aqui aparece destapado sozinho — se você abrir esta página na live, ninguém leva sua chave.' }));

  const base = location.origin + location.pathname.replace(/[^/]*$/, '');

  /* ----- o plano -----

     SEM PREÇO AQUI. Esta tela é a das coisas da pessoa — chave, links,
     conta. Preço no meio disso é vitrine em cima de ferramenta. O que cabe
     é a informação: em que plano você está. Quem quiser mudar tem a aba
     Upgrade lá em cima. */
  const fatiaPlano = h('div', { cls: 'fatia escondido' });
  tela.appendChild(fatiaPlano);

  if (proEstado) {
    const ate = proEstado.valido_ate ? new Date(proEstado.valido_ate.replace(' ', 'T')) : null;
    fatiaPlano.appendChild(h('h3', { txt: 'Seu plano' }));
    fatiaPlano.appendChild(h('p', { cls: 'd', txt: proEstado.plano === 'gratis'
      ? 'Grátis. Dá pra ver o que muda no Pro na aba Upgrade, ali em cima.'
      : 'Pro' + (ate ? ', até ' + ate.toLocaleDateString('pt-BR') : '') + '.' }));
    fatiaPlano.classList.remove('escondido');
  }

  /* ----- a chave ----- */
  const fatiaChave = h('div', { cls: 'fatia' }, [
    h('h3', { txt: 'Chave do painel' }),
    h('p', { cls: 'd', txt: 'É ela que prova que o painel é seu. Quem tiver essa chave controla o seu OBS — trate como senha.' }),
  ]);

  async function redefinir() {
    const aviso = 'Trocar a chave agora?\n\nA fonte do OBS PARA de funcionar até você colar o endereço novo nela, e links salvos nos favoritos deixam de valer.';
    if (!confirm(aviso)) return;
    try {
      const d = await api('/chave.php', { method: 'POST', body: JSON.stringify({ acao: 'redefinir' }) });
      chave = d.chave;
      guardaChave(chave);
      telaControlador();
      recado('Chave trocada. Agora cole o endereço novo na fonte do OBS — o antigo não vale mais.', 'bom');
    } catch (e) { recado(e.message, 'ruim'); }
  }

  fatiaChave.appendChild(segredo(chave, redefinir));
  fatiaChave.appendChild(h('p', { cls: 'aviso', txt: 'Trocar a chave para a fonte do OBS: o endereço dela carrega a chave dentro. Só troque se a chave tiver aparecido em print, em VOD ou na tela durante a live — e deixe o OBS aberto pra colar o endereço novo logo em seguida.' }));
  tela.appendChild(fatiaChave);

  /* ----- conta da Twitch ----- */
  const btEntrarDeNovo = h('button', { cls: 'bt', type: 'button', txt: 'Entrar de novo na Twitch' });
  btEntrarDeNovo.onclick = () => {
    /* Avisar ANTES, e não depois: a chave é guardada com hash, então entrar
       de novo obriga a gerar outra — e todo link que carrega a chave (a fonte
       da ponte e o painel do OBS) para de valer na hora. Os overlays não:
       eles usam a chave pública de cada um, que não muda. */
    if (!confirm('Entrar de novo troca a sua chave. Seus overlays NAO sao afetados e continuam funcionando no OBS. O que precisa ser colado de novo la sao a fonte da ponte e o painel, e os dois novos aparecem aqui em Meu Controller depois que voce entrar. Continuar?')) return;
    location.href = API + '/entrar.php';
  };

  const btSair = h('button', { cls: 'bt fraco', type: 'button', txt: 'Sair deste computador' });
  btSair.onclick = () => {
    /* Só apaga a chave guardada aqui. A conta continua ligada no servidor:
       "sair" não pode desligar overlay que está no ar numa live. */
    esqueceChave();
    location.href = 'index.html';
  };

  tela.appendChild(h('div', { cls: 'fatia' }, [
    h('h3', { txt: 'Conta da Twitch' }),
    h('p', { cls: 'd', txt: 'Entrar de novo renova a permissão e o acesso — é o que resolve quando a Twitch para de responder ou quando uma permissão nova foi adicionada ao site. Não desfaz nada: seus overlays, comandos e subathon continuam como estão.' }),
    h('div', { cls: 'acoes', style: 'display:flex;gap:8px;flex-wrap:wrap' }, [btEntrarDeNovo, btSair]),
    h('p', { cls: 'd', style: 'margin-top:8px', txt: 'Sair só apaga a chave guardada neste navegador. Os overlays que já estão no OBS continuam funcionando.' }),
  ]));

  /* ----- links que carregam a chave dentro ----- */
  const fatiaLinks = h('div', { cls: 'fatia' }, [
    h('h3', { txt: 'Meus links com chave' }),
    h('p', { cls: 'd', txt: 'Estes carregam a chave dentro do endereço, então nascem tapados. Copie e cole direto no OBS sem mostrar na tela.' }),
  ]);
  [
    ['Fonte do OBS', base + 'ponte.html?chave=' + encodeURIComponent(chave)],
    ['Painel do OBS', base + 'painel.html?chave=' + encodeURIComponent(chave)],
  ].forEach(function (par) {
    fatiaLinks.appendChild(h('p', { style: 'margin:12px 0 5px;font-size:12.5px;color:var(--fraco)', txt: par[0] }));
    fatiaLinks.appendChild(segredo(par[1], null));
  });
  tela.appendChild(fatiaLinks);

  /* ----- links dos overlays: sem segredo dentro ----- */
  const fatiaOv = h('div', { cls: 'fatia' }, [
    h('h3', { txt: 'Meus overlays' }),
    h('p', { cls: 'd', txt: 'Estes NÃO carregam a sua chave — só um endereço sorteado que apenas mostra o overlay. Podem aparecer na tela sem risco.' }),
  ]);
  if (!perfis.length) {
    fatiaOv.appendChild(h('div', { cls: 'vazio', txt: 'Nenhum overlay ainda.' }));
  } else {
    perfis.forEach((p) => {
      const url = base + 'overlay.html?k=' + p.chave_publica;
      const cod = h('code', { txt: url,
        style: 'flex:2 1 240px;min-width:0;background:var(--fundo);border:1px solid var(--linha);border-radius:4px;padding:8px 9px;font-size:11px;color:var(--fraco);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:all' });
      const cp = h('button', { cls: 'bt mini', type: 'button', txt: 'Copiar' });
      cp.onclick = async () => {
        try { await navigator.clipboard.writeText(url); cp.textContent = 'Copiado'; } catch (e) {}
        setTimeout(() => { cp.textContent = 'Copiar'; }, 2000);
      };
      const linha = h('div', { cls: 'campo' }, [
        h('label', { txt: (p.nome || 'Sem nome') + ' · ' + ((TIPOS[p.tipo] || {}).nome || p.tipo) }),
        cod, cp,
      ]);
      fatiaOv.appendChild(linha);
    });
  }
  tela.appendChild(fatiaOv);
}

function telaComandos() {
  const tela = el('tela');
  tela.innerHTML = '';
  tela.appendChild(h('h1', { txt: 'Comandos' }));
  tela.appendChild(h('p', { cls: 'sub', txt: 'O que o seu chat pode mandar pro OBS. Os de fábrica já funcionam; os seus são apelidos com o argumento pronto — "!brb" vira "cena Cenário BRB".' }));

  /* ----- os de fábrica ----- */
  const fab = h('div', { cls: 'fatia' }, [
    h('h3', { txt: 'Já funcionam' }),
    h('p', { cls: 'd', txt: 'Quem pode usar é decidido pela etiqueta que a Twitch manda junto da mensagem — não dá pra fingir ser mod. A ordem é: chat, sub, VIP, mod, moderador-chefe, você.' }),
  ]);
  DE_FABRICA.forEach((c) => {
    fab.appendChild(h('div', { cls: 'campo' }, [
      h('code', { txt: '!' + c[0], style: 'flex:0 0 96px;background:var(--fundo);border:1px solid var(--linha);border-radius:4px;padding:5px 8px;font-size:12px;color:var(--verde-forte)' }),
      h('span', { cls: 'selo', txt: c[1] }),
      h('label', { style: 'flex:1 1 200px', txt: c[2] }),
    ]));
  });
  tela.appendChild(fab);

  /* ----- os seus ----- */
  const meus = h('div', { cls: 'fatia' }, [
    h('h3', { txt: 'Os seus' }),
    h('p', { cls: 'd', txt: 'Um comando seu não é código novo: é um nome novo pra uma ação que já existe, com o argumento já preenchido. Assim o mod digita "!brb" em vez de lembrar o nome exato da cena.' }),
  ]);
  const listaMeus = h('div');
  meus.appendChild(listaMeus);

  const cNome = h('input', { type: 'text', placeholder: 'brb' });

  /* OS PASSOS: Um comando não é mais um apelido pra uma ação: é uma
     sequência. */
  const listaPassos = h('div');
  let passos = [{ acao: 'cena', argumento: '' }];

  function pintaPassos() {
    listaPassos.innerHTML = '';
    passos.forEach((p, i) => {
      const sel = h('select', { style: 'flex:0 0 130px' });
      DE_FABRICA.forEach((c) => {
        const o = h('option', { value: c[0], txt: c[0] });
        if (c[0] === p.acao) o.selected = true;
        sel.appendChild(o);
      });
      sel.onchange = () => { p.acao = sel.value; };

      const arg = h('input', { type: 'text', placeholder: 'sem argumento', style: 'flex:1 1 130px' });
      arg.value = p.argumento || '';
      arg.oninput = () => { p.argumento = arg.value; };

      const tirar = h('button', { cls: 'bt mini perigo', type: 'button', txt: '×', title: 'Tirar este passo' });
      tirar.onclick = () => { passos.splice(i, 1); if (!passos.length) passos = [{ acao: 'cena', argumento: '' }]; pintaPassos(); };

      listaPassos.appendChild(h('div', { cls: 'campo' }, [
        h('span', { style: 'flex:0 0 20px;font-size:12px;color:var(--apagado)', txt: (i + 1) + '.' }),
        sel, arg, tirar,
      ]));
    });

    const mais = h('button', { cls: 'bt mini', type: 'button', txt: '+ mais uma ação' });
    mais.disabled = passos.length >= 8;
    mais.onclick = () => { passos.push({ acao: 'mute', argumento: '' }); pintaPassos(); };
    listaPassos.appendChild(h('p', { style: 'margin:4px 0 0' }, [mais]));
  }
  pintaPassos();
  const cQuem = h('select');
  /* Quem esta em cima pode tudo que os de baixo podem: liberar pra "subs"
     tambem libera pra VIP e mod. */
  [
    ['chat', 'Qualquer um do chat'],
    ['sub', 'Subs pra cima'],
    ['vip', 'VIPs pra cima'],
    ['mod', 'Mods pra cima'],
    ['supermod', 'Só moderadores-chefe'],
    ['dono', 'Só eu'],
  ].forEach((q) => cQuem.appendChild(h('option', { value: q[0], txt: q[1] })));
  cQuem.value = 'mod';
  const cEspera = h('input', { type: 'number', min: '1', max: '600', value: '5' });
  let editandoCmd = null;

  const salvar = h('button', { cls: 'bt principal', type: 'button', txt: 'Criar comando' });
  salvar.onclick = async () => {
    salvar.disabled = true;
    try {
      await api('/comandos.php', { method: 'POST', body: JSON.stringify({
        acao: 'salvar', id: editandoCmd, nome: cNome.value, passos: passos,
        quem: cQuem.value, espera: parseInt(cEspera.value, 10) || 5,
      }) });
      cNome.value = ''; passos = [{ acao: 'cena', argumento: '' }]; pintaPassos();
      editandoCmd = null;
      salvar.textContent = 'Criar comando';
      recado('Pronto. A fonte do OBS pega em até 5 minutos, ou na hora se você recarregar ela.', 'bom');
      pintaMeus();
    } catch (e) { recado(e.message, 'ruim'); }
    salvar.disabled = false;
  };

  meus.append(
    h('div', { cls: 'campo' }, [h('label', { txt: 'Nome (sem o !)' }), cNome]),
    h('p', { style: 'margin:14px 0 4px;font-size:13px;color:var(--fraco)', txt: 'Faz o quê, nesta ordem' }),
    listaPassos,
    h('p', { style: 'margin:6px 0 12px;font-size:11.5px;color:var(--apagado)',
             txt: 'o argumento é o nome de uma cena, de uma fonte, ou o texto de uma enquete — deixe vazio no que não precisa' }),
    h('div', { cls: 'campo' }, [h('label', { txt: 'Quem pode usar' }), cQuem]),
    h('div', { cls: 'campo' }, [h('label', { txt: 'Espera entre usos (s)' }), cEspera]),
    h('p', { style: 'margin:6px 0 12px' }, [salvar]),
  );
  tela.appendChild(meus);

  async function pintaMeus() {
    listaMeus.innerHTML = '';
    let d;
    try { d = await api('/comandos.php'); } catch (e) { recado(e.message, 'ruim'); return; }
    const lista = d.comandos || [];
    if (!lista.length) {
      listaMeus.appendChild(h('div', { cls: 'vazio', txt: 'Nenhum comando seu ainda.' }));
      return;
    }
    lista.forEach((c) => {
      const ed = h('button', { cls: 'bt mini', type: 'button', txt: 'Editar' });
      ed.onclick = () => {
        editandoCmd = c.id;
        cNome.value = c.nome;
        /* O servidor entrega sempre uma lista, mesmo pros de um passo só. */
        passos = (c.passos && c.passos.length ? c.passos : [{ acao: c.acao, argumento: c.argumento }])
          .map((p) => ({ acao: p.acao, argumento: p.argumento || '' }));
        pintaPassos();
        cQuem.value = c.quem; cEspera.value = c.espera;
        salvar.textContent = 'Salvar alterações';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      const ap = h('button', { cls: 'bt mini perigo', type: 'button', txt: 'Apagar' });
      ap.onclick = async () => {
        if (!confirm('Apagar o !' + c.nome + '?')) return;
        try { await api('/comandos.php', { method: 'POST', body: JSON.stringify({ acao: 'apagar', id: c.id }) }); pintaMeus(); }
        catch (e) { recado(e.message, 'ruim'); }
      };
      listaMeus.appendChild(h('div', { cls: 'campo' }, [
        h('code', { txt: '!' + c.nome, style: 'flex:0 0 96px;background:var(--fundo);border:1px solid var(--linha);border-radius:4px;padding:5px 8px;font-size:12px;color:var(--verde-forte)' }),
        h('label', { txt: (c.passos || [{ acao: c.acao, argumento: c.argumento }])
            .map((p) => p.acao + (p.argumento ? ' ' + p.argumento : '')).join('  →  ')
            + '  ·  ' + c.quem + '  ·  ' + c.espera + 's' }),
        ed, ap,
      ]));
    });
  }
  pintaMeus();

  /* ================= GATILHOS: quando acontecer X, faca Y
     ================= A mesma sequencia de passos dos comandos, so que
     quem "digita" e o evento. */

  const EVENTOS = [
    ['sub',      'Alguem assinou',              'assinaturas'],
    ['presente', 'Alguem deu subs de presente', 'subs de uma vez'],
    ['bits',     'Alguem mandou bits',          'bits'],
    ['follow',   'Alguem comecou a seguir',     'seguidores'],
    ['real',     'Alguem doou',                 'reais'],
    ['raid',     'Chegou um raid',              'pessoas'],
  ];
  const unidadeDe = (e) => {
    const achou = EVENTOS.find((x) => x[0] === e);
    return achou ? achou[2] : '';
  };
  const rotuloDe = (e) => {
    const achou = EVENTOS.find((x) => x[0] === e);
    return achou ? achou[1] : e;
  };

  const gat = h('div', { cls: 'fatia' }, [
    h('h3', { txt: 'Sozinho, quando acontecer' }),
    h('p', { cls: 'd', txt: 'E o mesmo comando de cima, so que ninguem precisa digitar: o evento dispara. Serve pra trocar de cena quando alguem da dez subs, ou mostrar uma fonte quando chega um raid. No argumento, {quem} vira o nome da pessoa e {quanto} vira o numero.' }),
  ]);

  gat.appendChild(listaGat);

  EVENTOS.forEach((e) => gEvento.appendChild(h('option', { value: e[0], txt: e[1] })));
