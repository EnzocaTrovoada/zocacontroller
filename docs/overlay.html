<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Overlay — ZocaController</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="clock.css?v=9">
<link rel="stylesheet" href="chat.css?v=9">
<link rel="stylesheet" href="musica.css?v=9">
<style>
  /* Fundo transparente: é isso que faz a Fonte de Navegador do OBS mostrar
     só o overlay, sem retângulo preto por trás. */
  /* "light dark" declara que a pagina serve nos dois esquemas.

     Sem isso o Chrome pinta um fundo BRANCO OPACO quando um iframe de
     esquema claro e embutido numa pagina escura — ele faz isso pra nao
     deixar texto ilegivel. Resultado: no tema escuro do site, a prévia
     aparecia branca e o quadriculado sumia atras dela.

     No OBS nao muda nada: la o fundo continua transparente. */
  :root { color-scheme: light dark; }
  /* "light dark" declara que a pagina serve nos dois esquemas.

     Sem isso o Chrome pinta um fundo BRANCO OPACO quando um iframe de
     esquema claro e embutido numa pagina escura — ele faz isso pra nao
     deixar texto ilegivel. Resultado: no tema escuro do site, a prévia
     aparecia branca e o quadriculado sumia atras dela.

     No OBS nao muda nada: la o fundo continua transparente. */
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
</style>
</head>
<body>

<div id="overlay"></div>

<script src="clock.js?v=9"></script>
<script src="chat.js?v=9"></script>
<script src="musica.js?v=9"></script>
<script>
(function () {
  'use strict';

  var API = 'https://api.zocahop.com';
  var raiz = document.getElementById('overlay');

  /* A chave vem na URL e é só de LEITURA: ela aparece em print, em VOD e em
     tutorial. Quem escreve é o painel, com a chave da conta no cabeçalho —
     que nunca passa por aqui. */
  var k = (new URLSearchParams(location.search).get('k') || '')
            .replace(/[^A-Za-z0-9_-]/g, '').slice(0, 64);

  /* DOIS DESENHISTAS, UMA PAGINA.
     O chat e uma LISTA que cresce; os outros sao um texto que se reescreve.
     Forcar os dois no mesmo motor deixaria os dois piores — entao a pagina
     troca de desenhista quando o tipo muda, e o resto (busca, previa,
     arrasto) nao precisa saber qual dos dois esta montado. */
  var atual = null;
  var relogio = null;

  function montaPara(config) {
    var tipo = config && config.tipo;
    /* Tres desenhistas: o de texto, o de lista e o da musica. Cada um tem uma
       forma diferente demais pros outros dois — forcar um so deixaria os tres
       piores. A pagina troca de desenhista quando o tipo muda, e o resto
       (busca, previa, arrasto) nao precisa saber qual esta montado. */
    var quer = (tipo === 'chat' || tipo === 'feed') ? 'chat'
             : (tipo === 'musica' ? 'musica' : 'relogio');
    if (atual === quer) return false;
    if (relogio) relogio.destroy();
    raiz.className = '';
    raiz.innerHTML = '';
    relogio = quer === 'chat'   ? Chat.mount(raiz, config)
            : quer === 'musica' ? Musica.mount(raiz, config)
            : Relogio.mount(raiz, config);
    atual = quer;
    raiz.classList.toggle('is-editando', editando);
    poeAlca();
    return true;
  }

  function desenha(config) {
    /* Se acabou de montar, o mount ja recebeu a config. */
    if (!montaPara(config)) relogio.update(config);
  }

  montaPara(Relogio.parseConfig());

  /* PREVIEW DO EDITOR.
     O hub mostra este mesmo arquivo num iframe e manda a config a cada
     ajuste. É o mesmo desenhista que vai pro OBS — então o que aparece na
     hora de editar é exatamente o que vai pro ar, e não uma imitação.
     Só aceito da mesma origem, e tudo passa pelo sanitize antes de virar CSS. */
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin) return;
    var d = e.data;
    if (!d) return;
    if (d.type === 'zc:config') desenha(d.config);
    if (d.type === 'zc:editar') ligaEdicao(!!d.on);
    /* Sem isso o editor do chat abre vazio e a pessoa nao ve o que esta
       ajustando ate alguem falar no chat naquele instante. */
    if (d.type === 'zc:exemplo' && relogio && relogio.exemplo) relogio.exemplo();
  });

  /* ------------------------------------------------------------------
     ARRASTAR AS PECAS

     So liga quando o editor pede. A fonte que roda no OBS nunca recebe
     essa mensagem, entao la nada disso existe — nem o tracejado, nem o
     cursor de mover, nem os ouvintes.

     Cada peca guarda o proprio deslocamento. Durante o arrasto eu escrevo
     direto na variavel de CSS, em vez de remontar o overlay a cada quadro:
     remontar redesenha o texto inteiro e recarrega fonte sessenta vezes por
     segundo pra mover uma coisa dez pixels.
     ------------------------------------------------------------------ */

  var ALVOS = [
    ['.rl__time',  'nx', 'ny', 'numero'],
    ['.rl__date',  'tx', 'ty', 'nome'],
    ['.rl__barra', 'bx', 'by', 'barra'],
    /* O chat tem uma caixa só: ela usa as mesmas chaves do número, porque
       nenhum overlay é chat E relógio ao mesmo tempo. */
    ['.ch__palco', 'nx', 'ny', 'caixa'],
    ['.mu__caixa', 'nx', 'ny', 'caixa'],
  ];

  var editando = false, arrasto = null;

  /* A alça de tamanho nasce junto do modo edição e morre com ele: a fonte
     que roda no OBS nunca recebe essa mensagem, então lá ela não existe. */
  var alca = null;

  function poeAlca() {
    if (alca && alca.parentNode) alca.parentNode.removeChild(alca);
    alca = null;
    if (!editando) return;

    var dono = raiz.querySelector('.ch__palco') || raiz.querySelector('.mu__caixa') || raiz.querySelector('.rl__box');
    if (!dono) return;
    alca = document.createElement('i');
    alca.className = 'rl__alca';
    alca.title = 'Puxe pro lado pra alargar, pra baixo pra aumentar a letra';
    dono.appendChild(alca);

    alca.addEventListener('pointerdown', function (e) {
      var c = relogio.config();
      arrasto = {
        alca: true, el: alca,
        x0: e.clientX, y0: e.clientY,
        larg: c.clarg || 0, tam: c.size || 0,
        temLarg: atual === 'chat',
      };
      try { alca.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
      e.stopPropagation();
    });
  }

  function ligaEdicao(on) {
    editando = on;
    raiz.classList.toggle('is-editando', on);
    if (!on && arrasto) soltar();
    poeAlca();
  }

  function avisa(tipo, dados) {
    try { window.parent.postMessage(Object.assign({ type: tipo }, dados), location.origin); } catch (e) {}
  }

  function soltar() {
    if (!arrasto) return;
    if (arrasto.el && arrasto.el.classList) arrasto.el.classList.remove('pegando');
    avisa('zc:soltou', {});
    arrasto = null;
  }

  raiz.addEventListener('pointerdown', function (e) {
    if (!editando) return;
    var alvo = null;
    for (var i = 0; i < ALVOS.length; i++) {
      var el = raiz.querySelector(ALVOS[i][0]);
      if (el && (el === e.target || el.contains(e.target))) { alvo = ALVOS[i]; break; }
    }
    if (!alvo) return;

    var el2 = raiz.querySelector(alvo[0]);
    var c = relogio.config();
    arrasto = {
      el: el2, kx: alvo[1], ky: alvo[2],
      x0: e.clientX, y0: e.clientY,
      vx: c[alvo[1]] || 0, vy: c[alvo[2]] || 0,
    };
    el2.classList.add('pegando');
    try { el2.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });

  raiz.addEventListener('pointermove', function (e) {
    if (!arrasto) return;

    if (arrasto.alca) {
      /* Horizontal muda a largura da caixa; vertical muda o tamanho da
         letra. Dois eixos, duas coisas — é o que dá pra fazer sem inventar
         um segundo sistema de medida só pro editor. */
      var c = relogio.config();
      var novo = {};
      for (var k in c) novo[k] = c[k];
      if (arrasto.temLarg) novo.clarg = Math.max(120, Math.min(1600, arrasto.larg + (e.clientX - arrasto.x0)));
      novo.size = Math.max(10, Math.min(400, Math.round(arrasto.tam + (e.clientY - arrasto.y0) * 0.4)));
      relogio.update(novo);
      poeAlca();
      avisa('zc:moveu', { valores: arrasto.temLarg ? { clarg: novo.clarg, size: novo.size } : { size: novo.size } });
      return;
    }

    var x = Math.round(arrasto.vx + (e.clientX - arrasto.x0));
    var y = Math.round(arrasto.vy + (e.clientY - arrasto.y0));
    /* Segurando Shift, trava no eixo que andou mais. Copiado do Photoshop
       porque e a forma mais rapida de alinhar sem mira nenhuma. */
    if (e.shiftKey) {
      if (Math.abs(e.clientX - arrasto.x0) > Math.abs(e.clientY - arrasto.y0)) y = arrasto.vy;
      else x = arrasto.vx;
    }
    if (atual === 'chat') {
      /* O chat monta o transform inteiro no JS (perspectiva + giro), então
         mexer só na variável não teria efeito: peço a ele pra redesenhar. */
      var c = relogio.config();
      c[arrasto.kx] = x; c[arrasto.ky] = y;
      relogio.update(c);
    } else {
      raiz.style.setProperty('--rl-' + arrasto.kx, x + 'px');
      raiz.style.setProperty('--rl-' + arrasto.ky, y + 'px');
    }
    var d = {}; d[arrasto.kx] = x; d[arrasto.ky] = y;
    avisa('zc:moveu', { valores: d });
  });

  raiz.addEventListener('pointerup', soltar);
  raiz.addEventListener('pointercancel', soltar);

  /* Dois cliques numa peca: o editor pula pro campo dela. E o caminho mais
     curto entre "quero mudar isso" e o lugar onde se muda. */
  raiz.addEventListener('dblclick', function (e) {
    if (!editando) return;
    for (var i = 0; i < ALVOS.length; i++) {
      var el = raiz.querySelector(ALVOS[i][0]);
      if (el && (el === e.target || el.contains(e.target))) {
        avisa('zc:escolheu', { peca: ALVOS[i][3] });
        return;
      }
    }
  });
  try { if (window.parent !== window) window.parent.postMessage({ type: 'zc:pronto' }, location.origin); } catch (e) {}

  if (!k) return;

  var ultimo = '', buscando = false;

  function buscar() {
    if (buscando) return;
    buscando = true;
    fetch(API + '/config-overlay.php?k=' + encodeURIComponent(k), { cache: 'no-store' })
      .then(function (r) {
        /* O cabeçalho Date da própria resposta diz a hora do servidor. É de
           graça, não depende de site de terceiro, e é o que mantém o subathon
           certo mesmo com o relógio da máquina torto. */
        var d = r.headers.get('Date');
        if (d) { var t = Date.parse(d); if (t) Relogio.ajustaRelogioDoServidor(t - Date.now()); }
        if (r.status === 304) return null;      /* nada mudou */
        return r.ok ? r.json() : null;
      })
      .then(function (j) {
        if (!j || !j.config) return;
        var s = JSON.stringify(j.config);
        if (s !== ultimo) { ultimo = s; desenha(j.config); }
        /* O feed muda sem a config mudar: sub novo nao e edicao de overlay. */
        if (j.eventos && relogio && relogio.feed) relogio.feed(j.eventos);
        /* undefined é "esta resposta não fala de música"; null é "não tem
           nada tocando". Só o segundo apaga a tela. */
        if (j.musica !== undefined && relogio && relogio.musica) relogio.musica(j.musica);
      })
      ['catch'](function () { /* servidor fora: fica com o que já está na tela */ })
      ['finally'](function () { buscando = false; });
  }

  /* Quem chama a busca é a BATIDA do relógio (Web Worker). O setInterval comum
     congela quando o OBS esconde a fonte — e aí o overlay para de atualizar
     justamente enquanto ninguém está olhando pra perceber. O intervalo aqui
     embaixo é só a reserva, pro caso do worker não nascer. */
  var ultimaBusca = 0;
  function talvezBuscar() {
    if (Date.now() - ultimaBusca < 15000) return;
    ultimaBusca = Date.now();
    buscar();
  }

  buscar();
  relogio.aoTique(talvezBuscar);
  setInterval(talvezBuscar, 15000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) buscar(); });
  window.addEventListener('obsSourceVisibleChanged', buscar);
})();
</script>
</body>
</html>
