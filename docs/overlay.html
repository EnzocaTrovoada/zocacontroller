<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<!-- A CHAVE VIAJA NA URL DESTA PÁGINA.
     Sem esta linha, todo pedido a servidor de fora (a fonte do Google, por
     exemplo) leva junto um cabeçalho Referer. Navegador atual só manda a
     origem e corta o resto, mas o CEF embutido no OBS costuma ficar
     versões atrás, e ali o endereço inteiro — com a chave — sairia de casa.
     no-referrer não manda nada, e não custa nada. -->
<title>Overlay — ZocaController</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="clock.css?v=33">
<link rel="stylesheet" href="chat.css?v=33">
<link rel="stylesheet" href="musica.css?v=33">
<link rel="stylesheet" href="alerta.css?v=33">
<link rel="stylesheet" href="spd.css?v=33">
<style>
  /* Fundo transparente: é isso que faz a Fonte de Navegador do OBS mostrar
     só o overlay, sem retângulo preto por trás. */
  /* "light dark" declara que a pagina serve nos dois esquemas. */
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }

  /* A MARCA DO PLANO GRÁTIS.

     Fica FORA da raiz do desenhista de propósito: assim nenhum tipo de
     overlay precisa saber que ela existe, e mexer no estilo do overlay não
     mexe nela. Position fixed no canto da fonte do OBS, sem empurrar nada —
     ela não pode mudar o layout de quem paga nem de quem não paga.

     Discreta o suficiente pra não estragar a live de quem está começando, e
     visível o suficiente pra ser o motivo de alguém assinar. O contorno
     escuro existe porque ela vai parar em cima de gameplay clara e escura. */
  .zc-marca {
    position: fixed; right: 6px; bottom: 4px; z-index: 2147483647;
    font: 600 11px/1 "Archivo", system-ui, sans-serif;
    letter-spacing: .06em; color: rgba(255, 255, 255, .62);
    text-shadow: 0 1px 2px rgba(0, 0, 0, .85), 0 0 6px rgba(0, 0, 0, .6);
    pointer-events: none; user-select: none; white-space: nowrap;
  }
  .zc-marca[hidden] { display: none; }
</style>
</head>
<body>

<div id="overlay"></div>
<div class="zc-marca" id="marca" hidden>zocahop.com</div>

<script src="clock.js?v=33"></script>
<script src="chat.js?v=33"></script>
<script src="musica.js?v=33"></script>
<script src="alerta.js?v=33"></script>
<script src="spd.js?v=33"></script>
<script>
(function () {
  'use strict';

  var API = 'https://api.zocahop.com';
  var raiz = document.getElementById('overlay');
  var marca = document.getElementById('marca');

  /* A chave vem na URL e é só de LEITURA: ela aparece em print, em VOD e em
     tutorial. Quem escreve é o painel, com a chave da conta no cabeçalho —
     que nunca passa por aqui. */
  var k = (new URLSearchParams(location.search).get('k') || '')
            .replace(/[^A-Za-z0-9_-]/g, '').slice(0, 64);

  /* DOIS DESENHISTAS, UMA PAGINA: O chat e uma LISTA que cresce; os
     outros sao um texto que se reescreve. */
  var atual = null;
  var relogio = null;

  function montaPara(config) {
    var tipo = config && config.tipo;
    /* Tres desenhistas: o de texto, o de lista e o da musica. */
    var quer = (tipo === 'chat' || tipo === 'feed') ? 'chat'
             : tipo === 'musica' ? 'musica'
             : tipo === 'alerta' ? 'alerta'
             : tipo === 'speedrun' ? 'speedrun' : 'relogio';
    if (atual === quer) return false;
    if (relogio) relogio.destroy();
    raiz.className = '';
    raiz.innerHTML = '';
    relogio = quer === 'chat'     ? Chat.mount(raiz, config)
            : quer === 'musica'   ? Musica.mount(raiz, config)
            : quer === 'alerta'   ? Alerta.mount(raiz, config)
            : quer === 'speedrun' ? Speedrun.mount(raiz, config)
            : Relogio.mount(raiz, config);
    atual = quer;
    raiz.classList.toggle('is-editando', editando);
    poeAlca();
    return true;
  }

  function desenha(config) {
    /* Se acabou de montar, o mount ja recebeu a config. */
    if (!montaPara(config)) relogio.update(config);
  }

  /* NADA NA TELA ATÉ SABER O QUE DESENHAR: Antes eu montava o desenhista
     já na carga, com a config que viesse na URL — e no modo link fixo não
     vem nenhuma, então o padrão valia: um RELÓGIO. */
  if (k) raiz.innerHTML = '';
  else montaPara(Relogio.parseConfig());

  /* PREVIEW DO EDITOR: O hub mostra este mesmo arquivo num iframe e manda
     a config a cada ajuste. */
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin) return;
    var d = e.data;
    if (!d) return;
    if (d.type === 'zc:config') desenha(d.config);
    if (d.type === 'zc:editar') ligaEdicao(!!d.on);
    /* Sem isso o editor do chat abre vazio e a pessoa nao ve o que esta
       ajustando ate alguem falar no chat naquele instante. */
    if (d.type === 'zc:exemplo' && relogio && relogio.exemplo) relogio.exemplo();
    /* O botão "Ouvir" do editor. Só a prévia recebe esta mensagem — a fonte
       que roda no OBS nunca toca som por pedido de ninguém. */
    if (d.type === 'zc:ouvir' && relogio && relogio.ouvir) relogio.ouvir();
    /* Só a prévia recebe estas duas: a fonte que roda no OBS nunca é
       comandada de fora, e é isso que a mantém previsível ao vivo. */
    if (d.type === 'zc:repetir' && relogio && relogio.mostrarDeNovo) relogio.mostrarDeNovo();
    if (d.type === 'zc:travar' && relogio && relogio.travar) relogio.travar(!!d.on);
  });

  /* ARRASTAR AS PECAS: So liga quando o editor pede. */

  var ALVOS = [
    ['.rl__time',  'nx', 'ny', 'numero'],
    ['.rl__date',  'tx', 'ty', 'nome'],
    ['.rl__barra', 'bx', 'by', 'barra'],
    /* O chat tem uma caixa só: ela usa as mesmas chaves do número, porque
       nenhum overlay é chat E relógio ao mesmo tempo. */
    ['.ch__palco', 'nx', 'ny', 'caixa'],
    ['.mu__caixa', 'nx', 'ny', 'caixa'],
    ['.al__caixa', 'nx', 'ny', 'caixa'],
  ];

  var editando = false, arrasto = null;

  /* A alça de tamanho nasce junto do modo edição e morre com ele: a fonte
     que roda no OBS nunca recebe essa mensagem, então lá ela não existe. */
  var alca = null;

  function poeAlca() {
    if (alca && alca.parentNode) alca.parentNode.removeChild(alca);
    alca = null;
    if (!editando) return;

    var dono = raiz.querySelector('.ch__palco') || raiz.querySelector('.mu__caixa') || raiz.querySelector('.rl__box');
    if (!dono) return;
    alca = document.createElement('i');
    alca.className = 'rl__alca';
    alca.title = 'Puxe pro lado pra alargar, pra baixo pra aumentar a letra';
    dono.appendChild(alca);

    alca.addEventListener('pointerdown', function (e) {
      var c = relogio.config();
      arrasto = {
        alca: true, el: alca,
        x0: e.clientX, y0: e.clientY,
        larg: c.clarg || 0, tam: c.size || 0,
        temLarg: atual === 'chat',
      };
      try { alca.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
      e.stopPropagation();
    });
  }

  function ligaEdicao(on) {
    editando = on;
    raiz.classList.toggle('is-editando', on);
    if (!on && arrasto) soltar();
    poeAlca();
  }

  function avisa(tipo, dados) {
    try { window.parent.postMessage(Object.assign({ type: tipo }, dados), location.origin); } catch (e) {}
  }

  function soltar() {
    if (!arrasto) return;
    if (arrasto.el && arrasto.el.classList) arrasto.el.classList.remove('pegando');
    avisa('zc:soltou', {});
    arrasto = null;
  }

  raiz.addEventListener('pointerdown', function (e) {
    if (!editando || !relogio) return;
    var alvo = null;
    for (var i = 0; i < ALVOS.length; i++) {
      var el = raiz.querySelector(ALVOS[i][0]);
      if (el && (el === e.target || el.contains(e.target))) { alvo = ALVOS[i]; break; }
    }
    if (!alvo) return;

    var el2 = raiz.querySelector(alvo[0]);
    var c = relogio.config();
    arrasto = {
      el: el2, kx: alvo[1], ky: alvo[2],
      x0: e.clientX, y0: e.clientY,
      vx: c[alvo[1]] || 0, vy: c[alvo[2]] || 0,
    };
    el2.classList.add('pegando');
    try { el2.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });

  raiz.addEventListener('pointermove', function (e) {
    if (!arrasto) return;

    if (arrasto.alca) {
      /* Horizontal muda a largura da caixa; vertical muda o tamanho da
         letra. Dois eixos, duas coisas — é o que dá pra fazer sem inventar
         um segundo sistema de medida só pro editor. */
      var c = relogio.config();
      var novo = {};
      for (var k in c) novo[k] = c[k];
      if (arrasto.temLarg) novo.clarg = Math.max(120, Math.min(1600, arrasto.larg + (e.clientX - arrasto.x0)));
      novo.size = Math.max(10, Math.min(400, Math.round(arrasto.tam + (e.clientY - arrasto.y0) * 0.4)));
      relogio.update(novo);
      poeAlca();
      avisa('zc:moveu', { valores: arrasto.temLarg ? { clarg: novo.clarg, size: novo.size } : { size: novo.size } });
      return;
    }

    var x = Math.round(arrasto.vx + (e.clientX - arrasto.x0));
    var y = Math.round(arrasto.vy + (e.clientY - arrasto.y0));
    /* Segurando Shift, trava no eixo que andou mais. Copiado do Photoshop
       porque e a forma mais rapida de alinhar sem mira nenhuma. */
    if (e.shiftKey) {
      if (Math.abs(e.clientX - arrasto.x0) > Math.abs(e.clientY - arrasto.y0)) y = arrasto.vy;
      else x = arrasto.vx;
    }
    if (atual === 'chat') {
      /* O chat monta o transform inteiro no JS (perspectiva + giro), então
         mexer só na variável não teria efeito: peço a ele pra redesenhar. */
      var c = relogio.config();
      c[arrasto.kx] = x; c[arrasto.ky] = y;
      relogio.update(c);
    } else {
      raiz.style.setProperty('--rl-' + arrasto.kx, x + 'px');
      raiz.style.setProperty('--rl-' + arrasto.ky, y + 'px');
    }
    var d = {}; d[arrasto.kx] = x; d[arrasto.ky] = y;
    avisa('zc:moveu', { valores: d });
  });

  raiz.addEventListener('pointerup', soltar);
  raiz.addEventListener('pointercancel', soltar);

  /* Dois cliques numa peca: o editor pula pro campo dela. E o caminho mais
     curto entre "quero mudar isso" e o lugar onde se muda. */
  raiz.addEventListener('dblclick', function (e) {
    if (!editando) return;
    for (var i = 0; i < ALVOS.length; i++) {
      var el = raiz.querySelector(ALVOS[i][0]);
      if (el && (el === e.target || el.contains(e.target))) {
        avisa('zc:escolheu', { peca: ALVOS[i][3] });
        return;
      }
    }
  });
  try { if (window.parent !== window) window.parent.postMessage({ type: 'zc:pronto' }, location.origin); } catch (e) {}

  if (!k) return;

  var ultimo = '', buscando = false, desenhou = false;
  var ultimaConfig = null;      /* quem decide o ritmo da busca precisa dela */

  function buscar(semCache) {
    if (buscando) return;
    buscando = true;
    /* 'no-cache' E NAO 'no-store' — a diferença aqui vale banda de
       verdade. */
    fetch(API + '/config-overlay.php?k=' + encodeURIComponent(k),
          { cache: semCache ? 'reload' : 'no-cache' })
      .then(function (r) {
        /* O cabeçalho Date da própria resposta diz a hora do servidor. É de
           graça, não depende de site de terceiro, e é o que mantém o subathon
           certo mesmo com o relógio da máquina torto. */
        var d = r.headers.get('Date');
        if (d) { var t = Date.parse(d); if (t) Relogio.ajustaRelogioDoServidor(t - Date.now()); }
        /* 304 ANTES DE TER DESENHADO É TELA PRETA PERMANENTE.

           "Nada mudou" só é uma resposta útil pra quem já tem algo na tela.
           Numa fonte recém-carregada no OBS não há nada desenhado, e o 304
           não traz corpo: sem este desvio, o overlay ficaria em branco e
           continuaria em branco a cada 15 segundos, porque o 304 seguiria
           chegando enquanto a config não mudasse. Aqui a gente pede de novo
           ignorando o cache, e aí vem o corpo. */
        if (r.status === 304) {
          if (!desenhou) setTimeout(function () { buscar(true); }, 300);
          return null;
        }
        return r.ok ? r.json() : null;
      })
      .then(function (j) {
        if (!j || !j.config) return;
        var s = JSON.stringify(j.config);
        ultimaConfig = j.config;
        if (s !== ultimo) { ultimo = s; desenha(j.config); }
        desenhou = true;
        /* O feed muda sem a config mudar: sub novo nao e edicao de overlay. */
        /* O mesmo canal serve o feed e o alerta: os dois vivem dos eventos.
           O que muda é o que cada um faz com eles — o feed lista, o alerta
           toca um de cada vez e só o que ainda não passou. */
        /* QUEM DECIDE É O SERVIDOR, SEMPRE.

           A marca aparece pelo que o config-overlay respondeu, e não por
           nada guardado aqui: a config do overlay é editável pelo dono, e um
           campo do tipo "sem marca" dentro dela seria só pedir pra alguém
           editar. Como isto vem junto da leitura que já acontece a cada 15
           segundos, assinar tira a marca sozinho, e a assinatura vencer traz
           ela de volta sozinho — sem ninguém recarregar nada no OBS. */
        if (j.recursos) marca.hidden = !j.recursos.marca_dagua;

        if (j.som !== undefined && relogio && relogio.som) relogio.som(j.som);
        if (j.eventos && relogio && relogio.feed) relogio.feed(j.eventos);
        /* undefined é "esta resposta não fala de música"; null é "não tem
           nada tocando". Só o segundo apaga a tela. */
        if (j.musica !== undefined && relogio && relogio.musica) relogio.musica(j.musica);
      })
      ['catch'](function () { /* servidor fora: fica com o que já está na tela */ })
      ['finally'](function () { buscando = false; });
  }

  /* Quem chama a busca é a BATIDA do relógio (Web Worker). */
  var ultimaBusca = 0;

  /* QUINZE SEGUNDOS É UMA ETERNIDADE NO MEIO DE UMA SPEEDRUN.

     O relógio em si não depende da busca — ele conta sozinho a partir de
     quando a corrida começou. O que depende é o SPLIT: enquanto a lista não
     chega, a tela mostra o trecho anterior. Quinze segundos de atraso ali
     seria a diferença aparecendo depois da pessoa já ter passado do próximo
     trecho.

     Então, e só enquanto uma corrida está de fato correndo, o pedido vai a
     cada dois segundos. Com o 304 funcionando isso custa poucos bytes por
     pedido, e para assim que a corrida para. */
  function intervaloDaBusca() {
    if (!ultimaConfig || ultimaConfig.tipo !== 'speedrun') return 15000;
    var corr = ultimaConfig.spcor;
    return (corr && corr.e === 'correndo') ? 2000 : 15000;
  }

  function talvezBuscar() {
    if (Date.now() - ultimaBusca < intervaloDaBusca()) return;
    ultimaBusca = Date.now();
    buscar();
  }

  /* O PULSO É DESTA PÁGINA, NÃO DO DESENHISTA: Antes o laço de busca
     pegava carona no tique do relógio. */
  buscar();

  (function () {
    try {
      var fonte = 'onmessage=function(){setInterval(function(){postMessage(0)},1000)}';
      var w = new Worker(URL.createObjectURL(new Blob([fonte], { type: 'text/javascript' })));
      w.onmessage = talvezBuscar;
      w.postMessage(0);
    } catch (e) { /* sem Worker: sobra o intervalo abaixo */ }
  })();

  setInterval(talvezBuscar, 15000);   /* reserva, se o Worker não nascer */
  document.addEventListener('visibilitychange', function () { if (!document.hidden) buscar(); });
  window.addEventListener('obsSourceVisibleChanged', buscar);
})();
</script>
</body>
</html>
