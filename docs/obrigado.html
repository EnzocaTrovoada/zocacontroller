<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pagamento — ZocaController</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icone.png?v=2" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Os mesmos tokens do painel, copiados porque esta página é uma folha
     solta: ela é o destino do Mercado Pago e precisa abrir sozinha, sem
     depender de nada do resto do site ter carregado. */
  :root {
    --disp: "Archivo", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --fundo: #F4F7F4; --caixa: #FFFFFF; --linha: #D8E4DD;
    --tinta: #101A14; --fraco: #57665C;
    --verde: #12A150; --verde-forte: #0B7A3C; --ambar: #B07D14; --perigo: #C4432B;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #0E1411; --caixa: #161F1A; --linha: #2A3830;
      --tinta: #E4EDE7; --fraco: #93A69B;
      --verde: #3DD47F; --verde-forte: #69E39C; --ambar: #E0A82E; --perigo: #E4735A;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; background: var(--fundo); color: var(--tinta);
    font: 15px/1.6 var(--mono); -webkit-font-smoothing: antialiased;
  }
  .caixa {
    width: 100%; max-width: 520px; background: var(--caixa);
    border: 1px solid var(--linha); padding: 34px 32px;
  }
  .marca {
    display: flex; align-items: center; gap: 9px; margin-bottom: 22px;
    font: 600 11px var(--mono); letter-spacing: .16em;
    text-transform: uppercase; color: var(--fraco);
  }
  h1 { margin: 0 0 10px; font: 700 27px/1.15 var(--disp); letter-spacing: -.02em; }
  p { margin: 0 0 14px; color: var(--fraco); }
  .bt {
    display: inline-block; margin-top: 8px; padding: 11px 18px;
    background: var(--verde); color: #fff; border: 0; text-decoration: none;
    font: 600 13px var(--disp); letter-spacing: .04em; cursor: pointer;
  }
  .bt:hover { background: var(--verde-forte); }
  .marcador { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>

<div class="caixa">
  <div class="marca">
    <svg width="18" height="18" viewBox="0 0 26 26" aria-hidden="true">
      <path d="M22 7.2A9.4 9.4 0 1 0 22 18.8" fill="none" stroke="var(--verde)" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M8.5 9h8l-8 8h8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    ZocaController
  </div>

  <h1 id="titulo">Voltando…</h1>
  <div id="texto"></div>

  <a class="bt" id="voltar" href="index.html#/meu">Voltar pro painel</a>
</div>

<script>
(function () {
  'use strict';

  /* O QUE ESTA PÁGINA NÃO FAZ: liberar acesso.

     Ela é só o lugar onde o Mercado Pago devolve a pessoa depois do
     checkout, e o endereço dela qualquer um digita — inclusive com
     "?r=ok" no fim. Quem libera é o webhook, no servidor, depois de
     perguntar ao Mercado Pago o que de fato aconteceu. Aqui só se explica
     o que esperar. */

  var r = (new URLSearchParams(location.search).get('r') || '').replace(/[^a-z]/g, '');

  var TELAS = {
    ok: {
      titulo: 'Pagamento recebido',
      cor: 'var(--verde)',
      texto: [
        'O Mercado Pago confirmou. A liberação no site acontece em alguns segundos, '
        + 'quando o aviso deles chegar aqui.',
        'Volte pro painel e recarregue a página. Se depois de um minuto ainda estiver '
        + 'no plano grátis, use o botão <b>Já paguei</b> em Meu Controller — ele pergunta '
        + 'direto ao Mercado Pago e resolve.',
      ],
    },
    processando: {
      titulo: 'Pagamento em processamento',
      cor: 'var(--ambar)',
      texto: [
        'O Mercado Pago ainda está confirmando. Com Pix isso costuma levar segundos; '
        + 'com cartão pode levar alguns minutos.',
        'Você não precisa pagar de novo. Assim que eles confirmarem, a liberação é automática.',
      ],
    },
    falhou: {
      titulo: 'O pagamento não passou',
      cor: 'var(--perigo)',
      texto: [
        'Nada foi cobrado de você.',
        'Dá pra tentar de novo pelo painel, com outro cartão ou por Pix.',
      ],
    },
  };

  var t = TELAS[r] || {
    titulo: 'Tudo certo por aqui',
    cor: 'var(--fraco)',
    texto: ['Esta é a página de retorno do pagamento. Se você chegou aqui sem pagar nada, '
          + 'pode fechar tranquilo.'],
  };

  document.getElementById('titulo').textContent = t.titulo;

  var cx = document.getElementById('texto');
  var pt = document.createElement('p');
  var bola = document.createElement('span');
  bola.className = 'marcador';
  bola.style.background = t.cor;
  pt.appendChild(bola);
  cx.appendChild(pt);

  t.texto.forEach(function (linha) {
    var p = document.createElement('p');
    /* O innerHTML aqui é seguro porque o texto é NOSSO, escrito acima, e
       nada do que veio na URL entra nele — o 'r' só escolhe qual dos três
       blocos aparece, e já foi limpo de tudo que não é letra. */
    p.innerHTML = linha;
    cx.appendChild(p);
  });
})();
</script>

</body>
</html>
